<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 508" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">온칼로의 KBS-3 다중방벽 개념도와 핀란드·한국 사용후핵연료 처분 시간표 비교</title>
  <rect x="0" y="0" width="720" height="508" fill="#f8faf9"/>

  <text x="20" y="32" font-size="18" font-weight="800" fill="#1f2937">온칼로 운영허가: 겹겹의 방벽과 두 나라의 시간표</text>
  <text x="20" y="54" font-size="12" fill="#6b7280">허가는 2026년 10월 22일, 실제 처분은 STUK 최종 검사 뒤에야 시작됩니다</text>

  <!-- 패널 1: KBS-3 다중방벽 -->
  <rect x="20" y="70" width="330" height="330" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="36" y="96" font-size="14" font-weight="800" fill="#1f2937">① KBS-3 다중방벽 (개념도)</text>

  <!-- 암반 -->
  <rect x="40" y="114" width="130" height="270" rx="4" fill="#d1d5db"/>
  <!-- 벤토나이트 -->
  <rect x="60" y="134" width="90" height="232" rx="4" fill="#fde7c2"/>
  <!-- 구리 -->
  <rect x="78" y="154" width="54" height="194" rx="6" fill="#f5a623"/>
  <!-- 주철 -->
  <rect x="85" y="161" width="40" height="180" rx="3" fill="#6b7280"/>
  <!-- 연료 -->
  <rect x="91" y="170" width="8" height="162" rx="2" fill="#0b6e4f"/>
  <rect x="101" y="170" width="8" height="162" rx="2" fill="#0b6e4f"/>
  <rect x="111" y="170" width="8" height="162" rx="2" fill="#0b6e4f"/>

  <!-- 라벨: 암반 -->
  <line x1="166" y1="130" x2="186" y2="130" stroke="#1f2937" stroke-width="1"/>
  <text x="190" y="128" font-size="13" font-weight="700" fill="#1f2937">④ 결정질 암반</text>
  <text x="190" y="145" font-size="12" fill="#6b7280">지하 약 400~450m</text>

  <!-- 라벨: 벤토나이트 -->
  <line x1="146" y1="196" x2="186" y2="196" stroke="#1f2937" stroke-width="1"/>
  <text x="190" y="194" font-size="13" font-weight="700" fill="#1f2937">③ 벤토나이트</text>
  <text x="190" y="211" font-size="12" fill="#6b7280">물 만나면 부풀어</text>
  <text x="190" y="226" font-size="12" fill="#6b7280">틈을 메우는 점토</text>

  <!-- 라벨: 구리 -->
  <line x1="129" y1="262" x2="186" y2="262" stroke="#1f2937" stroke-width="1"/>
  <text x="190" y="260" font-size="13" font-weight="700" fill="#1f2937">② 구리 껍데기 5cm</text>
  <text x="190" y="277" font-size="12" fill="#6b7280">산소 없는 물에서</text>
  <text x="190" y="292" font-size="12" fill="#6b7280">안정한 부식 방벽</text>

  <!-- 라벨: 주철 -->
  <line x1="122" y1="326" x2="186" y2="326" stroke="#1f2937" stroke-width="1"/>
  <text x="190" y="324" font-size="13" font-weight="700" fill="#1f2937">① 주철 인서트</text>
  <text x="190" y="341" font-size="12" fill="#6b7280">하중 지지, 연료 고정</text>
  <text x="190" y="356" font-size="12" fill="#6b7280">(OL1·2 연료 12다발)</text>

  <text x="190" y="384" font-size="12" fill="#0b6e4f">■ 사용후핵연료</text>

  <!-- 패널 2: 시간표 -->
  <rect x="370" y="70" width="330" height="330" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="386" y="96" font-size="14" font-weight="800" fill="#1f2937">② 핀란드와 한국의 시간표</text>

  <text x="386" y="122" font-size="13" font-weight="800" fill="#0b6e4f">핀란드</text>
  <text x="546" y="122" font-size="13" font-weight="800" fill="#b45309">한국 (초안 목표)</text>
  <line x1="536" y1="110" x2="536" y2="388" stroke="#d1d5db" stroke-width="1"/>

  <!-- 핀란드 -->
  <text x="386" y="146" font-size="12" font-weight="700" fill="#1f2937">1983</text>
  <text x="386" y="161" font-size="12" fill="#6b7280">정부 일정표 결정</text>
  <text x="386" y="184" font-size="12" font-weight="700" fill="#1f2937">2001</text>
  <text x="386" y="199" font-size="12" fill="#6b7280">국회 부지 비준</text>
  <text x="386" y="222" font-size="12" font-weight="700" fill="#1f2937">2015</text>
  <text x="386" y="237" font-size="12" fill="#6b7280">건설허가</text>
  <text x="386" y="260" font-size="12" font-weight="700" fill="#1f2937">2021.12</text>
  <text x="386" y="275" font-size="12" fill="#6b7280">운영허가 신청</text>
  <text x="386" y="298" font-size="12" font-weight="700" fill="#1f2937">2026.8.4</text>
  <text x="386" y="313" font-size="12" fill="#6b7280">STUK 긍정 의견</text>
  <rect x="380" y="322" width="148" height="34" rx="4" fill="#0b6e4f"/>
  <text x="386" y="336" font-size="12" font-weight="700" style="fill:#fff">2026.10.22</text>
  <text x="386" y="351" font-size="12" style="fill:#fff">정부 운영허가</text>
  <text x="386" y="374" font-size="12" font-weight="700" fill="#b45309">날짜 미정</text>
  <text x="386" y="389" font-size="12" fill="#6b7280">STUK 검사 뒤 처분</text>

  <!-- 한국 -->
  <text x="546" y="146" font-size="12" font-weight="700" fill="#1f2937">2025</text>
  <text x="546" y="161" font-size="12" fill="#6b7280">고준위 특별법</text>
  <text x="546" y="184" font-size="12" font-weight="700" fill="#1f2937">2027</text>
  <text x="546" y="199" font-size="12" fill="#6b7280">지자체 부지 공모</text>
  <text x="546" y="222" font-size="12" font-weight="700" fill="#1f2937">2028~2033</text>
  <text x="546" y="237" font-size="12" fill="#6b7280">기본조사</text>
  <text x="546" y="260" font-size="12" font-weight="700" fill="#1f2937">~2037</text>
  <text x="546" y="275" font-size="12" fill="#6b7280">심층조사</text>
  <text x="546" y="298" font-size="12" font-weight="700" fill="#1f2937">2038</text>
  <text x="546" y="313" font-size="12" fill="#6b7280">부지 확정</text>
  <text x="546" y="336" font-size="12" font-weight="700" fill="#1f2937">2050 이전</text>
  <text x="546" y="351" font-size="12" fill="#6b7280">중간저장 운영</text>
  <text x="546" y="374" font-size="12" font-weight="700" fill="#1f2937">2060 이전</text>
  <text x="546" y="389" font-size="12" fill="#6b7280">처분시설 운영</text>

  <!-- 하단 요약 -->
  <rect x="20" y="414" width="680" height="54" rx="10" fill="#0b6e4f"/>
  <text x="36" y="437" font-size="13" font-weight="700" style="fill:#fff">운영허가 조건: 2070년 말까지 · 사용후핵연료 최대 6,500tU(캐니스터 약 3,300개)</text>
  <text x="36" y="457" font-size="12" style="fill:#fff">허가 뒤 10년 안에 주기적 안전성 평가 · 운영허가 ≠ 처분 시작</text>

  <text x="20" y="488" font-size="10.5" fill="#6b7280">자료: 핀란드 정부·Posiva(2026.10.22), STUK(2026.8.4), World Nuclear News(2026.10.23), Posiva 처분용기 자료,</text>
  <text x="20" y="502" font-size="10.5" fill="#6b7280">제3차 고준위 기본계획 초안(2026.11.3)·전자신문·머니투데이방송 보도. 2026년 11월 12일 기준, 왼쪽 그림은 축척 아님</text>
</svg>

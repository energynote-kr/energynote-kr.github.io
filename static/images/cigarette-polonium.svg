<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="t">
<title id="t">토양의 라돈이 담뱃잎에 붙어 흡입·기관지 침착으로 이어지는 경로와 연간 방사선량 비교</title>
<rect x="0" y="0" width="760" height="500" fill="#f8faf9"/>

<text x="20" y="28" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="18" font-weight="700" fill="#1f2937">토양에서 기관지까지 — 담배 속 폴로늄-210</text>
<text x="20" y="46" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#6b7280">라돈 붕괴생성물이 잎에 붙어 몸속까지 들어가는 경로</text>

<!-- Pathway boxes -->
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
</marker>
</defs>

<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<!-- Box 1 -->
<rect x="20" y="64" width="162" height="76" rx="8" fill="#ffffff" stroke="#0b6e4f" stroke-width="2"/>
<text x="101" y="88" text-anchor="middle" font-size="13" fill="#1f2937">토양 속 라듐-226</text>
<text x="101" y="106" text-anchor="middle" font-size="12" fill="#6b7280">(인산비료 유래)</text>
<text x="101" y="124" text-anchor="middle" font-size="12" fill="#6b7280">라돈-222로 붕괴</text>

<!-- Box 2 -->
<rect x="206" y="64" width="162" height="76" rx="8" fill="#ffffff" stroke="#0b6e4f" stroke-width="2"/>
<text x="287" y="88" text-anchor="middle" font-size="13" fill="#1f2937">라돈 붕괴생성물</text>
<text x="287" y="106" text-anchor="middle" font-size="12" fill="#6b7280">Pb-210·Po-210이</text>
<text x="287" y="124" text-anchor="middle" font-size="12" fill="#6b7280">잎 잔털(트리콤)에 부착</text>

<!-- Box 3 -->
<rect x="392" y="64" width="162" height="76" rx="8" fill="#ffffff" stroke="#0b6e4f" stroke-width="2"/>
<text x="473" y="94" text-anchor="middle" font-size="13" fill="#1f2937">흡연 시</text>
<text x="473" y="114" text-anchor="middle" font-size="12" fill="#6b7280">연기와 함께 흡입</text>

<!-- Box 4 -->
<rect x="578" y="64" width="162" height="76" rx="8" fill="#ffffff" stroke="#f5a623" stroke-width="2"/>
<text x="659" y="88" text-anchor="middle" font-size="13" fill="#1f2937">기관지 상피에</text>
<text x="659" y="106" text-anchor="middle" font-size="12" fill="#6b7280">국소 침착</text>
<text x="659" y="124" text-anchor="middle" font-size="12" fill="#6b7280">(알파선 집중)</text>

<!-- Arrows -->
<line x1="184" y1="102" x2="204" y2="102" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="370" y1="102" x2="390" y2="102" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="556" y1="102" x2="576" y2="102" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
</g>

<!-- Chart -->
<text x="20" y="166" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="14" font-weight="700" fill="#1f2937">연간 방사선량 비교 (μSv, 전신 유효선량 기준)</text>
<text x="20" y="182" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="11" fill="#6b7280">※ 담배 수치는 문헌마다 편차가 크며, 아래는 2022년 폴란드 연구 기준</text>

<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<!-- Row 1: 자연방사선 3000 -->
<text x="145" y="209" text-anchor="end" font-size="13" fill="#1f2937">자연방사선(연간)</text>
<rect x="150" y="194" width="223" height="26" fill="#6b7280"/>
<text x="381" y="211" font-size="12" fill="#1f2937">약 3,000μSv</text>

<!-- Row 2: CT 7000 -->
<text x="145" y="253" text-anchor="end" font-size="13" fill="#1f2937">흉부 CT 1회</text>
<rect x="150" y="238" width="520" height="26" fill="#f5a623"/>
<text x="660" y="255" text-anchor="end" font-size="12" style="fill:#fff">약 7,000μSv</text>

<!-- Row 3: 담배 158 -->
<text x="145" y="297" text-anchor="end" font-size="13" fill="#1f2937">담배 하루 한 갑</text>
<rect x="150" y="282" width="12" height="26" fill="#0b6e4f"/>
<text x="170" y="299" font-size="12" fill="#1f2937">약 158μSv</text>
</g>

<!-- Callout box -->
<rect x="20" y="326" width="720" height="128" rx="10" fill="#ffffff" stroke="#f5a623" stroke-width="2"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<text x="40" y="352" font-size="15" font-weight="700" fill="#1f2937">기관지 상피 국소선량은 척도가 다릅니다</text>
<text x="40" y="376" font-size="13" fill="#1f2937">폴로늄-210은 알파선을 좁은 부위에 쏟아부어, 담배 연기가 닿는</text>
<text x="40" y="394" font-size="13" fill="#1f2937">기관지 갈림부(분기부)만 국소적으로 훨씬 크게 받습니다.</text>
<text x="40" y="418" font-size="13" font-weight="700" fill="#0b6e4f">2갑/일 흡연 시 국소선량 최대 연간 0.4Sv(40만μSv)</text>
<text x="40" y="438" font-size="13" fill="#6b7280">— 위 그래프 최댓값(흉부 CT)의 약 57배 (Radford &amp; Hunt, 1964)</text>
</g>

<text x="20" y="470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="10" fill="#6b7280">자료: Boryło 등(2022) IJERPH 19(4); Zagà 등(2011) J. Oncology(Radford &amp; Hunt 1964 인용 포함)</text>
<text x="20" y="484" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="10" fill="#6b7280">국내 자연방사선·CT 수치는 기존 확인값 사용 — 2026-09-22 확인</text>
</svg>

  <text x="20" y="48" class="sub">해안 5개 부지 32기 · 정격출력 MW · WH2/WH3 = 웨스팅하우스 2·3루프, CP1 = 프라마톰, OPR = OPR1000, APR = APR1400</text>

  <!-- Legend -->

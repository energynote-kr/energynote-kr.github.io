  <text x="20" y="537" class="sub">새울 3호기는 운영허가(2025.12.30)를 받았지만 상업운전 전까지는 '건설 중'으로 집계됩니다.</text>
  <text x="20" y="551" class="sub">2026년 9월 기준 · 출처: 원안위 원자력안전정보공개센터, 한수원, WNA</text>

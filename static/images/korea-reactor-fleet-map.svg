    <rect x="98" y="60" width="12" height="12" rx="3" fill="#0b6e4f" stroke="#f5a623" stroke-width="2" stroke-dasharray="3 2"/><text x="114" y="70">정지 중 · 계속운전 심의 대기</text>
    <rect x="300" y="60" width="12" height="12" rx="3" fill="#ffffff" stroke="#0b6e4f" stroke-width="2"/><text x="316" y="70">시운전 중</text>
    <rect x="404" y="60" width="12" height="12" rx="3" fill="#f5a623"/><text x="420" y="70">건설 중</text>

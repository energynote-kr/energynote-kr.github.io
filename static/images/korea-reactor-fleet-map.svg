<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">한국 원전 32기를 고리·새울·월성·한빛·한울 다섯 부지 열로 배치하고, 호기 상자를 운영 중·정지 중(계속운전 심의 대기)·시운전 중·건설 중·영구정지 상태별 색으로 구분한 지도</title>
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1f2937; }
    .sub { font-size: 11px; fill: #6b7280; }
    .site { font-size: 13px; font-weight: 800; fill: #1f2937; }
    .site2 { font-size: 10px; fill: #6b7280; }
    .u { font-size: 10.5px; font-weight: 700; }
    .u2 { font-size: 9.5px; }
    .leg { font-size: 10.5px; fill: #1f2937; }

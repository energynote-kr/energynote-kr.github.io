<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 508" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">정지 뒤 붕괴열 감소, 저장조 자리의 구성, 연료가 원자로에서 중간저장까지 가는 흐름과 건식저장이 막히면 저장조가 차는 지점</title>
  <rect x="0" y="0" width="720" height="508" fill="#f8faf9"/>

  <text x="20" y="32" font-size="18" font-weight="800" fill="#1f2937">저장조가 꽉 차면 원전은 언제 멈추나</text>
  <text x="20" y="54" font-size="12" fill="#6b7280">붕괴열은 빠르게 줄지만 0이 아니고, 저장조에는 다음 교체분과 비상 하역 공간이 필요합니다</text>

  <!-- 패널 1: 붕괴열 -->
  <rect x="20" y="70" width="330" height="232" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="36" y="96" font-size="14" font-weight="800" fill="#1f2937">① 정지 뒤 붕괴열</text>
  <text x="36" y="115" font-size="12" fill="#6b7280">정지 전 정격 출력 대비</text>

  <text x="36" y="144" font-size="12" fill="#1f2937">정지 순간</text>
  <rect x="112" y="130" width="180" height="20" rx="3" fill="#f5a623"/>
  <text x="298" y="145" font-size="12" font-weight="700" fill="#1f2937">6.5%</text>

  <text x="36" y="176" font-size="12" fill="#1f2937">1시간 뒤</text>
  <rect x="112" y="162" width="42" height="20" rx="3" fill="#0b6e4f"/>
  <text x="160" y="177" font-size="12" font-weight="700" fill="#1f2937">1.5%</text>

  <text x="36" y="208" font-size="12" fill="#1f2937">하루 뒤</text>
  <rect x="112" y="194" width="11" height="20" rx="2" fill="#0b6e4f"/>
  <text x="129" y="209" font-size="12" font-weight="700" fill="#1f2937">0.4%</text>

  <text x="36" y="240" font-size="12" fill="#1f2937">일주일 뒤</text>
  <rect x="112" y="226" width="6" height="20" rx="2" fill="#0b6e4f"/>
  <text x="124" y="241" font-size="12" font-weight="700" fill="#1f2937">0.2%</text>

  <text x="36" y="270" font-size="11.5" fill="#6b7280">물속에서 수년 식힌 뒤에야 공기로 식히는</text>
  <text x="36" y="286" font-size="11.5" fill="#6b7280">건식 용기로 옮길 수 있음</text>

  <!-- 패널 2: 저장조 자리 -->
  <rect x="370" y="70" width="330" height="232" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="386" y="96" font-size="14" font-weight="800" fill="#1f2937">② 저장조 자리 (개념도)</text>
  <text x="386" y="115" font-size="12" fill="#6b7280">비율은 설명용, 실제 원전과 다름</text>

  <rect x="386" y="128" width="180" height="40" fill="#0b6e4f"/>
  <rect x="566" y="128" width="50" height="40" fill="#ffffff" stroke="#0b6e4f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="616" y="128" width="68" height="40" fill="#f5a623"/>
  <text x="476" y="153" font-size="12" font-weight="700" text-anchor="middle" style="fill:#fff">쌓인 연료</text>

  <rect x="386" y="182" width="14" height="14" fill="#0b6e4f"/>
  <text x="408" y="194" font-size="12" fill="#1f2937">이미 쌓인 사용후핵연료</text>
  <rect x="386" y="204" width="14" height="14" fill="#ffffff" stroke="#0b6e4f" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="408" y="216" font-size="12" fill="#1f2937">다음 교체분: 정비 때 꺼낼 연료 자리</text>
  <rect x="386" y="226" width="14" height="14" fill="#f5a623"/>
  <text x="408" y="238" font-size="12" fill="#1f2937">비상 하역 공간: 노심 전체를 꺼낼 자리</text>

  <text x="386" y="270" font-size="11.5" font-weight="700" fill="#0b6e4f">점선 칸이 모자라면 꺼낼 곳이 없어</text>
  <text x="386" y="286" font-size="11.5" font-weight="700" fill="#0b6e4f">연료를 못 바꾸고 재가동 불가</text>

  <!-- 패널 3: 흐름 -->
  <text x="20" y="332" font-size="14" font-weight="800" fill="#1f2937">③ 연료가 가는 길과 막히는 지점</text>

  <rect x="20" y="346" width="150" height="62" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="95" y="370" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">원자로</text>
  <text x="95" y="389" font-size="11" text-anchor="middle" fill="#6b7280">정비 때 연료의</text>
  <text x="95" y="403" font-size="11" text-anchor="middle" fill="#6b7280">1/4~1/3 교체</text>

  <rect x="196" y="346" width="150" height="62" rx="8" fill="#ffffff" stroke="#0b6e4f" stroke-width="2"/>
  <text x="271" y="370" font-size="13" font-weight="700" text-anchor="middle" fill="#0b6e4f">저장조(습식)</text>
  <text x="271" y="389" font-size="11" text-anchor="middle" fill="#6b7280">물이 식히고</text>
  <text x="271" y="403" font-size="11" text-anchor="middle" fill="#6b7280">방사선을 막음</text>

  <rect x="372" y="346" width="150" height="62" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="447" y="370" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">건식저장(부지 내)</text>
  <text x="447" y="389" font-size="11" text-anchor="middle" fill="#6b7280">수년 식힌 연료를</text>
  <text x="447" y="403" font-size="11" text-anchor="middle" fill="#6b7280">용기에 담아 보관</text>

  <rect x="548" y="346" width="152" height="62" rx="8" fill="#ffffff" stroke="#6b7280" stroke-dasharray="5 3"/>
  <text x="624" y="370" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">중간저장·처분</text>
  <text x="624" y="389" font-size="11" text-anchor="middle" fill="#6b7280">2050·2060년 이전</text>
  <text x="624" y="403" font-size="11" text-anchor="middle" fill="#6b7280">운영 목표(부지 미정)</text>

  <g stroke="#6b7280" stroke-width="2" fill="none">
    <line x1="171" y1="377" x2="190" y2="377"/>
    <line x1="523" y1="377" x2="542" y2="377"/>
  </g>
  <g fill="#6b7280">
    <polygon points="195,377 188,372 188,382"/>
    <polygon points="547,377 540,372 540,382"/>
  </g>
  <line x1="347" y1="377" x2="366" y2="377" stroke="#f5a623" stroke-width="2.5"/>
  <polygon points="371,377 364,372 364,382" fill="#f5a623"/>
  <circle cx="359" cy="427" r="9" fill="#f5a623"/>
  <text x="359" y="431" font-size="12" font-weight="800" text-anchor="middle" style="fill:#fff">!</text>
  <text x="374" y="432" font-size="12" font-weight="700" fill="#1f2937">이 길이 막히면 저장조가 차고, 원자로 연료 교체가 막힘</text>
  <text x="374" y="449" font-size="11" fill="#6b7280">예: 대만 궈성 1호기 2016년 운전 금지·2021년 조기 영구정지</text>

  <text x="20" y="480" font-size="10.5" fill="#6b7280">붕괴열: 세계원자력협회(WNA) 'Nuclear Power Reactors' · 비상 하역 공간: 미국 국립연구회의(2006) · 궈성: WNN(2021.7.1), PBNC 2018</text>
  <text x="20" y="496" font-size="10.5" fill="#6b7280">2050·2060년 목표: 고준위 특별법·제3차 기본계획 초안(2026년 11월 공개) · 2026년 11월 9일 기준</text>
</svg>

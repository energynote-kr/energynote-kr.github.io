<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">바라카 원전이 2009년 계약에서 2024년 전체 가동까지 온 과정과, 2026년 UAE 전력의 약 4분의 1을 공급하는 현황, 연간 발전량 40테라와트시, 1호기 가동률 82.8퍼센트, 한전-한수원 11억 달러 비용 분쟁을 보여주는 타임라인</title>
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1f2937; }
    .sub { font-size: 11px; fill: #6b7280; }
    .year { font-size: 13px; font-weight: 800; fill: #0b6e4f; }
    .ev { font-size: 11.5px; font-weight: 700; fill: #1f2937; }
    .small { font-size: 10.5px; fill: #5a6472; }
    .stat-n { font-size: 19px; font-weight: 800; fill: #0b6e4f; }
    .stat-l { font-size: 10.5px; fill: #1f2937; }
  </style>
  <rect x="0" y="0" width="720" height="390" fill="#f8faf9"/>
  <text x="20" y="30" class="title">바라카, 2009~2026: 계약에서 완전 가동까지</text>
  <text x="20" y="48" class="sub">한국의 첫 완공 원전 수출, APR1400 4기 · 주요 일정</text>

  <line x1="40" y1="170" x2="690" y2="170" stroke="#c9c6bd" stroke-width="4"/>

  <g fill="#0b6e4f">
    <circle cx="60" cy="170" r="7"/>
    <circle cx="160" cy="170" r="7"/>
    <circle cx="380" cy="170" r="7"/>
  </g>
  <g fill="#f5a623">
    <circle cx="450" cy="170" r="7"/>
    <circle cx="520" cy="170" r="7"/>
    <circle cx="590" cy="170" r="7"/>
  </g>
  <circle cx="660" cy="170" r="7" fill="#1f2937"/>

  <text x="60" y="100" class="year" text-anchor="middle">2009.12</text>
  <text x="60" y="116" class="ev" text-anchor="middle">계약 체결</text>
  <text x="60" y="130" class="small" text-anchor="middle">204억달러 4기</text>

  <text x="160" y="100" class="year" text-anchor="middle">2012.7</text>
  <text x="160" y="116" class="ev" text-anchor="middle">착공</text>
  <text x="160" y="130" class="small" text-anchor="middle">FANR면허 다음날</text>

  <text x="380" y="100" class="year" text-anchor="middle">2021.4</text>
  <text x="380" y="116" class="ev" text-anchor="middle">1호기 상업운전</text>
  <text x="380" y="130" class="small" text-anchor="middle">아랍권 첫 원전</text>

  <text x="450" y="200" class="year" text-anchor="middle">2022.3</text>
  <text x="450" y="216" class="ev" text-anchor="middle">2호기</text>

  <text x="520" y="200" class="year" text-anchor="middle">2023.2</text>
  <text x="520" y="216" class="ev" text-anchor="middle">3호기</text>

  <text x="590" y="200" class="year" text-anchor="middle">2024.9</text>
  <text x="590" y="216" class="ev" text-anchor="middle">4호기</text>
  <text x="590" y="230" class="small" text-anchor="middle">전체 가동 완료</text>

  <text x="660" y="200" class="year" text-anchor="middle">2026</text>
  <text x="660" y="216" class="ev" text-anchor="middle">1호기 5년</text>

  <g>
    <rect x="20" y="256" width="150" height="66" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="34" y="284" class="stat-n">~25%</text>
    <text x="34" y="300" class="stat-l">UAE 전력의(2025)</text>
    <text x="34" y="313" class="small">출처: ENEC</text>

    <rect x="185" y="256" width="150" height="66" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="199" y="284" class="stat-n">~40TWh</text>
    <text x="199" y="300" class="stat-l">연간 발전량</text>
    <text x="199" y="313" class="small">출처: ENEC</text>

    <rect x="350" y="256" width="150" height="66" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="364" y="284" class="stat-n">82.8%</text>
    <text x="364" y="300" class="stat-l">1호기 가동률(2025)</text>
    <text x="364" y="313" class="small">출처: WNA/IAEA PRIS</text>

    <rect x="515" y="256" width="150" height="66" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="529" y="284" class="stat-n">11억달러</text>
    <text x="529" y="300" class="stat-l">한전-한수원 분쟁금액</text>
    <text x="529" y="313" class="small">2026.5 KCAB 제소</text>
  </g>

  <g class="small">
    <circle cx="30" cy="345" r="6" fill="#0b6e4f"/>
    <text x="42" y="349">계약·건설</text>
    <circle cx="150" cy="345" r="6" fill="#f5a623"/>
    <text x="162" y="349">2~4호기 상업운전</text>
    <circle cx="330" cy="345" r="6" fill="#1f2937"/>
    <text x="342" y="349">5년 시점</text>
  </g>

  <text x="20" y="372" class="sub">2026년 9월 기준. 자료: ENEC, 세계원자력협회(WNA), IAEA PRIS, 코리아타임스·서울경제</text>
</svg>

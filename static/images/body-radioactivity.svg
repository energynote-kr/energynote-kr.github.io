<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif">
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1e2430; }
    .label { font-size: 13.5px; fill: #1e2430; }
    .big { font-size: 22px; font-weight: 800; fill: #0b6e4f; }
    .small { font-size: 11.5px; fill: #5a6472; }
  </style>
  <text x="20" y="30" class="title">성인 몸속에서 매초 일어나는 핵붕괴</text>

  <!-- 사람 실루엣 -->
  <circle cx="130" cy="95" r="26" fill="#0b6e4f"/>
  <rect x="100" y="125" width="60" height="90" rx="18" fill="#0b6e4f"/>
  <rect x="104" y="212" width="20" height="70" rx="8" fill="#0b6e4f"/>
  <rect x="136" y="212" width="20" height="70" rx="8" fill="#0b6e4f"/>
  <rect x="80" y="130" width="16" height="70" rx="8" fill="#0b6e4f"/>
  <rect x="164" y="130" width="16" height="70" rx="8" fill="#0b6e4f"/>
  <!-- 반짝임 (붕괴) -->
  <g fill="#f5a623">
    <circle cx="118" cy="150" r="3"/><circle cx="142" cy="170" r="3"/><circle cx="125" cy="195" r="3"/>
    <circle cx="150" cy="140" r="3"/><circle cx="112" cy="178" r="3"/>
  </g>

  <!-- 수치 -->
  <text x="230" y="95" class="label">칼륨-40 (K-40)</text>
  <text x="230" y="122" class="big">약 4,000~5,000 Bq</text>
  <text x="230" y="140" class="small">몸속 칼륨 100g+ 중 0.012%가 방사성 · 반감기 약 12억 년</text>

  <text x="230" y="180" class="label">탄소-14 (C-14)</text>
  <text x="230" y="207" class="big">약 3,000 Bq</text>
  <text x="230" y="225" class="small">우주방사선이 대기에서 끊임없이 만들어 몸에 들어옴</text>

  <line x1="230" y1="245" x2="690" y2="245" stroke="#e6e4de" stroke-width="1.5"/>
  <text x="230" y="272" class="label" font-weight="700">합계 약 8,000번 / 초</text>
  <text x="230" y="292" class="small">→ 음식 유래 내부피폭 연 약 0.3mSv (자연방사선 약 3mSv의 일부로 원래 포함)</text>

  <rect x="20" y="308" width="680" height="26" fill="#e3f2ec" rx="8"/>
  <text x="40" y="326" class="small" font-size="12.5">비교: 바나나 1개 ≈ 15Bq. 먹어도 항상성 때문에 몸속 총량은 늘지 않습니다.</text>
</svg>

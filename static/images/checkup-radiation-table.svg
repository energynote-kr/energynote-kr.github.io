<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif">
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1e2430; }
    .label { font-size: 13px; fill: #1e2430; }
    .value { font-size: 13px; font-weight: 700; fill: #0b6e4f; }
    .small { font-size: 11.5px; fill: #5a6472; }
    .tag { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
  </style>
  <text x="20" y="30" class="title">건강검진 항목별 방사선, 한 장으로</text>
  <text x="20" y="50" class="small">유효선량 대표값(mSv) · 막대는 √값 비례 · 자료: ICRP, 대한영상의학회, 원자력안전위원회</text>

  <!-- 0 그룹 -->
  <rect x="20" y="68" width="70" height="20" rx="10" fill="#0b6e4f"/>
  <text x="34" y="82" class="tag">방사선 0</text>
  <text x="100" y="82" class="label">초음파 · 내시경(위·대장) · MRI · 혈액검사 · 심전도</text>

  <!-- 저 -->
  <rect x="20" y="105" width="70" height="20" rx="10" fill="#3f9274"/>
  <text x="38" y="119" class="tag">아주 낮음</text>
  <text x="100" y="140" class="label">흉부 엑스레이</text>
  <rect x="260" y="126" width="57" height="20" rx="4" fill="#0b6e4f"/>
  <text x="325" y="141" class="value">약 0.1</text>
  <text x="100" y="170" class="label">유방촬영(맘모그래피)</text>
  <rect x="260" y="156" width="110" height="20" rx="4" fill="#0b6e4f"/>
  <text x="378" y="171" class="value">약 0.4</text>

  <!-- 중 -->
  <rect x="20" y="192" width="70" height="20" rx="10" fill="#d9a441"/>
  <text x="46" y="206" class="tag">낮음</text>
  <text x="100" y="227" class="label">저선량 폐 CT</text>
  <rect x="260" y="213" width="220" height="20" rx="4" fill="#f5a623"/>
  <text x="488" y="228" class="value">약 1~2</text>

  <!-- 중상 -->
  <rect x="20" y="249" width="70" height="20" rx="10" fill="#e07b39"/>
  <text x="46" y="263" class="tag">보통</text>
  <text x="100" y="284" class="label">복부·골반 CT</text>
  <rect x="260" y="270" width="360" height="20" rx="4" fill="#e07b39"/>
  <text x="628" y="285" class="value" fill="#b04a1a">약 8~10</text>
  <text x="100" y="314" class="label">PET-CT (암 검진 패키지)</text>
  <rect x="260" y="300" width="380" height="20" rx="4" fill="#c0392b"/>
  <text x="648" y="315" class="value" fill="#b04a1a">약 10~25</text>

  <rect x="20" y="335" width="680" height="36" fill="#e3f2ec" rx="10"/>
  <text x="40" y="358" class="small" font-size="12.5">기준점: 연간 자연방사선 약 3mSv · 부모님 세대일수록 검사 이득이 위험을 크게 앞섬 — 필요한 검사는 받고, 습관성 CT는 줄이기</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Korea's spent fuel storage in 2026: pool fill rates by site and the Special Act timeline</title>
  <desc id="d">Horizontal bars show spent fuel storage fill rates at Kori, Hanbit, Hanul, Wolsong, Saeul and Shin-Wolsong with projected saturation years, and a timeline strip shows the Special Act procedure from the 2025 act through the 2027 site call, surveys and referendum to the 2050 interim storage and 2060 disposal targets.</desc>
  <rect width="760" height="500" fill="#f8faf9"/>

  <!-- Title -->
  <text x="24" y="34" font-size="19" font-weight="700" fill="#111827">Korea's spent fuel: how full are the pools?</text>
  <text x="24" y="54" font-size="12" fill="#6b7280">Storage fill rate by site, end 2025 (Kori, Hanbit, Hanul updated to March 2026) · projected saturation year</text>

  <!-- Bar chart -->
  <g id="bars" font-size="12">
    <!-- axis guide lines -->
    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="150" y1="72" x2="150" y2="292"/>
      <line x1="270" y1="72" x2="270" y2="292"/>
      <line x1="390" y1="72" x2="390" y2="292"/>
      <line x1="510" y1="72" x2="510" y2="292"/>
      <line x1="630" y1="72" x2="630" y2="292"/>
    </g>
    <g fill="#9ca3af" font-size="10" text-anchor="middle">
      <text x="150" y="303">0%</text>
      <text x="270" y="303">25%</text>
      <text x="390" y="303">50%</text>
      <text x="510" y="303">75%</text>
      <text x="630" y="303">100%</text>
    </g>

    <!-- Kori 93.4% -> width 480*0.934 = 448 -->
    <text x="140" y="94" text-anchor="end" font-weight="600" fill="#111827">Kori</text>
    <rect x="150" y="80" width="448" height="22" rx="3" fill="#f5a623"/>
    <text x="590" y="95" text-anchor="end" font-weight="700" style="fill:#fff">93.4%</text>
    <text x="606" y="95" fill="#374151" font-weight="600">2032</text>

    <!-- Hanbit 85.3% -> 409 -->
    <text x="140" y="128" text-anchor="end" font-weight="600" fill="#111827">Hanbit</text>
    <rect x="150" y="114" width="409" height="22" rx="3" fill="#f5a623"/>
    <text x="551" y="129" text-anchor="end" font-weight="700" style="fill:#fff">85.3%</text>
    <text x="567" y="129" fill="#374151" font-weight="600">2030</text>

    <!-- Hanul 73.5% -> 353 -->
    <text x="140" y="162" text-anchor="end" font-weight="600" fill="#111827">Hanul</text>
    <rect x="150" y="148" width="353" height="22" rx="3" fill="#f5a623"/>
    <text x="495" y="163" text-anchor="end" font-weight="700" style="fill:#fff">73.5%</text>
    <text x="511" y="163" fill="#374151" font-weight="600">2031</text>

    <!-- Wolsong 84.1% -> 404 -->
    <text x="140" y="196" text-anchor="end" font-weight="600" fill="#111827">Wolsong</text>
    <rect x="150" y="182" width="404" height="22" rx="3" fill="#0b6e4f"/>
    <text x="546" y="197" text-anchor="end" font-weight="700" style="fill:#fff">84.1%</text>
    <text x="562" y="197" fill="#374151" font-weight="600">2034 (pools)</text>

    <!-- Saeul 57.4% -> 276 -->
    <text x="140" y="230" text-anchor="end" font-weight="600" fill="#111827">Saeul</text>
    <rect x="150" y="216" width="276" height="22" rx="3" fill="#6b7280"/>
    <text x="418" y="231" text-anchor="end" font-weight="700" style="fill:#fff">57.4%</text>
    <text x="434" y="231" fill="#374151" font-weight="600">not imminent</text>

    <!-- Shin-Wolsong 38.6% -> 185 -->
    <text x="140" y="264" text-anchor="end" font-weight="600" fill="#111827">Shin-Wolsong</text>
    <rect x="150" y="250" width="185" height="22" rx="3" fill="#6b7280"/>
    <text x="327" y="265" text-anchor="end" font-weight="700" style="fill:#fff">38.6%</text>
    <text x="343" y="265" fill="#374151" font-weight="600">2042</text>
  </g>

  <!-- Legend -->
  <g font-size="10.5" fill="#4b5563">
    <rect x="24" y="316" width="10" height="10" rx="2" fill="#f5a623"/>
    <text x="39" y="325">Saturation within 6 years</text>
    <rect x="182" y="316" width="10" height="10" rx="2" fill="#0b6e4f"/>
    <text x="197" y="325">Dry storage operating (Wolsong)</text>
    <rect x="502" y="316" width="10" height="10" rx="2" fill="#6b7280"/>
    <text x="517" y="325">No near-term constraint</text>
  </g>

  <!-- Timeline strip -->
  <text x="24" y="360" font-size="13" font-weight="700" fill="#111827">Special Act procedure: from law to repository</text>
  <g id="timeline">
    <line x1="60" y1="404" x2="700" y2="404" stroke="#6b7280" stroke-width="2"/>
    <!-- nodes -->
    <g>
      <circle cx="60" cy="404" r="7" fill="#0b6e4f"/>
      <text x="60" y="386" font-size="11" font-weight="700" text-anchor="middle" fill="#111827">2025</text>
      <text x="60" y="423" font-size="10" text-anchor="middle" fill="#374151">Act in force</text>
      <text x="60" y="437" font-size="10" text-anchor="middle" fill="#374151">Sept 26</text>
    </g>
    <g>
      <circle cx="170" cy="404" r="7" fill="#0b6e4f"/>
      <text x="170" y="386" font-size="11" font-weight="700" text-anchor="middle" fill="#111827">2026</text>
      <text x="170" y="423" font-size="10" text-anchor="middle" fill="#374151">Exclude unsuitable</text>
      <text x="170" y="437" font-size="10" text-anchor="middle" fill="#374151">areas</text>
    </g>
    <g>
      <circle cx="280" cy="404" r="7" fill="#f5a623"/>
      <text x="280" y="386" font-size="11" font-weight="700" text-anchor="middle" fill="#111827">2027</text>
      <text x="280" y="423" font-size="10" text-anchor="middle" fill="#374151">Call for</text>
      <text x="280" y="437" font-size="10" text-anchor="middle" fill="#374151">municipalities</text>
    </g>
    <g>
      <circle cx="400" cy="404" r="7" fill="#6b7280"/>
      <text x="400" y="386" font-size="11" font-weight="700" text-anchor="middle" fill="#111827">~2028–2038</text>
      <text x="400" y="423" font-size="10" text-anchor="middle" fill="#374151">Basic, then detailed</text>
      <text x="400" y="437" font-size="10" text-anchor="middle" fill="#374151">survey; referendum</text>
    </g>
    <g>
      <circle cx="560" cy="404" r="7" fill="#0b6e4f"/>
      <text x="560" y="386" font-size="11" font-weight="700" text-anchor="middle" fill="#111827">2050</text>
      <text x="560" y="423" font-size="10" text-anchor="middle" fill="#374151">Interim storage</text>
      <text x="560" y="437" font-size="10" text-anchor="middle" fill="#374151">target</text>
    </g>
    <g>
      <circle cx="700" cy="404" r="7" fill="#0b6e4f"/>
      <text x="700" y="386" font-size="11" font-weight="700" text-anchor="middle" fill="#111827">2060</text>
      <text x="700" y="423" font-size="10" text-anchor="middle" fill="#374151">Disposal</text>
      <text x="700" y="437" font-size="10" text-anchor="middle" fill="#374151">target</text>
    </g>
  </g>
  <text x="24" y="462" font-size="10.5" fill="#4b5563">Survey durations are the commission chair's estimates (basic 3–5 years, detailed 3–4, decision 1); 2050 and 2060 are the Act's targets, not deadlines.</text>

  <!-- Footer -->
  <line x1="24" y1="474" x2="736" y2="474" stroke="#e5e7eb"/>
  <text x="24" y="490" font-size="10" fill="#6b7280">As of September 2026 · Sources: KHNP, NSSC, HLW Management Commission</text>
  <text x="736" y="490" font-size="10" fill="#6b7280" text-anchor="end">energynote.kr</text>
</svg>

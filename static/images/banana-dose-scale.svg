    <use href="#b" x="550" y="214" width="14" height="14"/><use href="#b" x="564" y="214" width="14" height="14"/><use href="#b" x="578" y="214" width="14" height="14"/><use href="#b" x="592" y="214" width="14" height="14"/><use href="#b" x="606" y="214" width="14" height="14"/>
  </g>

  <!-- Row 4: 흉부 CT 70개 (35 x 2) -->
  <text x="20" y="276" class="label">흉부 CT 1회</text>
  <text x="20" y="294" class="value">7mSv · 바나나 70,000개</text>

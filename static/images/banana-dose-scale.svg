  <!-- 주석 박스 -->
  <rect x="20" y="322" width="680" height="96" fill="#e3f2ec" rx="10"/>
  <text x="40" y="346" class="label" style="fill:#0b6e4f">그런데 — 몸은 칼륨 총량을 유지한다</text>
  <text x="40" y="367" class="note">바나나로 들어온 칼륨은 콩팥이 몇 시간 안에 같은 양을 내보낸다(항상성).</text>
  <text x="40" y="386" class="note">→ 몸속 칼륨-40 총량(약 4,000~5,000Bq)은 늘지 않는다 — 실제 추가 선량은 0에 가깝다.</text>
  <text x="40" y="405" class="note">위 눈금은 '먹어서 받는 선량'이 아니라 15Bq을 계산상 선량으로 바꾼, 크기 비교용 자다.</text>

  <text x="20" y="440" class="small" style="font-size:10.5px">출처: Wikipedia 'Banana equivalent dose'(RadSafe 1995년 원문 인용) · xkcd Radiation Dose Chart(2011)</text>
  <text x="20" y="455" class="small" style="font-size:10.5px">흉부 엑스레이·흉부 CT·한국인 연간 자연방사선(원안위·KINS 집계 약 3mSv)은 대표적 대략값 · 2026년 9월 기준</text>
</svg>

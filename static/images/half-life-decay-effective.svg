<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">위: 반감기마다 절반씩 줄어 10번 지나면 약 1/1000이 되는 감쇠 곡선. 아래: 세슘-137, 삼중수소수, 요오드-131(갑상선)의 물리적·생물학적·유효 반감기를 로그 눈금 막대로 비교한 도해</title>
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1f2937; }
    .h { font-size: 15px; font-weight: 800; fill: #1f2937; }
    .label { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .tick { font-size: 12px; fill: #6b7280; text-anchor: middle; }
    .ylab { font-size: 12px; fill: #6b7280; text-anchor: end; }
    .pt { font-size: 13px; font-weight: 700; fill: #0b6e4f; }
    .val { font-size: 12px; font-weight: 700; fill: #1f2937; }
    .item { font-size: 12px; fill: #1f2937; }
    .src { font-size: 10.5px; fill: #6b7280; }
  </style>
  <rect x="0" y="0" width="720" height="520" fill="#f8faf9"/>

  <text x="20" y="26" class="title">반감기마다 절반, 10번이면 약 1/1000</text>
  <text x="20" y="46" class="sub">남은 양(%) · 가로축은 지난 반감기 횟수(핵종이 달라도 모양은 같음)</text>

  <!-- Panel A grid & axes: y(100%)=70, y(0)=210, x(n)=80+60n -->
  <line x1="80" y1="140" x2="680" y2="140" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <line x1="80" y1="175" x2="680" y2="175" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <line x1="80" y1="66" x2="80" y2="210" stroke="#6b7280"/>
  <line x1="80" y1="210" x2="690" y2="210" stroke="#6b7280"/>
  <text x="72" y="74" class="ylab">100%</text>
  <text x="72" y="144" class="ylab">50%</text>
  <text x="72" y="179" class="ylab">25%</text>
  <text x="72" y="214" class="ylab">0</text>

  <polyline fill="none" stroke="#0b6e4f" stroke-width="3" stroke-linejoin="round"
    points="80,70 95,92.3 110,111 125,126.8 140,140 155,151.1 170,160.5 185,168.4 200,175 215,180.6 230,185.3 245,189.2 260,192.5 290,197.6 320,201.3 350,203.8 380,205.6 440,207.8 500,208.9 560,209.5 680,209.9"/>
  <circle cx="140" cy="140" r="4.5" fill="#f5a623"/>
  <circle cx="200" cy="175" r="4.5" fill="#f5a623"/>
  <circle cx="260" cy="192.5" r="4.5" fill="#f5a623"/>
  <circle cx="680" cy="209.9" r="4.5" fill="#f5a623"/>
  <text x="148" y="134" class="pt">1/2</text>
  <text x="208" y="170" class="pt">1/4</text>
  <text x="268" y="187" class="pt">1/8</text>
  <text x="680" y="196" class="pt" text-anchor="end">10번 지나면 약 1/1000 (1/1024)</text>

  <text x="80" y="228" class="tick">0</text>
  <text x="140" y="228" class="tick">1</text>
  <text x="200" y="228" class="tick">2</text>
  <text x="260" y="228" class="tick">3</text>
  <text x="320" y="228" class="tick">4</text>
  <text x="380" y="228" class="tick">5</text>
  <text x="440" y="228" class="tick">6</text>
  <text x="500" y="228" class="tick">7</text>
  <text x="560" y="228" class="tick">8</text>
  <text x="620" y="228" class="tick">9</text>
  <text x="680" y="228" class="tick">10</text>
  <text x="380" y="246" class="tick">지난 반감기 횟수</text>

  <!-- example box -->
  <rect x="390" y="62" width="310" height="92" rx="8" fill="#e3f2ec"/>
  <text x="404" y="84" class="item"><tspan font-weight="700">세슘-137</tspan>(약 30년): 30년 뒤 1/2, 60년 뒤 1/4</text>
  <text x="404" y="106" class="item"><tspan font-weight="700">삼중수소</tspan>(약 12.3년): 37년 뒤 약 1/8</text>
  <text x="404" y="128" class="item"><tspan font-weight="700">요오드-131</tspan>(약 8일): 80일 뒤 약 1/1000</text>
  <text x="404" y="146" class="sub">계산식 N = N₀ × (1/2)^(t/T)</text>

  <line x1="20" y1="262" x2="700" y2="262" stroke="#d1d5db"/>

  <!-- Panel B -->
  <text x="20" y="288" class="h">몸 안에서는: 물리적·생물학적·유효 반감기</text>
  <rect x="20" y="300" width="12" height="12" fill="#6b7280"/>
  <text x="38" y="311" class="item">물리적(붕괴)</text>
  <rect x="130" y="300" width="12" height="12" fill="#f5a623"/>
  <text x="148" y="311" class="item">생물학적(배출)</text>
  <rect x="252" y="300" width="12" height="12" fill="#0b6e4f"/>
  <text x="270" y="311" class="item">유효(둘을 합친 실제 감소)</text>
  <text x="700" y="311" class="sub" text-anchor="end">가로축 로그 눈금</text>

  <!-- grid: 1d=250, 10d=350, 100d=450, 1000d=550, 10000d=650 -->
  <line x1="250" y1="322" x2="250" y2="478" stroke="#6b7280"/>
  <line x1="350" y1="322" x2="350" y2="478" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <line x1="450" y1="322" x2="450" y2="478" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <line x1="550" y1="322" x2="550" y2="478" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <line x1="650" y1="322" x2="650" y2="478" stroke="#e5e7eb" stroke-dasharray="3 3"/>

  <!-- Row 1: Cs-137 -->
  <text x="20" y="340" class="label">세슘-137</text>
  <text x="20" y="357" class="sub">성인 몸 전체(대표값)</text>
  <rect x="250" y="328" width="404" height="10" rx="2" fill="#6b7280"/>
  <text x="660" y="337" class="val">30.1년</text>
  <rect x="250" y="342" width="204" height="10" rx="2" fill="#f5a623"/>
  <text x="460" y="351" class="val">약 110일</text>
  <rect x="250" y="356" width="204" height="10" rx="2" fill="#0b6e4f"/>
  <text x="460" y="365" class="val">약 109일</text>

  <!-- Row 2: HTO -->
  <text x="20" y="396" class="label">삼중수소수(HTO)</text>
  <text x="20" y="413" class="sub">물 형태로 섭취</text>
  <rect x="250" y="384" width="365" height="10" rx="2" fill="#6b7280"/>
  <text x="621" y="393" class="val">12.3년</text>
  <rect x="250" y="398" width="100" height="10" rx="2" fill="#f5a623"/>
  <text x="356" y="407" class="val">약 10일</text>
  <rect x="250" y="412" width="100" height="10" rx="2" fill="#0b6e4f"/>
  <text x="356" y="421" class="val">약 10일</text>

  <!-- Row 3: I-131 -->
  <text x="20" y="452" class="label">요오드-131</text>
  <text x="20" y="469" class="sub">성인 갑상선(ICRP 값)</text>
  <rect x="250" y="440" width="90" height="10" rx="2" fill="#6b7280"/>
  <text x="346" y="449" class="val">8.0일</text>
  <rect x="250" y="454" width="190" height="10" rx="2" fill="#f5a623"/>
  <text x="446" y="463" class="val">약 80일</text>
  <rect x="250" y="468" width="86" height="10" rx="2" fill="#0b6e4f"/>
  <text x="342" y="477" class="val">약 7.3일</text>

  <text x="250" y="495" class="tick">1일</text>
  <text x="350" y="495" class="tick">10일</text>
  <text x="450" y="495" class="tick">100일</text>
  <text x="550" y="495" class="tick">1,000일</text>
  <text x="650" y="495" class="tick">1만 일</text>

  <text x="20" y="513" class="src">출처: IAEA Live Chart of Nuclides, Rundo(1964), 캐나다 CNSC, Kramer 외(2002) · 생물학적 반감기는 나이·개인차 큼 · 2026년 11월 기준</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="t" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Six-step ladder of Korea's reactor continued-operation process with typical durations and Kori 2's actual dates, a 48-month timeline of the Kori 2 case, and a strip of the nine units queued for renewal with license expiry years colored by stage</title>
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1f2937; }
    .sub { font-size: 11px; fill: #6b7280; }
    .h { font-size: 12px; font-weight: 800; fill: #1f2937; }
    .s1 { font-size: 10.5px; font-weight: 700; }
    .s2 { font-size: 9px; }
    .tl { font-size: 9.5px; fill: #1f2937; }
    .tla { font-size: 9.5px; fill: #b45309; font-weight: 700; }
    .q1 { font-size: 10px; font-weight: 700; }
    .q2 { font-size: 9px; }
    .leg { font-size: 10px; fill: #1f2937; }
  </style>
  <rect x="0" y="0" width="760" height="520" fill="#f8faf9"/>
  <text x="20" y="30" class="title">How a Korean reactor gets 10 more years: the continued-operation ladder</text>
  <text x="20" y="48" class="sub">Steps under the Nuclear Safety Act · rule or typical duration in gray · Kori 2's actual record in orange</text>

  <!-- Ladder: 6 rising steps, box 112x54, x = 16 + i*122 -->
  <g>
    <!-- connectors -->
    <path d="M128 259 H138 V233 H140" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    <path d="M250 233 H260 V207 H262" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    <path d="M372 207 H382 V181 H384" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    <path d="M494 181 H504 V155 H506" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    <path d="M616 155 H626 V129 H628" fill="none" stroke="#6b7280" stroke-width="1.5"/>

    <!-- step 1 -->
    <rect x="16" y="232" width="112" height="54" rx="6" fill="#0b6e4f"/>
    <text x="72" y="248" class="s1" text-anchor="middle" style="fill:#fff">1. PSR filed</text>
    <text x="72" y="262" class="s2" text-anchor="middle" style="fill:#d1fae5">10 to 5 yrs before expiry</text>
    <text x="72" y="276" class="s2" text-anchor="middle" style="fill:#fcd34d">Kori 2: Apr 4, 2022</text>
    <!-- step 2 -->
    <rect x="138" y="206" width="112" height="54" rx="6" fill="#0b6e4f"/>
    <text x="194" y="222" class="s1" text-anchor="middle" style="fill:#fff">2. KINS review</text>
    <text x="194" y="236" class="s2" text-anchor="middle" style="fill:#d1fae5">18 months by decree</text>
    <text x="194" y="250" class="s2" text-anchor="middle" style="fill:#fcd34d">Dec 2022 to Jul 2025</text>
    <!-- step 3 -->
    <rect x="260" y="180" width="112" height="54" rx="6" fill="#0b6e4f"/>
    <text x="316" y="196" class="s1" text-anchor="middle" style="fill:#fff">3. Public hearings</text>
    <text x="316" y="210" class="s2" text-anchor="middle" style="fill:#d1fae5">on the draft impact study</text>
    <text x="316" y="224" class="s2" text-anchor="middle" style="fill:#fcd34d">5 hearings, Nov–Dec 2022</text>
    <!-- step 4 -->
    <rect x="382" y="154" width="112" height="54" rx="6" fill="#0b6e4f"/>
    <text x="438" y="170" class="s1" text-anchor="middle" style="fill:#fff">4. Panel, vote</text>
    <text x="438" y="184" class="s2" text-anchor="middle" style="fill:#d1fae5">after expert committee</text>
    <text x="438" y="198" class="s2" text-anchor="middle" style="fill:#fcd34d">Nov 13, 2025, 3rd sitting</text>
    <!-- step 5 -->
    <rect x="504" y="128" width="112" height="54" rx="6" fill="#0b6e4f"/>
    <text x="560" y="144" class="s1" text-anchor="middle" style="fill:#fff">5. License amended</text>
    <text x="560" y="158" class="s2" text-anchor="middle" style="fill:#d1fae5">10 yrs from expiry date</text>
    <text x="560" y="172" class="s2" text-anchor="middle" style="fill:#fcd34d">valid to Apr 8, 2033</text>
    <!-- step 6 -->
    <rect x="626" y="102" width="112" height="54" rx="6" fill="#0b6e4f"/>
    <text x="682" y="118" class="s1" text-anchor="middle" style="fill:#fff">6. Restart</text>
    <text x="682" y="132" class="s2" text-anchor="middle" style="fill:#d1fae5">upgrades, then inspection</text>
    <text x="682" y="146" class="s2" text-anchor="middle" style="fill:#fcd34d">Apr 4, 2026</text>
  </g>

  <!-- Kori 2 timeline: Apr 2022 (x=40) to Apr 2026 (x=720), 48 months -->
  <text x="20" y="304" class="h">Kori 2, month by month: 48 months from filing to restart, 36 of them off line</text>
  <rect x="210" y="326" width="510" height="10" fill="#f5a623" opacity="0.35"/>
  <line x1="40" y1="331" x2="720" y2="331" stroke="#6b7280" stroke-width="2"/>
  <!-- year ticks: Jan 2023 = 9 mo -> x=167.5; Jan 2024 = 21 -> 337.5; Jan 2025 = 33 -> 507.5; Jan 2026 = 45 -> 677.5 -->
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="167" y1="336" x2="167" y2="342"/><line x1="337" y1="336" x2="337" y2="342"/><line x1="507" y1="336" x2="507" y2="342"/><line x1="677" y1="336" x2="677" y2="342"/>
  </g>
  <g class="sub" text-anchor="middle">
    <text x="167" y="352">2023</text><text x="337" y="352">2024</text><text x="507" y="352">2025</text><text x="677" y="352">2026</text>
  </g>
  <!-- markers -->
  <g>
    <circle cx="40" cy="331" r="4" fill="#0b6e4f"/>
    <text x="40" y="322" class="tl" text-anchor="start">PSR filed, Apr 2022</text>
    <circle cx="145" cy="331" r="4" fill="#0b6e4f"/>
    <text x="145" y="366" class="tl" text-anchor="middle">Hearings, Nov–Dec</text>
    <circle cx="196" cy="331" r="4" fill="#0b6e4f"/>
    <text x="196" y="322" class="tl" text-anchor="middle">License application, Mar 2023</text>
    <circle cx="210" cy="331" r="4" fill="#f5a623"/>
    <text x="272" y="366" class="tla" text-anchor="middle">Expired Apr 8, 2023: unit stops</text>
    <circle cx="593" cy="331" r="4" fill="#0b6e4f"/>
    <text x="580" y="322" class="tl" text-anchor="end">KINS review done, Jul 2025</text>
    <circle cx="630" cy="331" r="4" fill="#6b7280"/>
    <text x="618" y="366" class="tl" text-anchor="middle">Vote deferred, Sep and Oct</text>
    <circle cx="655" cy="331" r="4" fill="#0b6e4f"/>
    <text x="700" y="322" class="tl" text-anchor="middle">Approved Nov 13</text>
    <circle cx="720" cy="331" r="4" fill="#f5a623"/>
    <text x="722" y="379" class="tla" text-anchor="end">Restart Apr 4, 2026</text>
  </g>

  <!-- Queue strip -->
  <text x="20" y="398" class="h">The queue, by license expiry (as of Sept 13, 2026)</text>
  <g>
    <!-- Kori 2 approved -->
    <rect x="20" y="408" width="66" height="40" rx="5" fill="#0b6e4f"/>
    <text x="53" y="424" class="q1" text-anchor="middle" style="fill:#fff">Kori 2</text>
    <text x="53" y="438" class="q2" text-anchor="middle" style="fill:#d1fae5">2023 → 2033</text>
    <!-- off line, vote pending -->
    <rect x="92" y="408" width="66" height="40" rx="5" fill="#f5a623"/>
    <text x="125" y="424" class="q1" text-anchor="middle" style="fill:#fff">Kori 3</text>
    <text x="125" y="438" class="q2" text-anchor="middle" style="fill:#fff">exp. 2024</text>
    <rect x="164" y="408" width="66" height="40" rx="5" fill="#f5a623"/>
    <text x="197" y="424" class="q1" text-anchor="middle" style="fill:#fff">Kori 4</text>
    <text x="197" y="438" class="q2" text-anchor="middle" style="fill:#fff">exp. 2025</text>
    <rect x="236" y="408" width="66" height="40" rx="5" fill="#f5a623"/>
    <text x="269" y="424" class="q1" text-anchor="middle" style="fill:#fff">Hanbit 1</text>
    <text x="269" y="438" class="q2" text-anchor="middle" style="fill:#fff">exp. 2025</text>
    <rect x="308" y="408" width="66" height="40" rx="5" fill="#f5a623"/>
    <text x="341" y="424" class="q1" text-anchor="middle" style="fill:#fff">Hanbit 2</text>
    <text x="341" y="438" class="q2" text-anchor="middle" style="fill:#fff">exp. 2026</text>
    <!-- safety assessment filed, application pending -->
    <rect x="380" y="408" width="66" height="40" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="413" y="424" class="q1" text-anchor="middle" fill="#1f2937">Wolsong 2</text>
    <text x="413" y="438" class="q2" text-anchor="middle" fill="#6b7280">Nov 2026</text>
    <!-- application filed, under review -->
    <rect x="452" y="408" width="66" height="40" rx="5" fill="#6b7280"/>
    <text x="485" y="424" class="q1" text-anchor="middle" style="fill:#fff">Hanul 1</text>
    <text x="485" y="438" class="q2" text-anchor="middle" style="fill:#fff">Dec 2027</text>
    <rect x="524" y="408" width="66" height="40" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="557" y="424" class="q1" text-anchor="middle" fill="#1f2937">Wolsong 3</text>
    <text x="557" y="438" class="q2" text-anchor="middle" fill="#6b7280">Dec 2027</text>
    <rect x="596" y="408" width="66" height="40" rx="5" fill="#6b7280"/>
    <text x="629" y="424" class="q1" text-anchor="middle" style="fill:#fff">Hanul 2</text>
    <text x="629" y="438" class="q2" text-anchor="middle" style="fill:#fff">Dec 2028</text>
    <rect x="668" y="408" width="66" height="40" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="701" y="424" class="q1" text-anchor="middle" fill="#1f2937">Wolsong 4</text>
    <text x="701" y="438" class="q2" text-anchor="middle" fill="#6b7280">Feb 2029</text>
  </g>
  <g class="leg">
    <rect x="20" y="462" width="11" height="11" rx="3" fill="#0b6e4f"/><text x="35" y="471">Approved, running</text>
    <rect x="140" y="462" width="11" height="11" rx="3" fill="#f5a623"/><text x="155" y="471">License expired, unit off line, NSSC vote pending</text>
    <rect x="408" y="462" width="11" height="11" rx="3" fill="#6b7280"/><text x="423" y="471">Application filed, under review</text>
    <rect x="590" y="462" width="11" height="11" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 2"/><text x="605" y="471">Application not yet filed</text>
  </g>

  <text x="20" y="492" class="sub">Off line Sept 13, 2026: Kori 3, Kori 4, Hanbit 1 and 2 (3,800 MW). The 10 years run from expiry, so idle months are lost.</text>
  <text x="20" y="508" class="sub">As of September 2026 · Sources: NSSC, KHNP</text>
</svg>

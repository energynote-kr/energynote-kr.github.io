<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="t" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Korea's four reactor sites with safe-shutdown earthquake values in g and flood defense heights, plus a bar chart comparing the 0.2g and 0.3g design limits with peak ground acceleration recorded at Wolsong during the 2016 Gyeongju earthquake</title>
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1f2937; }
    .sub { font-size: 11px; fill: #6b7280; }
    .site { font-size: 14px; font-weight: 800; fill: #ffffff; }
    .site2 { font-size: 10px; fill: #e3f2ec; }
    .lbl { font-size: 10.5px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 10.5px; fill: #374151; }
    .sec { font-size: 13px; font-weight: 800; fill: #1f2937; }
    .barlbl { font-size: 10.5px; font-weight: 700; fill: #1f2937; }
    .barval { font-size: 12px; font-weight: 800; fill: #ffffff; }
    .axis { font-size: 9.5px; fill: #6b7280; }
    .note { font-size: 9.5px; fill: #6b7280; }
  </style>
  <rect x="0" y="0" width="760" height="560" fill="#f8faf9"/>
  <text x="20" y="30" class="title">How hard can it shake? Korea's reactor sites, by design</text>
  <text x="20" y="48" class="sub">Safe-shutdown earthquake (SSE) in g, flood defense height where published &#183; as of September 2026</text>

  <!-- Site cards -->
  <!-- Kori / Saeul -->
  <g>
    <rect x="20" y="66" width="171" height="34" rx="6" fill="#0b6e4f"/>
    <text x="105" y="88" class="site" text-anchor="middle">Kori / Saeul</text>
    <rect x="20" y="100" width="171" height="140" rx="0" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="32" y="120" class="lbl">10 units &#183; Busan / Ulsan</text>
    <text x="32" y="140" class="val">SSE 0.2g legacy fleet</text>
    <text x="32" y="156" class="val">SSE 0.3g, Saeul 1&#8211;2</text>
    <text x="32" y="172" class="val">SSE 0.5g target, Saeul 3&#8211;4</text>
    <text x="32" y="196" class="lbl">Flood defense</text>
    <text x="32" y="212" class="val">10 m sea wall, 2013</text>
    <text x="32" y="228" class="note">(raised from 7.5&#8211;9.5 m)</text>
  </g>

  <!-- Wolsong -->
  <g>
    <rect x="199" y="66" width="171" height="34" rx="6" fill="#0b6e4f"/>
    <text x="284" y="88" class="site" text-anchor="middle">Wolsong</text>
    <rect x="199" y="100" width="171" height="140" rx="0" fill="#e3f2ec"/>
    <text x="211" y="120" class="lbl">6 units &#183; Gyeongju</text>
    <text x="211" y="140" class="val">SSE 0.2g legacy design</text>
    <text x="211" y="156" class="val">Reinforced to 0.3g</text>
    <text x="211" y="172" class="val">after 2016 (all 6 units)</text>
    <text x="211" y="196" class="lbl">Flood defense</text>
    <text x="211" y="212" class="val">Sea-wall height</text>
    <text x="211" y="228" class="note">not confirmed in sources</text>
  </g>

  <!-- Hanbit -->
  <g>
    <rect x="378" y="66" width="171" height="34" rx="6" fill="#0b6e4f"/>
    <text x="463" y="88" class="site" text-anchor="middle">Hanbit</text>
    <rect x="378" y="100" width="171" height="140" rx="0" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="390" y="120" class="lbl">6 units &#183; Yeonggwang</text>
    <text x="390" y="140" class="val">SSE 0.2g legacy fleet</text>
    <text x="390" y="156" class="val">reinforced toward 0.3g</text>
    <text x="390" y="172" class="val">target post-2016</text>
    <text x="390" y="196" class="lbl">Flood defense</text>
    <text x="390" y="212" class="val">10 m natural site grade</text>
    <text x="390" y="228" class="note">no built sea wall</text>
  </g>

  <!-- Hanul -->
  <g>
    <rect x="557" y="66" width="171" height="34" rx="6" fill="#0b6e4f"/>
    <text x="642" y="88" class="site" text-anchor="middle">Hanul</text>
    <rect x="557" y="100" width="171" height="140" rx="0" fill="#e3f2ec"/>
    <text x="569" y="120" class="lbl">8 units &#183; Uljin</text>
    <text x="569" y="140" class="val">SSE 0.2g legacy fleet</text>
    <text x="569" y="156" class="val">SSE 0.3g, Shin-Hanul</text>
    <text x="569" y="172" class="val">1&#8211;4</text>
    <text x="569" y="196" class="lbl">Flood defense</text>
    <text x="569" y="212" class="val">10&#8211;12 m site grade</text>
    <text x="569" y="228" class="note">no built sea wall</text>
  </g>

  <!-- Bar chart section -->
  <text x="20" y="270" class="sec">Design limit vs. what the 2016 Gyeongju quake actually delivered</text>
  <text x="20" y="286" class="sub">Peak ground acceleration, in g &#183; Wolsong site instruments, Sept. 12, 2016</text>

  <!-- chart baseline -->
  <line x1="90" y1="480" x2="740" y2="480" stroke="#d1d5db" stroke-width="1"/>
  <!-- gridlines at 0.1g steps, scale: 300px per 1.0g -->
  <line x1="90" y1="450" x2="740" y2="450" stroke="#e5e7eb" stroke-width="1"/>
  <text x="80" y="454" class="axis" text-anchor="end">0.1g</text>
  <line x1="90" y1="420" x2="740" y2="420" stroke="#e5e7eb" stroke-width="1"/>
  <text x="80" y="424" class="axis" text-anchor="end">0.2g</text>
  <line x1="90" y1="390" x2="740" y2="390" stroke="#e5e7eb" stroke-width="1"/>
  <text x="80" y="394" class="axis" text-anchor="end">0.3g</text>
  <line x1="90" y1="360" x2="740" y2="360" stroke="#e5e7eb" stroke-width="1"/>
  <text x="80" y="364" class="axis" text-anchor="end">0.4g</text>
  <line x1="90" y1="330" x2="740" y2="330" stroke="#e5e7eb" stroke-width="1"/>
  <text x="80" y="334" class="axis" text-anchor="end">0.5g</text>
  <text x="80" y="484" class="axis" text-anchor="end">0g</text>

  <!-- Bar: legacy fleet 0.2g -->
  <rect x="150" y="420" width="90" height="60" fill="#6b7280" rx="4"/>
  <text x="195" y="440" class="barval" text-anchor="middle">0.2g</text>
  <text x="195" y="500" class="lbl" text-anchor="middle">Legacy fleet</text>
  <text x="195" y="514" class="note" text-anchor="middle">SSE design basis</text>

  <!-- Bar: APR1400 0.3g -->
  <rect x="290" y="390" width="90" height="90" fill="#0b6e4f" rx="4"/>
  <text x="335" y="410" class="barval" text-anchor="middle">0.3g</text>
  <text x="335" y="500" class="lbl" text-anchor="middle">APR1400</text>
  <text x="335" y="514" class="note" text-anchor="middle">SSE design basis</text>

  <!-- Bar: Saeul 3-4 target 0.5g -->
  <rect x="430" y="330" width="90" height="150" fill="#f5a623" rx="4"/>
  <text x="475" y="350" class="barval" text-anchor="middle" fill="#1f2937">0.5g</text>
  <text x="475" y="500" class="lbl" text-anchor="middle">Saeul 3&#8211;4</text>
  <text x="475" y="514" class="note" text-anchor="middle">2017 KHNP target</text>

  <!-- Bar: 2016 Wolsong recorded PGA ~0.12g, peak sensor 0.16g -->
  <rect x="570" y="444" width="90" height="36" fill="#c0392b" rx="4"/>
  <text x="615" y="463" class="barval" text-anchor="middle">0.12g</text>
  <line x1="580" y1="425" x2="650" y2="425" stroke="#c0392b" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="615" y="418" class="note" text-anchor="middle" fill="#c0392b">peak sensor 0.16g</text>
  <text x="615" y="500" class="lbl" text-anchor="middle">Wolsong, 2016</text>
  <text x="615" y="514" class="note" text-anchor="middle">recorded PGA</text>

  <text x="20" y="540" class="sub">Both design limits held: the 2016 quake stayed under 0.2g. Saeul 3&#8211;4's 0.5g figure is KHNP's 2017 stated target, not independently reconfirmed as final.</text>
  <text x="20" y="554" class="sub">Sources: NSSC, KHNP, World Nuclear Association, Korean media reporting on post-2016 seismic reinforcement &#183; as of September 2026</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Progress of high-level waste repositories in Finland, Sweden, France, the US, Germany and Korea, shown as bars across site selection, licensing, construction and operation</title>
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1e2430; }
    .label { font-size: 13px; fill: #1e2430; font-weight: 700; }
    .stage { font-size: 11.5px; fill: #5a6472; }
    .note { font-size: 11.5px; fill: #ffffff; font-weight: 700; }
  </style>
  <text x="20" y="30" class="title">High-level waste repositories: how far each country has come</text>

  <!-- Stage headers -->
  <text x="200" y="62" class="stage">Site selection</text>
  <text x="330" y="62" class="stage">Licensing</text>
  <text x="450" y="62" class="stage">Construction</text>
  <text x="580" y="62" class="stage">Operation</text>
  <g stroke="#e6e4de" stroke-width="1">
    <line x1="190" y1="70" x2="190" y2="310"/><line x1="320" y1="70" x2="320" y2="310"/>
    <line x1="440" y1="70" x2="440" y2="310"/><line x1="570" y1="70" x2="570" y2="310"/><line x1="690" y1="70" x2="690" y2="310"/>
  </g>

  <!-- Finland -->
  <text x="20" y="97" class="label">🇫🇮 Finland Onkalo</text>
  <rect x="190" y="82" width="480" height="22" rx="6" fill="#0b6e4f"/>
  <text x="660" y="98" class="note" text-anchor="end">Safety review passed 2026 · licence pending</text>

  <!-- Sweden -->
  <text x="20" y="142" class="label">🇸🇪 Sweden Forsmark</text>
  <rect x="190" y="127" width="330" height="22" rx="6" fill="#2f8668"/>
  <text x="510" y="143" class="note" text-anchor="end">Approved 2022 · under construction</text>

  <!-- France -->
  <text x="20" y="187" class="label">🇫🇷 France Cigéo</text>
  <rect x="190" y="172" width="220" height="22" rx="6" fill="#3f9274"/>
  <text x="400" y="188" class="note" text-anchor="end">Licence review underway</text>

  <!-- United States -->
  <text x="20" y="232" class="label">🇺🇸 US Yucca Mtn</text>
  <rect x="190" y="217" width="200" height="22" rx="6" fill="#8a8f98"/>
  <text x="228" y="233" class="note">Politically stalled</text>
  <text x="400" y="233" class="stage">WIPP (defense waste) operates separately</text>

  <!-- Germany -->
  <text x="20" y="277" class="label">🇩🇪 Germany</text>
  <rect x="190" y="262" width="100" height="22" rx="6" fill="#8a8f98"/>
  <text x="300" y="278" class="stage">Gorleben abandoned → site search restarted 2017</text>

  <!-- Korea -->
  <text x="20" y="322" class="label">🇰🇷 Korea (HLW)</text>
  <rect x="190" y="307" width="60" height="22" rx="6" fill="#c0392b"/>
  <text x="260" y="319" class="stage">2025 Special Act · disposal target 2060</text>
  <text x="260" y="334" class="stage">(Gyeongju low/intermediate-level facility operating since 2015)</text>

  <rect x="20" y="345" width="680" height="26" fill="#e3f2ec" rx="8"/>
  <text x="40" y="363" class="stage" font-size="12.5">Bars show approximate stage · Sources: Posiva/STUK, SKB, ANDRA, DOE, MOTIE/MCEE · as of Sep 2026</text>
</svg>

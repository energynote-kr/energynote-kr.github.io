<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif">
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1e2430; }
    .h { font-size: 15px; font-weight: 800; fill: #ffffff; }
    .row { font-size: 12.5px; fill: #1e2430; }
    .small { font-size: 11.5px; fill: #5a6472; }
  </style>
  <text x="20" y="30" class="title">방사선 돌연변이 — 영화 vs 현실</text>

  <!-- 영화 -->
  <rect x="20" y="55" width="330" height="34" rx="10" fill="#c0392b"/>
  <text x="36" y="78" class="h">🎬 영화 속 설정</text>
  <text x="30" y="118" class="row">· 방사능 거미에 물림 → 한 사람이 며칠 만에 변신</text>
  <text x="30" y="142" class="row">· 힘·감각·거미줄 등 유용한 능력만 골라서 생김</text>
  <text x="30" y="166" class="row">· 능력이 평생 유지되고 몸은 건강함</text>
  <text x="30" y="190" class="row">· 방사선 = 초능력의 원천</text>

  <!-- 현실 -->
  <rect x="370" y="55" width="330" height="34" rx="10" fill="#0b6e4f"/>
  <text x="386" y="78" class="h">🔬 방사선생물학의 현실</text>
  <text x="380" y="118" class="row">· 다 자란 개체는 변신 불가 — 복구되거나 세포 사멸</text>
  <text x="380" y="142" class="row">· 돌연변이는 무작위, 대부분 중립이거나 해로움</text>
  <text x="380" y="166" class="row">· 새 형질은 자손 세대에서, 수천 개체 중 선별해야 얻음</text>
  <text x="380" y="190" class="row">· 방사선 = 무작위 '주사위', 초능력 아님</text>

  <!-- 반전 -->
  <rect x="20" y="220" width="680" height="34" rx="10" fill="#f5a623"/>
  <text x="36" y="243" class="h" fill="#1e2430">그런데 '방사선으로 만든 슈퍼 품종'은 실제로 있다</text>
  <text x="30" y="282" class="row">· 씨앗에 감마선·중성자 조사 → 무작위 변이 → 수천 그루 중 원하는 형질만 선별·고정 (돌연변이 육종)</text>
  <text x="30" y="306" class="row">· 전 세계 3,400여 종 품종 등록 (IAEA/FAO, 70개국·200여 작물) — 벼, 밀, 보리, 콩, 화훼…</text>
  <text x="30" y="330" class="row">· 한국도 벼 '원평'·무궁화 '꼬마' 등 방사선 육종 품종 보유 — 유전자를 넣는 GMO와는 다른 방식</text>

  <rect x="20" y="348" width="680" height="24" fill="#e3f2ec" rx="8"/>
  <text x="40" y="365" class="small" font-size="12">핵심: 방사선은 개체를 바꾸는 게 아니라 '다음 세대의 변이 가능성'을 늘린다 — 그 변이 중 쓸 만한 것을 고르는 게 과학이다</text>
</svg>

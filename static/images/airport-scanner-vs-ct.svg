<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif">
  <title id="t">공항 보안검색대와 흉부 CT, 비행기 우주방사선의 선량을 로그 스케일로 비교한 막대 그림</title>
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1e2430; }
    .axisnote { font-size: 11px; fill: #5a6472; }
    .label { font-size: 13px; fill: #1e2430; }
    .sub { font-size: 11px; fill: #6b7280; }
    .value { font-size: 13px; font-weight: 700; fill: #0b6e4f; }
    .value2 { font-size: 12px; font-weight: 700; fill: #b45309; }
    .value3 { font-size: 12px; font-weight: 700; fill: #a33427; }
    .value4 { font-size: 12px; font-weight: 700; fill: #4b5361; }
    .tick { font-size: 10.5px; fill: #6b7280; }
    .src { font-size: 10.5px; fill: #6b7280; }
  </style>

  <rect x="0" y="0" width="780" height="480" fill="#f8faf9"/>

  <text x="24" y="32" class="title">공항 검색대 vs 비행기 vs 흉부 CT, 방사선량 비교</text>
  <text x="24" y="52" class="axisnote">가로축은 로그 스케일(μSv, 100만분의 1시버트) · 오른쪽으로 갈수록 선량이 커짐 · 2026-09-26 기준</text>

  <!-- log axis: 0.01(x=230) .. 10,000(x=638), 68px per decade -->
  <g>
    <line x1="230" y1="70" x2="638" y2="70" stroke="#c8ccd1" stroke-width="1"/>
    <line x1="230" y1="68" x2="230" y2="416" stroke="#e6e4de" stroke-width="1"/>
    <line x1="298" y1="68" x2="298" y2="416" stroke="#e6e4de" stroke-width="1"/>
    <line x1="366" y1="68" x2="366" y2="416" stroke="#e6e4de" stroke-width="1"/>
    <line x1="434" y1="68" x2="434" y2="416" stroke="#e6e4de" stroke-width="1"/>
    <line x1="502" y1="68" x2="502" y2="416" stroke="#e6e4de" stroke-width="1"/>
    <line x1="570" y1="68" x2="570" y2="416" stroke="#e6e4de" stroke-width="1"/>
    <line x1="638" y1="68" x2="638" y2="416" stroke="#e6e4de" stroke-width="1"/>
    <text x="230" y="63" text-anchor="middle" class="tick">0.01</text>
    <text x="298" y="63" text-anchor="middle" class="tick">0.1</text>
    <text x="366" y="63" text-anchor="middle" class="tick">1</text>
    <text x="434" y="63" text-anchor="middle" class="tick">10</text>
    <text x="502" y="63" text-anchor="middle" class="tick">100</text>
    <text x="570" y="63" text-anchor="middle" class="tick">1,000</text>
    <text x="638" y="63" text-anchor="middle" class="tick">10,000</text>
  </g>

  <!-- Row 1: 전신 스캐너 (백스캐터 X선 기준) ~0.04uSv, log10(4)*68=41 -->
  <text x="24" y="96" class="label">전신 스캐너 1회</text>
  <text x="24" y="111" class="sub">(과거 미국 백스캐터 X선 기준)</text>
  <rect x="230" y="118" width="41" height="20" rx="4" fill="#0b6e4f"/>
  <text x="281" y="133" class="value">약 0.03~0.05μSv</text>
  <text x="230" y="152" class="sub">국내 공항은 밀리미터파(비전리) — 방사선량 0</text>

  <!-- Row 2: 수하물 검색대 옆 대기 ~0.2uSv, log10(20)*68=88.5 -->
  <text x="24" y="186" class="label">수하물 X선 검색대</text>
  <text x="24" y="201" class="sub">옆에서 대기 1회</text>
  <rect x="230" y="181" width="89" height="20" rx="4" fill="#0b6e4f"/>
  <text x="329" y="196" class="value">최대 약 0.2μSv</text>

  <!-- Row 3: 인천-뉴욕 왕복 ~100-200uSv, log10(15000)*68=284 -->
  <text x="24" y="251" class="label">인천~뉴욕</text>
  <text x="24" y="266" class="sub">왕복 비행 1회(우주방사선)</text>
  <rect x="230" y="246" width="284" height="20" rx="4" fill="#f5a623"/>
  <text x="524" y="261" class="value2">약 100~200μSv</text>

  <!-- Row 4: 흉부 CT 7000uSv, log10(700000)*68=397.5 -->
  <text x="24" y="316" class="label">흉부 CT 1회</text>
  <rect x="230" y="311" width="398" height="20" rx="4" fill="#c0392b"/>
  <text x="638" y="326" class="value3">7,000μSv</text>

  <!-- Row 5: 연간 자연방사선 3000uSv, log10(300000)*68=372.4 -->
  <text x="24" y="366" class="label">연간 자연방사선</text>
  <text x="24" y="381" class="sub">(한국인 평균)</text>
  <rect x="230" y="361" width="372" height="20" rx="4" fill="#6b7280"/>
  <text x="612" y="376" class="value4">3,000μSv</text>

  <line x1="230" y1="416" x2="638" y2="416" stroke="#c8ccd1" stroke-width="1"/>

  <text x="24" y="440" class="src">자료: ANSI/HPS N43.17-2009 및 미국 HPS·NAS 실측 자료(전신 스캐너), 독일 BfS(수하물 검색대 승객 선량),</text>
  <text x="24" y="456" class="src">원자력안전위원회·UNSCEAR(비행 우주방사선·연간 자연방사선), 질병관리청·ICRP Publication 103(흉부 CT)</text>
  <text x="24" y="472" class="src">국토교통부(국내 원형검색장비 밀리미터파 확인, 2017) · 2026-09-26 기준</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="760" height="660" role="img" aria-labelledby="t d" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Korea's electricity market: generators, KPX, KEPCO, customers</title>
  <desc id="d">Flow diagram: state gencos and private generators sell into KPX's wholesale market, which sets the hourly system marginal price, capacity payment and settlement adjustment coefficient; KEPCO buys everything and resells to customers at government-set tariffs by class, with dated figures on SMP, capacity payments and KEPCO's losses as of September 2026.</desc>
  <defs>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b6e4f"/>
    </marker>
    <marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5a623"/>
    </marker>
    <marker id="ah-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="760" height="660" fill="#f8faf9"/>

  <!-- Title -->
  <text x="20" y="30" font-size="17" font-weight="700" fill="#111827">Korea's electricity market, step by step</text>
  <text x="20" y="48" font-size="11.5" fill="#6b7280">Generators sell into KPX; KEPCO buys everything and resells by tariff class. As of September 2026.</text>

  <!-- Generator boxes -->
  <g>
    <rect x="20" y="60" width="340" height="90" rx="8" fill="#0b6e4f"/>
    <text x="32" y="80" font-size="13" font-weight="700" style="fill:#fff">KHNP + 5 state gencos</text>
    <text x="32" y="98" font-size="11" style="fill:#fff">Nuclear, hydro, coal — KEPCO's own</text>
    <text x="32" y="114" font-size="11" style="fill:#fff">generation subsidiaries</text>
    <text x="32" y="134" font-size="12" font-weight="700" style="fill:#fff">Paid SMP × adjustment coefficient</text>
  </g>
  <g>
    <rect x="400" y="60" width="340" height="90" rx="8" fill="#f5a623"/>
    <text x="412" y="80" font-size="13" font-weight="700" style="fill:#fff">Private &amp; IPP generators</text>
    <text x="412" y="98" font-size="11" style="fill:#fff">Merchant LNG and coal plants</text>
    <text x="412" y="114" font-size="11" style="fill:#fff">outside the KEPCO group</text>
    <text x="412" y="134" font-size="12" font-weight="700" style="fill:#fff">Paid full SMP, no coefficient</text>
  </g>

  <!-- Arrows generators -> KPX -->
  <line x1="190" y1="150" x2="190" y2="168" stroke="#0b6e4f" stroke-width="3" marker-end="url(#ah-g)"/>
  <line x1="570" y1="150" x2="570" y2="168" stroke="#f5a623" stroke-width="3" marker-end="url(#ah-o)"/>

  <!-- KPX box -->
  <rect x="20" y="170" width="720" height="220" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="34" y="192" font-size="13" font-weight="700" fill="#111827">KOREA POWER EXCHANGE (KPX) — WHOLESALE MARKET</text>
  <text x="34" y="208" font-size="10.5" fill="#6b7280">Clears a day ahead; the hour's price applies to every generator dispatched</text>

  <text x="34" y="232" font-size="12" font-weight="700" fill="#b45309">1. Hourly System Marginal Price (SMP)</text>
  <text x="46" y="248" font-size="11" fill="#374151">Set by the priciest plant dispatched — usually the last LNG unit.</text>
  <text x="46" y="264" font-size="11" fill="#374151">Monthly average SMP peaked at &#8361;267.63/kWh in Dec. 2022 (KPX).</text>

  <text x="34" y="288" font-size="12" font-weight="700" fill="#374151">2. Capacity payment (CP)</text>
  <text x="46" y="304" font-size="11" fill="#374151">Paid per kW of available capacity, not output.</text>
  <text x="46" y="320" font-size="11" fill="#374151">About &#8361;7.5 trillion of &#8361;78 trillion paid out in 2023 (KPX).</text>

  <text x="34" y="344" font-size="12" font-weight="700" fill="#0b6e4f">3. Settlement adjustment coefficient</text>
  <text x="46" y="360" font-size="11" fill="#374151">0&#8211;1 factor that claws back nuclear/coal margin above cost.</text>
  <text x="46" y="376" font-size="11" fill="#374151">Keeps KEPCO's own gencos from a windfall when SMP spikes.</text>

  <!-- Arrow KPX -> KEPCO -->
  <line x1="380" y1="390" x2="380" y2="408" stroke="#6b7280" stroke-width="3" marker-end="url(#ah-gr)"/>

  <!-- KEPCO box -->
  <rect x="140" y="410" width="480" height="80" rx="8" fill="#fff" stroke="#b45309" stroke-width="2"/>
  <text x="380" y="434" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">KEPCO — THE SOLE RETAILER</text>
  <text x="380" y="452" font-size="11" fill="#374151" text-anchor="middle">Buys everything KPX settles; sells at gov't-set tariffs.</text>
  <text x="380" y="468" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">2021&#8211;23 cumulative operating loss &#8776; &#8361;43 trillion (KEPCO)</text>

  <!-- Arrow KEPCO -> customers (branching) -->
  <line x1="380" y1="490" x2="380" y2="500" stroke="#6b7280" stroke-width="3"/>
  <line x1="130" y1="500" x2="630" y2="500" stroke="#6b7280" stroke-width="3"/>
  <line x1="130" y1="500" x2="130" y2="508" stroke="#6b7280" stroke-width="3" marker-end="url(#ah-gr)"/>
  <line x1="380" y1="500" x2="380" y2="508" stroke="#6b7280" stroke-width="3" marker-end="url(#ah-gr)"/>
  <line x1="630" y1="500" x2="630" y2="508" stroke="#6b7280" stroke-width="3" marker-end="url(#ah-gr)"/>

  <!-- Customer boxes -->
  <g>
    <rect x="20" y="510" width="220" height="95" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="32" y="532" font-size="12.5" font-weight="700" fill="#374151">Residential (tiered)</text>
    <text x="32" y="550" font-size="10.5" fill="#374151">3 tiers; wider limits Jul&#8211;Aug</text>
    <text x="32" y="566" font-size="10.5" fill="#374151">Frozen 14 qtrs (Q4 2026)</text>
  </g>
  <g>
    <rect x="270" y="510" width="220" height="95" rx="8" fill="#fff" stroke="#b45309" stroke-width="1.5"/>
    <text x="282" y="532" font-size="12.5" font-weight="700" fill="#b45309">Industrial</text>
    <text x="282" y="550" font-size="10.5" fill="#374151">Over half of national demand</text>
    <text x="282" y="566" font-size="10.5" fill="#374151">+~70% cumulative since 2022</text>
  </g>
  <g>
    <rect x="520" y="510" width="220" height="95" rx="8" fill="#fff" stroke="#0b6e4f" stroke-width="1.5"/>
    <text x="532" y="532" font-size="12.5" font-weight="700" fill="#0b6e4f">General &amp; other</text>
    <text x="532" y="550" font-size="10.5" fill="#374151">Commercial, farms, lighting</text>
    <text x="532" y="566" font-size="10.5" fill="#374151">Regional pricing due 2026</text>
  </g>

  <!-- Footer -->
  <text x="20" y="636" font-size="10" fill="#6b7280">As of September 2026 &#183; Sources: KPX, KEPCO, MOTIE/MCEE</text>
  <text x="740" y="636" font-size="10" fill="#6b7280" text-anchor="end">energynote.kr/en</text>
</svg>

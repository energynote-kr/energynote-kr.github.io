<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="t d" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Korea's power grid: generation clusters, capital-region demand, and the HVDC corridors between them</title>
  <desc id="d">Flow strip: three generation clusters on the left (east coast nuclear and coal, west coast, southwest solar and Jeju), the capital region's demand on the right, HVDC corridors between them with capacity and status, and a bottleneck callout.</desc>
  <defs>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b6e4f"/>
    </marker>
    <marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5a623"/>
    </marker>
    <marker id="ah-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="760" height="520" fill="#f8faf9"/>

  <!-- Title -->
  <text x="20" y="30" font-size="17" font-weight="700" fill="#111827">Korea's grid: power on the coasts, demand around Seoul, HVDC in between</text>
  <text x="20" y="49" font-size="11.5" fill="#6b7280">Regional self-sufficiency = generation ÷ consumption, Jan–Jul 2025 (KEPCO data). Line status as of September 2026.</text>

  <!-- Column headers -->
  <text x="20" y="76" font-size="11" font-weight="700" fill="#0b6e4f" letter-spacing="0.5">WHERE THE ELECTRICITY IS MADE</text>
  <text x="740" y="76" font-size="11" font-weight="700" fill="#f5a623" letter-spacing="0.5" text-anchor="end">WHERE IT IS USED</text>
  <text x="380" y="76" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="0.5" text-anchor="middle">HVDC CORRIDORS</text>

  <!-- Generation boxes (left) -->
  <g>
    <rect x="20" y="88" width="228" height="78" rx="8" fill="#0b6e4f"/>
    <text x="32" y="108" font-size="12.5" font-weight="700" style="fill:#fff">East coast: nuclear + coal</text>
    <text x="32" y="126" font-size="11" style="fill:#fff">Hanul 8.7 GW, Wolsong, Kori–Saeul</text>
    <text x="32" y="142" font-size="11" style="fill:#fff">Samcheok, Gangneung coal</text>
    <text x="32" y="158" font-size="11" font-weight="700" style="fill:#fff">Gyeongbuk self-sufficiency 263%</text>
  </g>
  <g>
    <rect x="20" y="180" width="228" height="78" rx="8" fill="#0b6e4f"/>
    <text x="32" y="200" font-size="12.5" font-weight="700" style="fill:#fff">West coast: Hanbit + coal</text>
    <text x="32" y="218" font-size="11" style="fill:#fff">Hanbit 5.9 GW (Jeonnam)</text>
    <text x="32" y="234" font-size="11" style="fill:#fff">Chungnam coal and gas fleet</text>
    <text x="32" y="250" font-size="11" font-weight="700" style="fill:#fff">Chungnam self-sufficiency 181%</text>
  </g>
  <g>
    <rect x="20" y="272" width="228" height="78" rx="8" fill="#0b6e4f"/>
    <text x="32" y="292" font-size="12.5" font-weight="700" style="fill:#fff">Southwest: solar + Jeju wind</text>
    <text x="32" y="310" font-size="11" style="fill:#fff">Korea's densest solar fleet</text>
    <text x="32" y="326" font-size="11" style="fill:#fff">Mainland curtailment since Apr 2024</text>
    <text x="32" y="342" font-size="11" font-weight="700" style="fill:#fff">Jeonnam self-sufficiency 208%</text>
  </g>

  <!-- Demand boxes (right) -->
  <g>
    <rect x="512" y="88" width="228" height="124" rx="8" fill="#f5a623"/>
    <text x="524" y="108" font-size="12.5" font-weight="700" style="fill:#fff">Capital region</text>
    <text x="524" y="126" font-size="11" style="fill:#fff">Seoul, Gyeonggi, Incheon</text>
    <text x="524" y="146" font-size="11" font-weight="700" style="fill:#fff">~40% of national electricity</text>
    <text x="524" y="162" font-size="11" font-weight="700" style="fill:#fff">purchases (2024)</text>
    <text x="524" y="182" font-size="11" style="fill:#fff">Seoul self-sufficiency 7.5%</text>
    <text x="524" y="198" font-size="11" style="fill:#fff">Daejeon 3.3% (lowest)</text>
  </g>
  <g>
    <rect x="512" y="226" width="228" height="124" rx="8" fill="#fff" stroke="#f5a623" stroke-width="2"/>
    <text x="524" y="246" font-size="12.5" font-weight="700" fill="#b45309">Data center queue (Seoul area)</text>
    <text x="524" y="264" font-size="11" fill="#374151">522 filings asking 33.6 GW</text>
    <text x="524" y="280" font-size="11" fill="#374151">(cumulative to Mar 2026)</text>
    <text x="524" y="300" font-size="11" font-weight="700" fill="#b45309">10 approved = 1.9%</text>
    <text x="524" y="320" font-size="11" fill="#374151">Honam needs +7.5 GW for fabs</text>
    <text x="524" y="336" font-size="11" fill="#374151">and AI data centers (ministry, Aug 2026)</text>
  </g>

  <!-- Arrows / corridors -->
  <!-- East coast corridor: planned -->
  <line x1="252" y1="118" x2="506" y2="118" stroke="#f5a623" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ah-o)"/>
  <text x="380" y="100" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">East Coast–capital HVDC, 2 × 4 GW</text>
  <text x="380" y="134" font-size="10" fill="#6b7280" text-anchor="middle">Stage 1 due Dec 2027 · stage 2 2029 at earliest</text>
  <text x="380" y="147" font-size="10" fill="#6b7280" text-anchor="middle">Dongseoul converter station: permit pending</text>

  <!-- West coast corridor: in service -->
  <line x1="252" y1="213" x2="506" y2="213" stroke="#0b6e4f" stroke-width="3" marker-end="url(#ah-g)"/>
  <text x="380" y="196" font-size="10.5" font-weight="700" fill="#0b6e4f" text-anchor="middle">Bukdangjin–Godeok HVDC, 3 GW</text>
  <text x="380" y="229" font-size="10" fill="#6b7280" text-anchor="middle">In service: 1.5 GW 2020 + 1.5 GW 2024</text>

  <!-- Southwest corridor: planned -->
  <line x1="252" y1="300" x2="506" y2="300" stroke="#f5a623" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ah-o)"/>
  <text x="380" y="283" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">West Coast "energy highway", 4 × 2 GW</text>
  <text x="380" y="316" font-size="10" fill="#6b7280" text-anchor="middle">Submarine 525 kV · stage 1 2030 · all by 2038</text>

  <!-- Jeju links: in service, small -->
  <line x1="252" y1="340" x2="300" y2="340" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-gr)" marker-start="url(#ah-gr)"/>
  <text x="306" y="344" font-size="10" font-weight="700" fill="#6b7280">Jeju links 0.9 GW</text>
  <text x="254" y="358" font-size="10" fill="#6b7280">1998, 2014, 2024 · #3 is reversible (VSC)</text>

  <!-- Legend -->
  <line x1="20" y1="372" x2="48" y2="372" stroke="#0b6e4f" stroke-width="3"/>
  <text x="54" y="376" font-size="10" fill="#374151">in service</text>
  <line x1="120" y1="372" x2="148" y2="372" stroke="#f5a623" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="154" y="376" font-size="10" fill="#374151">under construction or planned</text>

  <!-- Bottleneck callout -->
  <rect x="20" y="388" width="720" height="96" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="34" y="408" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="0.5">WHY THE LINES LAG</text>

  <g>
    <text x="34" y="440" font-size="22" font-weight="700" fill="#b45309">1.9%</text>
    <text x="34" y="458" font-size="10" fill="#374151">Seoul-area data center</text>
    <text x="34" y="471" font-size="10" fill="#374151">applications approved</text>
  </g>
  <g>
    <text x="200" y="440" font-size="22" font-weight="700" fill="#b45309">9.6 GW</text>
    <text x="200" y="458" font-size="10" fill="#374151">of data center applications</text>
    <text x="200" y="471" font-size="10" fill="#374151">waiting nationwide (Mar 2026)</text>
  </g>
  <g>
    <text x="380" y="440" font-size="22" font-weight="700" fill="#b45309">2–3 yrs</text>
    <text x="380" y="458" font-size="10" fill="#374151">power transformer lead time</text>
    <text x="380" y="471" font-size="10" fill="#374151">(Wood Mackenzie, 2025–26)</text>
  </g>
  <g>
    <text x="560" y="440" font-size="22" font-weight="700" fill="#b45309">189</text>
    <text x="560" y="458" font-size="10" fill="#374151">substations closed to new</text>
    <text x="560" y="471" font-size="10" fill="#374151">renewable connections</text>
  </g>

  <!-- Footer -->
  <text x="20" y="506" font-size="10" fill="#6b7280">As of September 2026 · Sources: KEPCO, MCEE, KPX</text>
  <text x="740" y="506" font-size="10" fill="#6b7280" text-anchor="end">energynote.kr/en</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1e2430; }
    .box { font-size: 14px; font-weight: 800; fill: #ffffff; }
    .desc { font-size: 12px; fill: #1e2430; }
    .small { font-size: 11.5px; fill: #5a6472; }
  </style>
  <text x="20" y="30" class="title">Two roads for spent nuclear fuel</text>

  <!-- Start -->
  <rect x="20" y="140" width="150" height="70" rx="12" fill="#5a6472"/>
  <text x="36" y="170" class="box">Spent fuel</text>
  <text x="36" y="192" class="desc" fill="#ffffff">stored at reactor site</text>

  <!-- Branch arrows -->
  <path d="M 170 165 C 200 165, 200 100, 240 100" stroke="#0b6e4f" stroke-width="2.5" fill="none"/>
  <polygon points="240,100 230,94 230,106" fill="#0b6e4f"/>
  <path d="M 170 185 C 200 185, 200 250, 240 250" stroke="#f5a623" stroke-width="2.5" fill="none"/>
  <polygon points="240,250 230,244 230,256" fill="#f5a623"/>

  <!-- Reprocessing route -->
  <rect x="245" y="70" width="150" height="60" rx="12" fill="#0b6e4f"/>
  <text x="260" y="96" class="box">Reprocessing</text>
  <text x="260" y="116" class="desc" fill="#ffffff">recover U and Pu</text>
  <line x1="395" y1="100" x2="430" y2="100" stroke="#0b6e4f" stroke-width="2.5"/>
  <polygon points="430,100 420,94 420,106" fill="#0b6e4f"/>
  <rect x="435" y="70" width="120" height="60" rx="12" fill="#2f8668"/>
  <text x="447" y="96" class="box">New fuel</text>
  <text x="447" y="116" class="desc" fill="#ffffff">resource reuse</text>
  <line x1="555" y1="100" x2="590" y2="100" stroke="#0b6e4f" stroke-width="2.5"/>
  <polygon points="590,100 580,94 580,106" fill="#0b6e4f"/>
  <rect x="595" y="70" width="105" height="60" rx="12" fill="#3f9274"/>
  <text x="607" y="96" class="box">Vitrify</text>
  <text x="607" y="116" class="desc" fill="#ffffff">→ repository</text>
  <text x="245" y="50" class="small" fill="#0b6e4f">France, Russia, China, Japan, India — costly; proliferation concerns</text>

  <!-- Direct disposal route -->
  <rect x="245" y="215" width="150" height="70" rx="12" fill="#f5a623"/>
  <text x="260" y="249" class="box" fill="#1e2430">Direct disposal</text>
  <text x="260" y="269" class="desc">sealed in casks as is</text>
  <line x1="395" y1="250" x2="430" y2="250" stroke="#f5a623" stroke-width="2.5"/>
  <polygon points="430,250 420,244 420,256" fill="#f5a623"/>
  <rect x="435" y="215" width="265" height="70" rx="12" fill="#e0a52a"/>
  <text x="450" y="239" class="box" fill="#1e2430">Deep geological repository</text>
  <text x="450" y="256" class="desc">hundreds of meters down in rock</text>
  <text x="450" y="273" class="desc">Finland's Onkalo will be the world's first</text>
  <text x="245" y="305" class="small" fill="#b07d10">Finland, Sweden, US, Canada, Germany — simpler, cheaper; siting is the hurdle</text>

  <rect x="20" y="322" width="680" height="28" fill="#e3f2ec" rx="8"/>
  <text x="40" y="341" class="small" font-size="12.5">Korea: undecided — 123 Agreement limits reprocessing; pyroprocessing R&amp;D; siting law only since 2025</text>
</svg>

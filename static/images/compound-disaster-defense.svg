<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">복합재난에 대비한 원전 심층방어 5단계 계단과 2020년 태풍 정지 사례</title>
  <style>
    .title { font-size: 18px; font-weight: 800; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .step { font-size: 13px; font-weight: 800; }
    .body { font-size: 12px; fill: #1f2937; }
    .foot { font-size: 10.5px; fill: #6b7280; }
  </style>
  <rect width="720" height="500" fill="#f8faf9"/>
  <text x="20" y="32" class="title">태풍·지진이 겹쳐도 — 원전 심층방어 5단계</text>
  <text x="20" y="52" class="sub">후쿠시마(2011)의 연쇄: 지진 → 쓰나미 → 전원 상실 → 냉각 상실. 각 고리를 끊는 대비를 계단으로 그렸습니다.</text>

  <!-- step 1 -->
  <rect x="20" y="330" width="132" height="80" rx="6" fill="#0b6e4f"/>
  <text x="30" y="352" class="step" style="fill:#fff">1  설계 기준</text>
  <text x="30" y="374" class="body" style="fill:#fff">내진 0.2g(기존)</text>
  <text x="30" y="390" class="body" style="fill:#fff">APR1400 0.3g</text>
  <text x="30" y="406" class="body" style="fill:#fff">0.18g 자동정지</text>

  <!-- step 2 -->
  <rect x="156" y="270" width="132" height="140" rx="6" fill="#0b6e4f"/>
  <text x="166" y="292" class="step" style="fill:#fff">2  후속조치 56건</text>
  <text x="166" y="314" class="body" style="fill:#fff">55건 완료(2024.3)</text>
  <text x="166" y="330" class="body" style="fill:#fff">방벽 7.5m → 10m</text>
  <text x="166" y="346" class="body" style="fill:#fff">방수문·자동정지</text>
  <text x="166" y="362" class="body" style="fill:#fff">핵심계통 0.3g</text>

  <!-- step 3 -->
  <rect x="292" y="210" width="132" height="200" rx="6" fill="#0b6e4f"/>
  <text x="302" y="232" class="step" style="fill:#fff">3  비상전원·냉각</text>
  <text x="302" y="254" class="body" style="fill:#fff">외부전원→비상디젤</text>
  <text x="302" y="270" class="body" style="fill:#fff">→대체교류→발전차</text>
  <text x="302" y="286" class="body" style="fill:#fff">3.2MW + 1MW급</text>
  <text x="302" y="302" class="body" style="fill:#fff">펌프차 해수 주입</text>

  <!-- step 4 -->
  <rect x="428" y="150" width="132" height="260" rx="6" fill="#0b6e4f"/>
  <text x="438" y="172" class="step" style="fill:#fff">4  방재 훈련</text>
  <text x="438" y="194" class="body" style="fill:#fff">국가 연합훈련 매년</text>
  <text x="438" y="210" class="body" style="fill:#fff">2024 새울 2호기</text>
  <text x="438" y="226" class="body" style="fill:#fff">2025 한울 5호기</text>
  <text x="438" y="242" class="body" style="fill:#fff">지진+누출 복합</text>
  <text x="438" y="258" class="body" style="fill:#fff">IAEA 복합비상</text>
  <text x="438" y="274" class="body" style="fill:#fff">과정(2026.5 칠레)</text>

  <!-- step 5 -->
  <rect x="564" y="90" width="136" height="320" rx="6" fill="#f5a623"/>
  <text x="574" y="112" class="step" fill="#1f2937">5  주민 보호조치</text>
  <text x="574" y="134" class="body">3~5km 예방 대피</text>
  <text x="574" y="150" class="body">20~30km 긴급보호</text>
  <text x="574" y="166" class="body">옥내대피 10mSv/2일</text>
  <text x="574" y="182" class="body">소개 50mSv/1주</text>
  <text x="574" y="198" class="body">KI는 지시 후 복용</text>

  <line x1="20" y1="412" x2="700" y2="412" stroke="#6b7280" stroke-width="1"/>

  <rect x="20" y="426" width="680" height="40" rx="8" fill="#e3f2ec"/>
  <text x="34" y="443" class="body" font-weight="700">2020년 9월 태풍 마이삭·하이선 — 고리·신고리·월성 6기 정지</text>
  <text x="34" y="459" class="body">원인은 소금기 섬락(송전 설비). 원자로 자동정지·비상디젤 기동, 안전계통 정상 → 설비 밀폐형 전환, 태풍 시 출력 감발</text>

  <text x="20" y="488" class="foot">출처: 원안위·산업부 태풍 조사 결과(2020.9), KINS 후쿠시마 후속조치, 원안위 연합훈련 자료(2024·2025), IAEA(2026.5) · 2026.9.6 기준</text>
</svg>

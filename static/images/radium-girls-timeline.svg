<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif">
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1e2430; }
    .year { font-size: 14px; font-weight: 800; fill: #c0392b; }
    .ev { font-size: 12.5px; fill: #1e2430; font-weight: 700; }
    .small { font-size: 11.5px; fill: #5a6472; }
  </style>
  <text x="20" y="30" class="title">라듐 걸스 — 비극이 규제를 만들기까지</text>

  <line x1="50" y1="150" x2="690" y2="150" stroke="#c9c6bd" stroke-width="4"/>
  <g fill="#c0392b">
    <circle cx="80" cy="150" r="8"/><circle cx="230" cy="150" r="8"/><circle cx="380" cy="150" r="8"/>
  </g>
  <g fill="#0b6e4f">
    <circle cx="530" cy="150" r="8"/><circle cx="660" cy="150" r="8"/>
  </g>

  <text x="40" y="95" class="year">1917~</text>
  <text x="40" y="113" class="ev">야광 시계 공장</text>
  <text x="40" y="129" class="small">라듐 페인트 붓끝을</text>
  <text x="40" y="143" class="small">입술로 다듬는 작업 관행</text>

  <text x="190" y="185" class="year">1920년대</text>
  <text x="190" y="203" class="ev">턱뼈 괴사·빈혈·골종양</text>
  <text x="190" y="219" class="small">삼킨 라듐이 뼈에 침착 —</text>
  <text x="190" y="233" class="small">알파선 내부피폭의 참상</text>

  <text x="340" y="95" class="year">1927~28</text>
  <text x="340" y="113" class="ev">'라듐 걸스' 소송</text>
  <text x="340" y="129" class="small">여공 5명이 회사를 상대로</text>
  <text x="340" y="143" class="small">싸워 합의 — 사회적 각성</text>

  <text x="490" y="185" class="year" fill="#0b6e4f">1941</text>
  <text x="490" y="203" class="ev">체내 라듐 한도 설정</text>
  <text x="490" y="219" class="small">0.1μCi — 최초의</text>
  <text x="490" y="233" class="small">내부피폭 기준 탄생</text>

  <text x="600" y="95" class="year" fill="#0b6e4f">이후</text>
  <text x="600" y="113" class="ev">라듐 도료 퇴출</text>
  <text x="600" y="129" class="small">트리튬→축광 도료로</text>

  <rect x="20" y="262" width="680" height="46" fill="#e3f2ec" rx="10"/>
  <text x="40" y="282" class="ev" font-size="13">핵심</text>
  <text x="40" y="300" class="small" font-size="12.5">몸 밖에서는 무해한 알파선원도 삼키면 치명적 — 오늘의 내부피폭 규제와 노동안전법의 출발점</text>
</svg>

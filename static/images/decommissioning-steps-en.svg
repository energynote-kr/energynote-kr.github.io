<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-labelledby="t" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The four stages of nuclear decommissioning (fuel removal, decontamination, cutting and dismantling, waste handling and site restoration) and Kori-1's planned schedule from approval in June 2025 to completion in 2037</title>
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1e2430; }
    .step { font-size: 14px; font-weight: 800; }
    .desc { font-size: 12px; fill: #1e2430; }
    .small { font-size: 11.5px; fill: #5a6472; }
  </style>
  <text x="20" y="30" class="title">Four stages of decommissioning — radiation management, not demolition</text>

  <g>
    <rect x="20" y="70" width="170" height="60" rx="12" fill="#0b6e4f"/>
    <text x="34" y="96" class="step" style="fill:#fff">① Fuel removal</text>
    <text x="34" y="116" class="desc" style="fill:#fff">Most radioactivity leaves</text>

    <rect x="210" y="70" width="170" height="60" rx="12" fill="#1f7a5c"/>
    <text x="224" y="96" class="step" style="fill:#fff">② Decontamination</text>
    <text x="224" y="116" class="desc" style="fill:#fff">Chemicals, water, dry ice</text>

    <rect x="400" y="70" width="170" height="60" rx="12" fill="#2f8668"/>
    <text x="414" y="96" class="step" style="fill:#fff">③ Cut and dismantle</text>
    <text x="414" y="116" class="desc" style="fill:#fff">Remote tools and robots</text>

    <rect x="590" y="70" width="170" height="60" rx="12" fill="#3f9274"/>
    <text x="604" y="96" class="step" style="fill:#fff">④ Waste and restore</text>
    <text x="604" y="116" class="desc" style="fill:#fff">Sort by level, reuse site</text>
  </g>
  <g stroke="#5a6472" stroke-width="2">
    <line x1="190" y1="100" x2="208" y2="100"/><line x1="380" y1="100" x2="398" y2="100"/><line x1="570" y1="100" x2="588" y2="100"/>
  </g>

  <!-- Kori-1 timeline -->
  <text x="20" y="170" class="desc" font-weight="700">Kori-1 schedule (plan)</text>
  <line x1="40" y1="215" x2="740" y2="215" stroke="#c9c6bd" stroke-width="3"/>
  <g fill="#f5a623">
    <circle cx="60" cy="215" r="7"/><circle cx="260" cy="215" r="7"/><circle cx="480" cy="215" r="7"/><circle cx="720" cy="215" r="7"/>
  </g>
  <text x="30" y="245" class="small">Jun 2025 approved</text>
  <text x="30" y="260" class="small">Nov 2025 work begins</text>
  <text x="230" y="245" class="small">~2031 fuel to dry storage</text>
  <text x="230" y="260" class="small">non-radiological areas first</text>
  <text x="450" y="245" class="small">~2035 decon and dismantling</text>
  <text x="450" y="260" class="small">controlled-area work</text>
  <text x="670" y="245" class="small">2037 complete</text>
  <text x="670" y="260" class="small">site restored</text>

  <rect x="20" y="280" width="740" height="30" fill="#e3f2ec" rx="8"/>
  <text x="40" y="300" class="small" font-size="12.5">Total cost about KRW 1,071.3 billion ($790 million) · biggest variable: how fast the spent-fuel dry storage facility is secured</text>

  <text x="20" y="330" class="small" font-size="10">As of September 2026 · Sources: NSSC decommissioning approval (Jun 2025), KHNP decommissioning plan, Doosan Enerbility (Nov 2025)</text>
</svg>

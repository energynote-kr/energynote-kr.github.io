<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">Uranium enrichment scale: natural 0.7%, LEU 3-5% for power reactors, HALEU above 5% and below 20%, the 20% line, HEU at 20% and above, and weapons use at 90% or more, with the main use of each band</title>
  <rect x="0" y="0" width="720" height="410" fill="#f8faf9"/>

  <text x="20" y="32" font-size="17" font-weight="800" fill="#1f2937">Uranium enrichment levels: lines of use and control, not of danger</text>
  <text x="20" y="54" font-size="12" fill="#6b7280">Share of uranium-235 in uranium · band widths are not to scale</text>

  <!-- 20% line label -->
  <text x="440" y="86" font-size="13" font-weight="800" text-anchor="middle" fill="#c27c0e">The 20% line</text>

  <!-- bands -->
  <rect x="30" y="98" width="105" height="60" fill="#6b7280"/>
  <text x="82" y="124" font-size="14" font-weight="800" text-anchor="middle" style="fill:#fff">Natural</text>
  <text x="82" y="145" font-size="12" text-anchor="middle" style="fill:#fff">0.7%</text>

  <rect x="135" y="98" width="145" height="60" fill="#0b6e4f"/>
  <text x="207" y="124" font-size="14" font-weight="800" text-anchor="middle" style="fill:#fff">LEU</text>
  <text x="207" y="145" font-size="12" text-anchor="middle" style="fill:#fff">3–5%</text>

  <rect x="280" y="98" width="160" height="60" fill="#e3f2ec" stroke="#0b6e4f" stroke-width="1.5"/>
  <text x="360" y="124" font-size="14" font-weight="800" text-anchor="middle" fill="#0b6e4f">HALEU</text>
  <text x="360" y="145" font-size="12" text-anchor="middle" fill="#1f2937">above 5%, below 20%</text>

  <rect x="440" y="98" width="140" height="60" fill="#fde9c4"/>
  <text x="510" y="124" font-size="14" font-weight="800" text-anchor="middle" fill="#1f2937">HEU</text>
  <text x="510" y="145" font-size="12" text-anchor="middle" fill="#1f2937">20% and above</text>

  <rect x="580" y="98" width="110" height="60" fill="#f5a623"/>
  <text x="635" y="124" font-size="14" font-weight="800" text-anchor="middle" fill="#1f2937">Weapons</text>
  <text x="635" y="145" font-size="12" text-anchor="middle" fill="#1f2937">90% or more</text>

  <!-- 20% line -->
  <line x1="440" y1="92" x2="440" y2="242" stroke="#f5a623" stroke-width="3.5"/>

  <!-- use boxes -->
  <rect x="32" y="170" width="101" height="64" rx="6" fill="#ffffff" stroke="#6b7280"/>
  <text x="82" y="196" font-size="12" text-anchor="middle" fill="#1f2937">As mined</text>
  <text x="82" y="216" font-size="12" text-anchor="middle" fill="#6b7280">99.3% U-238</text>

  <rect x="137" y="170" width="141" height="64" rx="6" fill="#ffffff" stroke="#0b6e4f"/>
  <text x="207" y="196" font-size="12" text-anchor="middle" fill="#1f2937">Large light-water</text>
  <text x="207" y="216" font-size="12" text-anchor="middle" fill="#6b7280">reactor fuel</text>

  <rect x="282" y="170" width="154" height="64" rx="6" fill="#ffffff" stroke="#0b6e4f"/>
  <text x="359" y="196" font-size="12" text-anchor="middle" fill="#1f2937">Needed by most</text>
  <text x="359" y="216" font-size="12" text-anchor="middle" fill="#6b7280">advanced designs (DOE)</text>

  <rect x="444" y="170" width="134" height="64" rx="6" fill="#ffffff" stroke="#f5a623"/>
  <text x="511" y="196" font-size="12" text-anchor="middle" fill="#1f2937">Strictest controls</text>
  <text x="511" y="216" font-size="12" text-anchor="middle" fill="#6b7280">some research fuel</text>

  <rect x="582" y="170" width="106" height="64" rx="6" fill="#ffffff" stroke="#f5a623"/>
  <text x="635" y="196" font-size="12" text-anchor="middle" fill="#1f2937">Weapons use</text>
  <text x="635" y="216" font-size="12" text-anchor="middle" fill="#6b7280">special plants</text>

  <!-- notes -->
  <rect x="20" y="254" width="680" height="96" rx="8" fill="#e3f2ec"/>
  <text x="34" y="278" font-size="12.5" fill="#1f2937">· 20% is a control line, not a physical cliff; it dates to a 1954 US AEC definition</text>
  <text x="34" y="302" font-size="12.5" fill="#1f2937">· Power reactor fuel (about 5% or less) cannot explode like a nuclear bomb (WNA)</text>
  <text x="34" y="326" font-size="12.5" fill="#1f2937">· SWU example: 1 kg of 5% fuel = ~10.4 kg natural uranium + ~7.9 SWU (0.25% tails)</text>

  <text x="20" y="376" font-size="10.5" fill="#6b7280">Sources: US NRC and DOE definitions; World Nuclear Association (WNA) information library;</text>
  <text x="20" y="392" font-size="10.5" fill="#6b7280">US National Academies, Reducing the Use of HEU in Civilian Research Reactors (2016) · As of Nov. 3, 2026</text>
</svg>

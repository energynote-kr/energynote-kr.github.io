<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">가동 가능 원자로 수 상위 10개국과 각국의 원전 발전 비중(세계원자력협회 2026년 11월 25일 갱신 표 기준)</title>
  <rect x="0" y="0" width="720" height="500" fill="#f8faf9"/>
  <text x="20" y="34" font-size="20" font-weight="700" fill="#1f2937">원전 많은 나라 상위 10개국: 원자로 수와 발전 비중</text>
  <text x="20" y="58" font-size="13" fill="#6b7280">원자로 수가 많다고 원전 의존도가 높은 것은 아닙니다</text>

  <text x="120" y="84" font-size="13" font-weight="700" fill="#1f2937">가동 가능 원자로 수(기)</text>
  <text x="500" y="84" font-size="13" font-weight="700" fill="#1f2937">발전 비중(2025년, %)</text>
  <line x1="480" y1="70" x2="480" y2="436" stroke="#d1d5db" stroke-width="1"/>

  <!-- 한국 행 배경 -->
  <rect x="10" y="262" width="700" height="30" rx="4" fill="#fdf0d9"/>

  <g font-size="14" fill="#1f2937">
    <!-- row i: top = 96 + i*34, bar h=20, text baseline top+15 -->
    <text x="110" y="111" text-anchor="end">미국</text>
    <rect x="120" y="96" width="300.0" height="20" fill="#0b6e4f"/>
    <text x="426" y="111">94</text>
    <rect x="500" y="96" width="31.1" height="20" fill="#6b7280"/>
    <text x="537" y="111">17.3</text>

    <text x="110" y="145" text-anchor="end">중국</text>
    <rect x="120" y="130" width="207.4" height="20" fill="#0b6e4f"/>
    <text x="333" y="145">65</text>
    <rect x="500" y="130" width="8.3" height="20" fill="#6b7280"/>
    <text x="514" y="145">4.6</text>

    <text x="110" y="179" text-anchor="end">프랑스</text>
    <rect x="120" y="164" width="181.9" height="20" fill="#0b6e4f"/>
    <text x="308" y="179">57</text>
    <rect x="500" y="164" width="122.8" height="20" fill="#6b7280"/>
    <text x="629" y="179">68.2</text>

    <text x="110" y="213" text-anchor="end">러시아</text>
    <rect x="120" y="198" width="108.5" height="20" fill="#0b6e4f"/>
    <text x="235" y="213">34</text>
    <rect x="500" y="198" width="32.9" height="20" fill="#6b7280"/>
    <text x="539" y="213">18.3</text>

    <text x="110" y="247" text-anchor="end">일본</text>
    <rect x="120" y="232" width="105.3" height="20" fill="#0b6e4f"/>
    <text x="231" y="247">33</text>
    <rect x="500" y="232" width="16.6" height="20" fill="#6b7280"/>
    <text x="523" y="247">9.2</text>

    <text x="110" y="281" text-anchor="end" font-weight="700">한국</text>
    <rect x="120" y="266" width="83.0" height="20" fill="#f5a623"/>
    <text x="209" y="281" font-weight="700">26</text>
    <rect x="500" y="266" width="52.9" height="20" fill="#f5a623"/>
    <text x="559" y="281" font-weight="700">29.4</text>

    <text x="110" y="315" text-anchor="end">인도</text>
    <rect x="120" y="300" width="76.6" height="20" fill="#0b6e4f"/>
    <text x="203" y="315">24</text>
    <rect x="500" y="300" width="4.7" height="20" fill="#6b7280"/>
    <text x="511" y="315">2.6</text>

    <text x="110" y="349" text-anchor="end">캐나다</text>
    <rect x="120" y="334" width="54.3" height="20" fill="#0b6e4f"/>
    <text x="181" y="349">17</text>
    <rect x="500" y="334" width="23.0" height="20" fill="#6b7280"/>
    <text x="529" y="349">12.8</text>

    <text x="110" y="383" text-anchor="end">우크라이나</text>
    <rect x="120" y="368" width="47.9" height="20" fill="#0b6e4f"/>
    <text x="174" y="383">15</text>
    <rect x="500" y="368" width="98.6" height="20" fill="#6b7280"/>
    <text x="605" y="383">54.8</text>

    <text x="110" y="417" text-anchor="end">영국</text>
    <rect x="120" y="402" width="28.7" height="20" fill="#0b6e4f"/>
    <text x="155" y="417">9</text>
    <rect x="500" y="402" width="22.1" height="20" fill="#6b7280"/>
    <text x="528" y="417">12.3</text>
  </g>

  <text x="20" y="456" font-size="12" fill="#1f2937">한국은 원자로 수·설비용량 모두 6위, 발전 비중은 11위입니다(원자로가 1기 이상인 32개국 중).</text>
  <text x="20" y="476" font-size="11" fill="#6b7280">가동 가능(operable)은 전력망에 연결된 원자로로, 장기 정지 호기도 포함합니다. 발전 비중은 2025년 실적.</text>
  <text x="20" y="492" font-size="11" fill="#6b7280">자료: 세계원자력협회(WNA) World Nuclear Power Reactors &amp; Uranium Requirements(2026년 11월 25일 갱신)</text>
</svg>

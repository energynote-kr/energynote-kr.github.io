<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Kori-1 timeline from commercial operation in 1978 to the 2037 site-restoration target</title>
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1e2430; }
    .year { font-size: 14px; font-weight: 800; fill: #0b6e4f; }
    .ev { font-size: 12px; fill: #1e2430; }
    .small { font-size: 11.5px; fill: #5a6472; }
  </style>
  <text x="20" y="30" class="title">Kori-1 timeline: 39 years of operation, 12 years of dismantling</text>

  <!-- axis -->
  <line x1="50" y1="150" x2="690" y2="150" stroke="#c9c6bd" stroke-width="4"/>
  <!-- operating segment -->
  <rect x="70" y="142" width="300" height="16" rx="6" fill="#0b6e4f" opacity="0.35"/>
  <text x="275" y="135" class="small" fill="#0b6e4f" text-anchor="middle">Operation, 39 years</text>
  <!-- dismantling segment -->
  <rect x="520" y="142" width="150" height="16" rx="6" fill="#f5a623" opacity="0.5"/>
  <text x="595" y="135" class="small" fill="#b07d10" text-anchor="middle">Dismantling, 12 years</text>

  <!-- markers -->
  <g fill="#0b6e4f">
    <circle cx="70" cy="150" r="8"/><circle cx="370" cy="150" r="8"/>
  </g>
  <g fill="#f5a623">
    <circle cx="460" cy="150" r="8"/><circle cx="560" cy="150" r="8"/><circle cx="670" cy="150" r="8"/>
  </g>
  <circle cx="415" cy="150" r="5" fill="#f5a623"/>

  <!-- labels above -->
  <text x="40" y="95" class="year">Apr 1978</text>
  <text x="40" y="112" class="ev">Commercial operation begins</text>
  <text x="40" y="126" class="small">Korea's first reactor, 587 MW</text>

  <text x="340" y="95" class="year">Jun 2017</text>
  <text x="340" y="112" class="ev">Permanent shutdown</text>
  <text x="340" y="126" class="small">First in Korea</text>

  <text x="700" y="95" class="year" text-anchor="end">2037</text>
  <text x="700" y="112" class="ev" text-anchor="end">Site restored (target)</text>

  <!-- labels below -->
  <text x="405" y="185" class="year" text-anchor="end">May 2021</text>
  <text x="405" y="202" class="ev" text-anchor="end">KHNP applies to dismantle</text>

  <text x="445" y="185" class="year">Jun 2025</text>
  <text x="445" y="202" class="ev">NSSC final approval</text>
  <text x="445" y="216" class="small">KRW 1.07 tn (~$790M)</text>

  <text x="580" y="185" class="year">Nov 2025</text>
  <text x="580" y="202" class="ev">Dismantling begins</text>
  <text x="580" y="216" class="small">Doosan-led consortium</text>

  <rect x="20" y="245" width="680" height="42" fill="#e3f2ec" rx="10"/>
  <text x="40" y="264" class="small" font-size="12.5">Ahead: spent fuel to dry storage ~2031 → controlled-area dismantling ~2035 → site restored 2037</text>
  <text x="40" y="280" class="small" font-size="12.5">Biggest variable: how fast the on-site dry storage facility is licensed and built</text>
</svg>

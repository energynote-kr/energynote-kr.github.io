<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Superhero radiation scorecard: Hulk, Spider-Man, the Fantastic Four, Daredevil, Doctor Manhattan and The WONDERfools listed with each hero's radiation origin, what that exposure would actually do in reality, and a science score out of 10. The Fantastic Four's cosmic rays and Daredevil's eye damage are flagged as real science; the common verdict is that radiation is something to manage, not a source of powers.</title>
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1f2937; }
    .hero { font-size: 13.5px; font-weight: 800; fill: #1f2937; }
    .lab { font-size: 12px; fill: #1f2937; }
    .small { font-size: 11.5px; fill: #6b7280; }
    .score { font-size: 13px; font-weight: 800; }
  </style>
  <rect x="0" y="0" width="780" height="440" fill="#f8faf9"/>

  <text x="20" y="30" class="title">Superhero radiation scorecard — what that radiation really does</text>

  <!-- header -->
  <text x="20" y="62" class="small" font-weight="700">Hero · origin story</text>
  <text x="320" y="62" class="small" font-weight="700">What happens in reality</text>
  <text x="704" y="62" class="small" font-weight="700">Score</text>
  <line x1="20" y1="70" x2="760" y2="70" stroke="#e6e4de"/>

  <!-- rows -->
  <text x="20" y="95" class="hero">Hulk</text>
  <text x="20" y="111" class="small">Gamma-bomb test exposure</text>
  <text x="320" y="95" class="lab">Acute dose of tens of Gy → death within days</text>
  <text x="320" y="111" class="lab">(no transformation)</text>
  <rect x="700" y="86" width="50" height="22" rx="6" fill="#c0392b"/>
  <text x="712" y="102" class="score" style="fill:#fff">0/10</text>

  <text x="20" y="140" class="hero">Spider-Man</text>
  <text x="20" y="156" class="small">Bitten by a radioactive spider</text>
  <text x="320" y="140" class="lab">Adults do not transform —</text>
  <text x="320" y="156" class="lab">but "radiation breeding" is real</text>
  <rect x="700" y="131" width="50" height="22" rx="6" fill="#e07b39"/>
  <text x="712" y="147" class="score" style="fill:#fff">2/10</text>

  <text x="20" y="185" class="hero">Fantastic Four</text>
  <text x="20" y="201" class="small">Cosmic rays inside a spacecraft</text>
  <text x="320" y="185" class="lab">Real astronaut exposure</text>
  <text x="320" y="201" class="lab">(about 80 mSv for six months on the ISS)</text>
  <rect x="700" y="176" width="50" height="22" rx="6" fill="#d9a441"/>
  <text x="712" y="192" class="score" style="fill:#fff">3/10</text>

  <text x="20" y="230" class="hero">Daredevil</text>
  <text x="20" y="246" class="small">Radioactive spill in the eyes → blind, heightened senses</text>
  <text x="320" y="230" class="lab">Eye damage and cataracts are real radiation effects —</text>
  <text x="320" y="246" class="lab">heightened senses are not</text>
  <rect x="700" y="221" width="50" height="22" rx="6" fill="#d9a441"/>
  <text x="712" y="237" class="score" style="fill:#fff">3/10</text>

  <text x="20" y="275" class="hero">Doctor Manhattan</text>
  <text x="20" y="291" class="small">Disassembled atom by atom, reassembled</text>
  <text x="320" y="275" class="lab">No physical basis —</text>
  <text x="320" y="291" class="lab">but the blue glow is real (Cherenkov effect)</text>
  <rect x="700" y="266" width="50" height="22" rx="6" fill="#c0392b"/>
  <text x="712" y="282" class="score" style="fill:#fff">1/10</text>

  <text x="20" y="320" class="hero">The WONDERfools (Netflix)</text>
  <text x="20" y="336" class="small">Powers from an "unexpected incident"</text>
  <text x="320" y="320" class="lab">Comedy premise —</text>
  <text x="320" y="336" class="lab">an adult body cannot be transformed by one event</text>
  <rect x="700" y="311" width="50" height="22" rx="6" fill="#e07b39"/>
  <text x="712" y="327" class="score" style="fill:#fff">2/10</text>

  <!-- common verdict -->
  <rect x="20" y="354" width="740" height="46" fill="#e3f2ec" rx="10"/>
  <text x="40" y="373" class="lab" font-weight="700" style="fill:#0b6e4f">Common verdict: radiation is something to manage, not a source of powers —</text>
  <text x="40" y="391" class="lab">but the Fantastic Four's cosmic rays and Daredevil's eye damage are real science</text>

  <text x="20" y="424" class="small" style="font-size:10.5px">Scores: EnergyNote's own 10-point plausibility rating · Sources: Marvel/DC originals, NASA/MSFC (2017), Zeitlin et al. (2013), ICRP 118 · As of September 2026</text>
</svg>

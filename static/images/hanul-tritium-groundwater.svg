<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">한울원전 취수구 해수 117Bq/L와 부지 지하수 관측정 30,000Bq/L 측정값을, 해양방사능 감시 구분값 100, 후쿠시마 배출 목표 1,500, WHO 먹는물 지침 10,000, 국내 배출관리기준 40,000Bq/L와 로그 눈금 막대로 비교하고 1리터를 마셨다고 가정한 선량을 정리한 그림</title>
  <rect x="0" y="0" width="720" height="520" fill="#f8faf9"/>

  <text x="20" y="34" font-size="18" font-weight="800" fill="#1f2937">삼중수소 농도, 한 자에 올려 보기</text>
  <text x="20" y="57" font-size="12" fill="#6b7280">단위 Bq/L · 막대는 로그 눈금(눈금 한 칸마다 10배) · 이름이 같은 '기준'이라도 지키는 대상이 다름</text>

  <!-- 열 제목과 범례 -->
  <text x="20" y="90" font-size="12.5" font-weight="700" fill="#6b7280">구분</text>
  <rect x="260" y="79" width="14" height="14" rx="3" fill="#f5a623"/>
  <text x="280" y="90" font-size="12" fill="#1f2937">한울 측정값</text>
  <rect x="370" y="79" width="14" height="14" rx="3" fill="#0b6e4f"/>
  <text x="390" y="90" font-size="12" fill="#1f2937">기준·지침값</text>

  <!-- 눈금선 (10 = x260, 10배당 100px) -->
  <g stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 4">
    <line x1="360" y1="104" x2="360" y2="384"/>
    <line x1="460" y1="104" x2="460" y2="384"/>
    <line x1="560" y1="104" x2="560" y2="384"/>
    <line x1="660" y1="104" x2="660" y2="384"/>
  </g>
  <line x1="260" y1="104" x2="260" y2="390" stroke="#9ca3af" stroke-width="1"/>

  <!-- 행 1: 100 -->
  <text x="20" y="121" font-size="13" font-weight="700" fill="#1f2937">해양방사능 감시 구분값</text>
  <text x="20" y="138" font-size="11" fill="#6b7280">국외 영향 조기 파악용 감시값</text>
  <rect x="260" y="113" width="100" height="22" rx="3" fill="#0b6e4f"/>
  <text x="368" y="129" font-size="13" font-weight="700" fill="#1f2937">100</text>

  <!-- 행 2: 117 -->
  <text x="20" y="169" font-size="13" font-weight="700" fill="#1f2937">취수구 해수(측정)</text>
  <text x="20" y="186" font-size="11" fill="#6b7280">11월 16일 한수원 보고</text>
  <rect x="260" y="161" width="107" height="22" rx="3" fill="#f5a623"/>
  <text x="375" y="177" font-size="13" font-weight="700" fill="#1f2937">117</text>

  <!-- 행 3: 1,500 -->
  <text x="20" y="217" font-size="13" font-weight="700" fill="#1f2937">후쿠시마 배출 목표</text>
  <text x="20" y="234" font-size="11" fill="#6b7280">희석 후 바다로 내보낼 때 상한</text>
  <rect x="260" y="209" width="218" height="22" rx="3" fill="#0b6e4f"/>
  <text x="486" y="225" font-size="13" font-weight="700" fill="#1f2937">1,500</text>

  <!-- 행 4: 10,000 -->
  <text x="20" y="265" font-size="13" font-weight="700" fill="#1f2937">WHO 먹는물 지침</text>
  <text x="20" y="282" font-size="11" fill="#6b7280">매일 2L씩 1년 마셔 연 0.1mSv 수준</text>
  <rect x="260" y="257" width="300" height="22" rx="3" fill="#0b6e4f"/>
  <text x="568" y="273" font-size="13" font-weight="700" fill="#1f2937">10,000</text>

  <!-- 행 5: 30,000 -->
  <text x="20" y="313" font-size="13" font-weight="700" fill="#1f2937">부지 지하수 관측정(측정)</text>
  <text x="20" y="330" font-size="11" fill="#6b7280">감시용, 마시는 물 아님 · 11월 13일</text>
  <rect x="260" y="305" width="348" height="22" rx="3" fill="#f5a623"/>
  <text x="616" y="321" font-size="13" font-weight="700" fill="#1f2937">30,000</text>

  <!-- 행 6: 40,000 -->
  <text x="20" y="361" font-size="13" font-weight="700" fill="#1f2937">국내 배출관리기준</text>
  <text x="20" y="378" font-size="11" fill="#6b7280">원전 시설경계 배출수 농도(원안위 고시)</text>
  <rect x="260" y="353" width="360" height="22" rx="3" fill="#0b6e4f"/>
  <text x="628" y="369" font-size="13" font-weight="700" fill="#1f2937">40,000</text>

  <!-- 로그 눈금 -->
  <line x1="260" y1="390" x2="660" y2="390" stroke="#9ca3af" stroke-width="1"/>
  <g stroke="#9ca3af">
    <line x1="260" y1="386" x2="260" y2="394"/>
    <line x1="360" y1="386" x2="360" y2="394"/>
    <line x1="460" y1="386" x2="460" y2="394"/>
    <line x1="560" y1="386" x2="560" y2="394"/>
    <line x1="660" y1="386" x2="660" y2="394"/>
  </g>
  <text x="20" y="408" font-size="11" fill="#6b7280">농도(Bq/L, 로그 눈금)</text>
  <text x="260" y="408" font-size="11" fill="#6b7280" text-anchor="middle">10</text>
  <text x="360" y="408" font-size="11" fill="#6b7280" text-anchor="middle">100</text>
  <text x="460" y="408" font-size="11" fill="#6b7280" text-anchor="middle">1,000</text>
  <text x="560" y="408" font-size="11" fill="#6b7280" text-anchor="middle">1만</text>
  <text x="660" y="408" font-size="11" fill="#6b7280" text-anchor="middle">10만</text>

  <!-- 선량 가정 상자 -->
  <rect x="20" y="424" width="680" height="58" rx="10" fill="#e3f2ec"/>
  <text x="40" y="448" font-size="13.5" font-weight="700" fill="#0b6e4f">1L를 마셨다고 가정하면: 관측정 물 약 0.54μSv · 취수구 해수 약 0.002μSv</text>
  <text x="40" y="470" font-size="12" fill="#1f2937">관측정 지하수는 아무도 마시지 않음 · 바나나 1개 약 0.1μSv · 연간 자연방사선 약 3mSv</text>

  <!-- 출처 -->
  <text x="20" y="500" font-size="10.5" fill="#6b7280">자료: 원자력안전위원회(2026.11.16)·보도, 도쿄전력, WHO 먹는물 지침, ICRP 72(HTO 1.8×10⁻¹¹Sv/Bq)</text>
  <text x="20" y="514" font-size="10.5" fill="#6b7280">측정값은 11월 13·16일 한수원 보고 · 선량은 필자 계산(성인) · 2026년 11월 17일 기준 · 원인은 조사 중</text>
</svg>

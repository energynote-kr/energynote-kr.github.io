<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif">
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1e2430; }
    .label { font-size: 13.5px; fill: #1e2430; }
    .value { font-size: 13px; font-weight: 700; fill: #0b6e4f; }
    .note { font-size: 11.5px; fill: #5a6472; }
  </style>
  <text x="20" y="30" class="title">검사별 태아 방사선량 vs 기준값 (mGy)</text>
  <text x="20" y="50" class="note">막대 길이는 √값 비례 · 자료: ICRP 84, ACOG</text>

  <text x="20" y="97" class="label">흉부 엑스레이</text>
  <rect x="230" y="83" width="8" height="20" rx="3" fill="#0b6e4f"/>
  <text x="246" y="98" class="value">0.01 미만</text>

  <text x="20" y="142" class="label">복부 엑스레이</text>
  <rect x="230" y="128" width="64" height="20" rx="4" fill="#0b6e4f"/>
  <text x="302" y="143" class="value">약 1~3</text>

  <text x="20" y="187" class="label">복부·골반 CT</text>
  <rect x="230" y="173" width="225" height="20" rx="4" fill="#0b6e4f"/>
  <text x="463" y="188" class="value">약 10~25</text>

  <text x="20" y="232" class="label">영향 관찰 시작 수준</text>
  <rect x="230" y="218" width="450" height="20" rx="4" fill="#c0392b"/>
  <text x="565" y="213" class="value" fill="#c0392b">100 이상</text>

  <line x1="230" y1="75" x2="230" y2="250" stroke="#e6e4de" stroke-width="1"/>

  <rect x="20" y="268" width="680" height="52" fill="#e3f2ec" rx="10"/>
  <text x="40" y="290" class="label" font-weight="700">읽는 법</text>
  <text x="40" y="310" class="note" font-size="13">태아에 가장 가까운 복부·골반 CT조차 1회로는 기준값(100mGy)에 한참 못 미칩니다.</text>
</svg>

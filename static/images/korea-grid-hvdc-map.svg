<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="t d" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">한국 전력망 지도(2026년 9월 기준): 왼쪽에 발전 집중지 세 곳, 오른쪽에 수도권 수요와 데이터센터 대기열, 그 사이에 HVDC 회랑별 용량과 일정, 아래에 병목 수치 네 가지</title>
  <desc id="d">흐름도: 왼쪽에 발전 집중지 세 곳(동해안 원전·석탄, 서해안, 호남 태양광·제주 풍력), 오른쪽에 수도권 수요, 그 사이에 HVDC 회랑의 용량과 상태, 아래에 승인률 1.9%, 대기 9.6GW, 변압기 납기 2~3년, 계통관리변전소 189곳.</desc>
  <defs>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b6e4f"/>
    </marker>
    <marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5a623"/>
    </marker>
    <marker id="ah-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="760" height="520" fill="#f8faf9"/>

  <!-- 제목 -->
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2937">한국 전력망: 전기는 해안에서 만들고, 수도권에서 쓰고, 그 사이에 HVDC</text>
  <text x="20" y="49" font-size="11.5" fill="#6b7280">지역별 자립률 = 발전량 ÷ 소비량, 2025년 1~7월(한전 자료). 선로 상태는 2026년 9월 기준.</text>

  <!-- 열 제목 -->
  <text x="20" y="76" font-size="11" font-weight="700" fill="#0b6e4f" letter-spacing="0.5">전기를 만드는 곳</text>
  <text x="740" y="76" font-size="11" font-weight="700" fill="#f5a623" letter-spacing="0.5" text-anchor="end">전기를 쓰는 곳</text>
  <text x="380" y="76" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="0.5" text-anchor="middle">HVDC 회랑</text>

  <!-- 발전 상자(왼쪽) -->
  <g id="box-east">
    <rect x="20" y="88" width="228" height="78" rx="8" fill="#0b6e4f"/>
    <text x="32" y="108" font-size="12.5" font-weight="700" style="fill:#fff">동해안: 원전 + 석탄</text>
    <text x="32" y="126" font-size="11" style="fill:#fff">한울 8.7GW, 월성, 고리·새울</text>
    <text x="32" y="142" font-size="11" style="fill:#fff">동해안 석탄</text>
    <text x="32" y="158" font-size="11" font-weight="700" style="fill:#fff">경북 자립률 263%</text>
  </g>
  <g id="box-west">
    <rect x="20" y="180" width="228" height="78" rx="8" fill="#0b6e4f"/>
    <text x="32" y="200" font-size="12.5" font-weight="700" style="fill:#fff">서해안: 한빛 + 석탄</text>
    <text x="32" y="218" font-size="11" style="fill:#fff">한빛 5.9GW(전남)</text>
    <text x="32" y="234" font-size="11" style="fill:#fff">충남 석탄·가스 발전단지</text>
    <text x="32" y="250" font-size="11" font-weight="700" style="fill:#fff">충남 자립률 181%</text>
  </g>
  <g id="box-south">
    <rect x="20" y="272" width="228" height="78" rx="8" fill="#0b6e4f"/>
    <text x="32" y="292" font-size="12.5" font-weight="700" style="fill:#fff">호남: 태양광 + 제주 풍력</text>
    <text x="32" y="310" font-size="11" style="fill:#fff">전국에서 가장 빽빽한 태양광</text>
    <text x="32" y="326" font-size="11" style="fill:#fff">육지 출력제어 2024년 4월부터</text>
    <text x="32" y="342" font-size="11" font-weight="700" style="fill:#fff">전남 자립률 208%</text>
  </g>

  <!-- 수요 상자(오른쪽) -->
  <g id="box-capital">
    <rect x="512" y="88" width="228" height="124" rx="8" fill="#f5a623"/>
    <text x="524" y="108" font-size="12.5" font-weight="700" style="fill:#fff">수도권</text>
    <text x="524" y="126" font-size="11" style="fill:#fff">서울·경기·인천</text>
    <text x="524" y="146" font-size="11" font-weight="700" style="fill:#fff">전국 전력 판매량의 약 40%</text>
    <text x="524" y="162" font-size="11" font-weight="700" style="fill:#fff">(2024년, 한전)</text>
    <text x="524" y="182" font-size="11" style="fill:#fff">서울 자립률 7.5%</text>
    <text x="524" y="198" font-size="11" style="fill:#fff">대전 3.3%(전국 최저)</text>
  </g>
  <g id="box-queue">
    <rect x="512" y="226" width="228" height="124" rx="8" fill="#fff" stroke="#f5a623" stroke-width="2"/>
    <text x="524" y="246" font-size="12.5" font-weight="700" fill="#b45309">데이터센터 대기열(수도권)</text>
    <text x="524" y="264" font-size="11" fill="#374151">신청 522건, 33.6GW</text>
    <text x="524" y="280" font-size="11" fill="#374151">(2026년 3월 누적)</text>
    <text x="524" y="300" font-size="11" font-weight="700" fill="#b45309">승인 10건 = 1.9%</text>
    <text x="524" y="320" font-size="11" fill="#374151">호남은 반도체 팹·AI 데이터센터에</text>
    <text x="524" y="336" font-size="11" fill="#374151">7.5GW 추가 필요(부처, 2026년 8월)</text>
  </g>

  <!-- 회랑 화살표 -->
  <!-- 동해안: 계획 -->
  <g id="cor-east">
    <line x1="252" y1="118" x2="506" y2="118" stroke="#f5a623" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ah-o)"/>
    <text x="380" y="100" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">동해안–수도권 HVDC, 4GW×2</text>
    <text x="380" y="134" font-size="10" fill="#6b7280" text-anchor="middle">1단계 2027년 12월 · 2단계 빨라야 2029년</text>
    <text x="380" y="147" font-size="10" fill="#6b7280" text-anchor="middle">동서울변환소: 인허가 대기</text>
  </g>

  <!-- 북당진–고덕: 운영 중 -->
  <g id="cor-west">
    <line x1="252" y1="213" x2="506" y2="213" stroke="#0b6e4f" stroke-width="3" marker-end="url(#ah-g)"/>
    <text x="380" y="196" font-size="10.5" font-weight="700" fill="#0b6e4f" text-anchor="middle">북당진–고덕 HVDC, 3GW</text>
    <text x="380" y="229" font-size="10" fill="#6b7280" text-anchor="middle">운영 중: 1.5GW 2020년 + 1.5GW 2024년</text>
  </g>

  <!-- 서해안: 계획 -->
  <g id="cor-south">
    <line x1="252" y1="300" x2="506" y2="300" stroke="#f5a623" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ah-o)"/>
    <text x="380" y="283" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">서해안 에너지고속도로, 2GW×4</text>
    <text x="380" y="316" font-size="10" fill="#6b7280" text-anchor="middle">해저 525kV · 1단계 2030년 · 후속 노선 재검토 중</text>
  </g>

  <!-- 제주 연계선: 운영 중, 소형 -->
  <g id="cor-jeju">
    <line x1="252" y1="340" x2="300" y2="340" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-gr)" marker-start="url(#ah-gr)"/>
    <text x="306" y="344" font-size="10" font-weight="700" fill="#6b7280">제주 연계선 0.9GW</text>
    <text x="254" y="358" font-size="10" fill="#6b7280">1998·2014·2024년 · 3연계는 양방향(전압형)</text>
  </g>

  <!-- 범례 -->
  <line x1="20" y1="372" x2="48" y2="372" stroke="#0b6e4f" stroke-width="3"/>
  <text x="54" y="376" font-size="10" fill="#374151">운영 중</text>
  <line x1="120" y1="372" x2="148" y2="372" stroke="#f5a623" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="154" y="376" font-size="10" fill="#374151">건설 중 또는 계획</text>

  <!-- 병목 상자 -->
  <rect id="callout" x="20" y="388" width="720" height="96" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="34" y="408" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="0.5">선로가 늦는 이유</text>

  <g id="stat1">
    <text x="34" y="440" font-size="22" font-weight="700" fill="#b45309">1.9%</text>
    <text x="34" y="458" font-size="10" fill="#374151">수도권 데이터센터</text>
    <text x="34" y="471" font-size="10" fill="#374151">전력 신청 승인률</text>
  </g>
  <g id="stat2">
    <text x="200" y="440" font-size="22" font-weight="700" fill="#b45309">9.6GW</text>
    <text x="200" y="458" font-size="10" fill="#374151">데이터센터 신청 대기</text>
    <text x="200" y="471" font-size="10" fill="#374151">전국 합계(2026년 3월)</text>
  </g>
  <g id="stat3">
    <text x="380" y="440" font-size="22" font-weight="700" fill="#b45309">2~3년</text>
    <text x="380" y="458" font-size="10" fill="#374151">전력용 변압기 납기</text>
    <text x="380" y="471" font-size="10" fill="#374151">(우드맥킨지, 2025~26년)</text>
  </g>
  <g id="stat4">
    <text x="560" y="440" font-size="22" font-weight="700" fill="#b45309">189곳</text>
    <text x="560" y="458" font-size="10" fill="#374151">신규 재생에너지 접속이</text>
    <text x="560" y="471" font-size="10" fill="#374151">닫힌 계통관리변전소</text>
  </g>

  <!-- 하단 -->
  <text x="20" y="506" font-size="10" fill="#6b7280">2026년 9월 기준 · 출처: 한전, 기후에너지환경부, 전력거래소, CBRE코리아, 우드맥킨지</text>
  <text x="740" y="506" font-size="10" fill="#6b7280" text-anchor="end">energynote.kr</text>
</svg>

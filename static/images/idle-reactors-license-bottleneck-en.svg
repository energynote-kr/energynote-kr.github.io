  <circle cx="131" cy="421.5" r="5.5" fill="#0b6e4f"/>
  <text x="142" y="426" class="lg">Approved Oct. 27</text>
  <path d="M260 419 V424 H282 V419" fill="none" stroke="#0b6e4f" stroke-width="2"/>
  <text x="288" y="426" class="lg">Restart or decision target</text>

  <text x="20" y="448" class="src">Sources: NSSC decisions as reported by Kyunghyang Shinmun and Financial News (Oct. 27, 2026) and Kyunghyang (Oct. 15, 2026);</text>
  <text x="20" y="461" class="src">Jaekyung Ilbo (Oct. 27, 2026); Maeil Shinmun (Oct. 21, 2026) · Hanbit 1 expired in Dec. 2025 (exact day omitted)</text>
  <text x="20" y="474" class="src">Wolsong 2 filing status as of an Oct. 21 report · Data as of Oct. 29, 2026</text>

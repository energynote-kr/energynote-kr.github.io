  <text x="436" y="339" class="i1">License ends Nov. 1 · not yet filed</text>
  <text x="436" y="356" class="i2">KHNP review target H2 2027</text>

  <!-- data-as-of line -->
  <line x1="312.8" y1="96" x2="312.8" y2="372" stroke="#dc2626" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="312.8" y="385" class="dt" text-anchor="middle" style="fill:#dc2626">As of Oct. 29</text>

  <!-- legend -->
  <rect x="20" y="396" width="22" height="10" rx="2" fill="#bfe3d3"/>
  <text x="48" y="405" class="lg">Licensed period</text>
  <rect x="146" y="396" width="22" height="10" rx="2" fill="#f5a623"/>
  <text x="174" y="405" class="lg">Off line after expiry</text>
  <rect x="300" y="396" width="22" height="10" rx="2" fill="none" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="4 3"/>

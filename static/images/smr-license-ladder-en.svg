<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="t" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Ladder of six licensing stages, from design review to operating, with the world's main SMR projects placed on their current rung and colored by country</title>
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1f2937; }
    .sub { font-size: 11px; fill: #6b7280; }
    .stage { font-size: 13px; font-weight: 800; fill: #1f2937; }
    .stage2 { font-size: 10.5px; fill: #6b7280; }
    .chip { font-size: 11.5px; font-weight: 700; }
    .leg { font-size: 11px; fill: #1f2937; }
    .note { font-size: 11px; fill: #1f2937; }
  </style>
  <rect x="0" y="0" width="720" height="600" fill="#f8faf9"/>
  <text x="20" y="30" class="title">The SMR licensing ladder — September 2026: who is on which rung</text>
  <text x="20" y="48" class="sub">Higher = closer to selling power · a 'reactor on paper' until design approval; concrete starts with the CP</text>

  <!-- Legend -->
  <g class="leg">
    <rect x="20" y="60" width="12" height="12" rx="3" fill="#0b6e4f"/><text x="36" y="70">US</text>
    <rect x="66" y="60" width="12" height="12" rx="3" fill="#2563eb"/><text x="82" y="70">Canada · UK</text>
    <rect x="160" y="60" width="12" height="12" rx="3" fill="#6b7280"/><text x="176" y="70">China · Russia</text>
    <rect x="266" y="60" width="12" height="12" rx="3" fill="#f5a623"/><text x="282" y="70">Korea</text>
    <rect x="330" y="60" width="12" height="12" rx="3" fill="#c4c9d1"/><text x="346" y="70">Other</text>
  </g>

  <!-- Ladder rail -->
  <line x1="196" y1="86" x2="196" y2="522" stroke="#0b6e4f" stroke-width="3" opacity="0.35"/>

  <!-- Rung 6: Operating (y 86-138) -->
  <rect x="12" y="86" width="696" height="52" rx="8" fill="#e3f2ec"/>
  <text x="24" y="108" class="stage">⑥ Operating</text>
  <text x="24" y="124" class="stage2">Operating license · selling power</text>
  <rect x="210" y="98" width="252" height="28" rx="14" fill="#6b7280"/>
  <text x="336" y="117" class="chip" text-anchor="middle" style="fill:#fff">Akademik Lomonosov KLT-40S (RU, 2020)</text>
  <rect x="470" y="98" width="190" height="28" rx="14" fill="#6b7280"/>
  <text x="565" y="117" class="chip" text-anchor="middle" style="fill:#fff">HTR-PM Shidaowan (CN, 2023)</text>

  <!-- Rung 5: Commissioning / late construction (y 146-198) -->
  <rect x="12" y="146" width="696" height="52" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="24" y="168" class="stage">⑤ Commissioning</text>
  <text x="24" y="184" class="stage2">Tests before fuel load</text>
  <rect x="210" y="158" width="270" height="28" rx="14" fill="#6b7280"/>
  <text x="345" y="177" class="chip" text-anchor="middle" style="fill:#fff">Linglong One ACP100 (CN, pre-startup tests)</text>
  <rect x="488" y="158" width="196" height="28" rx="14" fill="#c4c9d1"/>
  <text x="586" y="177" class="chip" text-anchor="middle" fill="#1f2937">CAREM-25 (AR, halted at 85%)</text>

  <!-- Rung 4: Under construction (y 206-294, two lines) -->
  <rect x="12" y="206" width="696" height="88" rx="8" fill="#e3f2ec"/>
  <text x="24" y="240" class="stage">④ Under construction</text>
  <text x="24" y="256" class="stage2">CP granted · concrete poured</text>
  <rect x="210" y="216" width="160" height="28" rx="14" fill="#0b6e4f"/>
  <text x="290" y="235" class="chip" text-anchor="middle" style="fill:#fff">Natrium Kemmerer (US)</text>
  <rect x="378" y="216" width="176" height="28" rx="14" fill="#2563eb"/>
  <text x="466" y="235" class="chip" text-anchor="middle" style="fill:#fff">BWRX-300 Darlington (CA)</text>
  <rect x="562" y="216" width="120" height="28" rx="14" fill="#0b6e4f"/>
  <text x="622" y="235" class="chip" text-anchor="middle" style="fill:#fff">Hermes 1·2 (US)</text>
  <rect x="210" y="254" width="164" height="28" rx="14" fill="#0b6e4f"/>
  <text x="292" y="273" class="chip" text-anchor="middle" style="fill:#fff">Oklo Aurora (US, DOE)</text>
  <rect x="382" y="254" width="164" height="28" rx="14" fill="#0b6e4f"/>
  <text x="464" y="273" class="chip" text-anchor="middle" style="fill:#fff">Natura MSR-1 (US, CP)</text>
  <rect x="554" y="254" width="148" height="28" rx="14" fill="#6b7280"/>
  <text x="628" y="273" class="chip" text-anchor="middle" style="fill:#fff">Yakutia (RU, site prep)</text>

  <!-- Rung 3: CP under review (y 302-354) -->
  <rect x="12" y="302" width="696" height="52" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="24" y="324" class="stage">③ CP under review</text>
  <text x="24" y="340" class="stage2">Site fixed · application docketed</text>
  <rect x="210" y="314" width="156" height="28" rx="14" fill="#0b6e4f"/>
  <text x="288" y="333" class="chip" text-anchor="middle" style="fill:#fff">TVA Clinch River (US)</text>
  <rect x="374" y="314" width="164" height="28" rx="14" fill="#0b6e4f"/>
  <text x="456" y="333" class="chip" text-anchor="middle" style="fill:#fff">X-energy Long Mott (US)</text>
  <rect x="546" y="314" width="156" height="28" rx="14" fill="#0b6e4f"/>
  <text x="624" y="333" class="chip" text-anchor="middle" style="fill:#fff">Holtec Palisades (US)</text>

  <!-- Rung 2: Design approved (y 362-414) -->
  <rect x="12" y="362" width="696" height="52" rx="8" fill="#e3f2ec"/>
  <text x="24" y="384" class="stage">② Design approved</text>
  <text x="24" y="400" class="stage2">SDA · DC — site license is separate</text>
  <rect x="210" y="374" width="224" height="28" rx="14" fill="#0b6e4f"/>
  <text x="322" y="393" class="chip" text-anchor="middle" style="fill:#fff">NuScale US460 (US, SDA May 2025)</text>
  <rect x="442" y="374" width="196" height="28" rx="14" fill="#f5a623"/>
  <text x="540" y="393" class="chip" text-anchor="middle" fill="#1f2937">SMART100 (KR, SDA Sep 2024)</text>

  <!-- Rung 1: Design review / pre-application (y 422-510, two lines) -->
  <rect x="12" y="422" width="696" height="88" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="24" y="456" class="stage">① Design review</text>
  <text x="24" y="472" class="stage2">Pre-application · 'reactor on paper'</text>
  <rect x="210" y="432" width="210" height="28" rx="14" fill="#f5a623"/>
  <text x="315" y="451" class="chip" text-anchor="middle" fill="#1f2937">i-SMR (KR, SDA filed Feb 2026)</text>
  <rect x="428" y="432" width="222" height="28" rx="14" fill="#2563eb"/>
  <text x="539" y="451" class="chip" text-anchor="middle" style="fill:#fff">Rolls-Royce SMR (UK, GDA step 3)</text>
  <rect x="210" y="470" width="190" height="28" rx="14" fill="#0b6e4f"/>
  <text x="305" y="489" class="chip" text-anchor="middle" style="fill:#fff">AP300 (US, pre-application)</text>

  <!-- How to read -->
  <rect x="12" y="520" width="696" height="48" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="24" y="536" class="note" font-weight="700">How to read</text>
  <text x="104" y="536" class="note">Operating: China · Russia. Western permits and concrete: US · Canada (④). Korea sits at ①.</text>
  <text x="24" y="550" class="note">Oklo is placed at ④ via the DOE pilot pathway, not an NRC license.</text>
  <text x="24" y="563" class="sub">The four DOE pilot microreactors that went critical by July 2026 are test units without power-plant licenses, so they are left off the ladder.</text>

  <text x="20" y="582" class="sub">Sources: US NRC · DOE, CNSC, ONR, World Nuclear News (Aug 3, 2026), NSSC · KINS (Aug 2026) · as of early September 2026</text>
  <text x="20" y="595" class="sub">Developer timelines may change · SDA = standard design approval (US) / authorization (KR) · CP = construction permit</text>
</svg>

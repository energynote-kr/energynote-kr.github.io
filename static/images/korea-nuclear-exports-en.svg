<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="t" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Korea's nuclear export projects placed on a five-stage track from talks to operation, as of September 2026: Barakah at operation, Dukovany at contract, Saudi Arabia at tender, Vietnam, Turkey and the Philippines at talks, and five projects marked as exited or lost</title>
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1f2937; }
    .sub { font-size: 11px; fill: #6b7280; }
    .col { font-size: 11px; font-weight: 700; fill: #1f2937; }
    .row { font-size: 12px; font-weight: 700; fill: #1f2937; }
    .row2 { font-size: 9.5px; fill: #6b7280; }
    .chip { font-size: 10px; font-weight: 700; }
    .leg { font-size: 11px; fill: #1f2937; }
    .note { font-size: 11px; fill: #1f2937; }
  </style>
  <rect x="0" y="0" width="760" height="560" fill="#f8faf9"/>
  <text x="20" y="30" class="title">Korea's nuclear exports by stage — September 2026</text>
  <text x="20" y="48" class="sub">Each project sits on the last stage it has actually reached · a memorandum is 'talks', a signed EPC contract is 'contract'</text>

  <!-- Legend -->
  <g class="leg">
    <rect x="20" y="60" width="12" height="12" rx="3" fill="#0b6e4f"/><text x="36" y="70">Reached</text>
    <rect x="98" y="60" width="12" height="12" rx="3" fill="#f5a623"/><text x="114" y="70">Current stage</text>
    <rect x="204" y="60" width="12" height="12" rx="3" fill="#6b7280"/><text x="220" y="70">Exited or lost</text>
    <rect x="310" y="60" width="12" height="12" rx="3" fill="#ffffff" stroke="#c4c9d1"/><text x="326" y="70">Not reached</text>
  </g>

  <!-- Column headers: label column x 12-250; five stage columns of 96 from x=256; centers 304, 400, 496, 592, 688; cells 84 wide -->
  <g class="col" text-anchor="middle">
    <text x="304" y="96">① Talks</text>
    <text x="400" y="96">② Tender</text>
    <text x="496" y="96">③ Contract</text>
    <text x="592" y="96">④ Construction</text>
    <text x="688" y="96">⑤ Operation</text>
  </g>
  <line x1="256" y1="102" x2="736" y2="102" stroke="#c4c9d1" stroke-width="1"/>

  <!-- Row 1: Barakah -->
  <rect x="12" y="108" width="724" height="34" rx="6" fill="#e3f2ec"/>
  <text x="20" y="123" class="row">UAE · Barakah 1–4</text>
  <text x="20" y="136" class="row2">4 × APR1400 · KEPCO prime · operating 2021–24</text>
  <rect x="262" y="114" width="84" height="22" rx="11" fill="#0b6e4f"/>
  <rect x="358" y="114" width="84" height="22" rx="11" fill="#0b6e4f"/>
  <rect x="454" y="114" width="84" height="22" rx="11" fill="#0b6e4f"/>
  <rect x="550" y="114" width="84" height="22" rx="11" fill="#0b6e4f"/>
  <rect x="646" y="114" width="84" height="22" rx="11" fill="#f5a623"/>
  <text x="688" y="129" class="chip" text-anchor="middle" fill="#1f2937">All 4 units</text>

  <!-- Row 2: Dukovany -->
  <rect x="12" y="146" width="724" height="34" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="20" y="161" class="row">Czechia · Dukovany 5–6</text>
  <text x="20" y="174" class="row2">2 × APR1000 · KHNP prime · EU subsidy review closed</text>
  <rect x="262" y="152" width="84" height="22" rx="11" fill="#0b6e4f"/>
  <rect x="358" y="152" width="84" height="22" rx="11" fill="#0b6e4f"/>
  <rect x="454" y="152" width="84" height="22" rx="11" fill="#f5a623"/>
  <text x="496" y="167" class="chip" text-anchor="middle" fill="#1f2937">Signed Jun 2025</text>
  <rect x="550" y="152" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>
  <text x="592" y="167" class="chip" text-anchor="middle" fill="#6b7280">target 2029</text>
  <rect x="646" y="152" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>
  <text x="688" y="167" class="chip" text-anchor="middle" fill="#6b7280">target 2036</text>

  <!-- Row 3: Temelín option -->
  <rect x="12" y="184" width="724" height="34" rx="6" fill="#e3f2ec"/>
  <text x="20" y="199" class="row">Czechia · Temelín option</text>
  <text x="20" y="212" class="row2">2 × APR1000 option · not exercised</text>
  <rect x="262" y="190" width="84" height="22" rx="11" fill="#f5a623"/>
  <text x="304" y="205" class="chip" text-anchor="middle" fill="#1f2937">Option open</text>
  <rect x="358" y="190" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>
  <rect x="454" y="190" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>
  <rect x="550" y="190" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>
  <rect x="646" y="190" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>

  <!-- Row 4: Saudi Duwaiheen -->
  <rect x="12" y="222" width="724" height="34" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="20" y="237" class="row">Saudi Arabia · Duwaiheen</text>
  <text x="20" y="250" class="row2">2 × ~1.4 GW · KEPCO among 4 bidders · no award</text>
  <rect x="262" y="228" width="84" height="22" rx="11" fill="#0b6e4f"/>
  <rect x="358" y="228" width="84" height="22" rx="11" fill="#f5a623"/>
  <text x="400" y="243" class="chip" text-anchor="middle" fill="#1f2937">Open, no award</text>
  <rect x="454" y="228" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>
  <rect x="550" y="228" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>
  <rect x="646" y="228" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>

  <!-- Row 5: Vietnam -->
  <rect x="12" y="260" width="724" height="34" rx="6" fill="#e3f2ec"/>
  <text x="20" y="275" class="row">Vietnam · Ninh Thuan 2</text>
  <text x="20" y="288" class="row2">KEPCO–PetroVietnam MOUs · partner pick Q3 2026</text>
  <rect x="262" y="266" width="84" height="22" rx="11" fill="#f5a623"/>
  <text x="304" y="281" class="chip" text-anchor="middle" fill="#1f2937">MOU 2025–26</text>
  <rect x="358" y="266" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>
  <rect x="454" y="266" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>
  <rect x="550" y="266" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>
  <rect x="646" y="266" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>

  <!-- Row 6: Turkey -->
  <rect x="12" y="298" width="724" height="34" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="20" y="313" class="row">Turkey · Sinop</text>
  <text x="20" y="326" class="row2">4 × APR1400 proposed 2023 · KEPCO–TUNAS MOU</text>
  <rect x="262" y="304" width="84" height="22" rx="11" fill="#f5a623"/>
  <text x="304" y="319" class="chip" text-anchor="middle" fill="#1f2937">MOU Nov 2025</text>
  <rect x="358" y="304" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>
  <rect x="454" y="304" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>
  <rect x="550" y="304" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>
  <rect x="646" y="304" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>

  <!-- Row 7: Philippines -->
  <rect x="12" y="336" width="724" height="34" rx="6" fill="#e3f2ec"/>
  <text x="20" y="351" class="row">Philippines</text>
  <text x="20" y="364" class="row2">Meralco–KHNP–KEXIM MOU · no reactor fixed</text>
  <rect x="262" y="342" width="84" height="22" rx="11" fill="#f5a623"/>
  <text x="304" y="357" class="chip" text-anchor="middle" fill="#1f2937">MOU Mar 2026</text>
  <rect x="358" y="342" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>
  <rect x="454" y="342" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>
  <rect x="550" y="342" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>
  <rect x="646" y="342" width="84" height="22" rx="11" fill="#ffffff" stroke="#c4c9d1"/>

  <!-- Divider -->
  <line x1="12" y1="380" x2="736" y2="380" stroke="#c4c9d1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="20" y="396" class="col">Exited or lost (late 2024 – 2025)</text>

  <!-- Exited rows -->
  <g class="chip">
    <rect x="20" y="404" width="230" height="22" rx="11" fill="#6b7280"/>
    <text x="135" y="419" text-anchor="middle" style="fill:#fff">Poland · Pątnów — KHNP withdrew Aug 2025</text>
    <rect x="258" y="404" width="230" height="22" rx="11" fill="#6b7280"/>
    <text x="373" y="419" text-anchor="middle" style="fill:#fff">Kazakhstan — Rosatom chosen Jun 2025</text>
    <rect x="496" y="404" width="240" height="22" rx="11" fill="#6b7280"/>
    <text x="616" y="419" text-anchor="middle" style="fill:#fff">Netherlands · Borssele — withdrew Mar 2025</text>
    <rect x="20" y="434" width="230" height="22" rx="11" fill="#6b7280"/>
    <text x="135" y="449" text-anchor="middle" style="fill:#fff">Slovenia · JEK2 — withdrew Jan 2025</text>
    <rect x="258" y="434" width="230" height="22" rx="11" fill="#6b7280"/>
    <text x="373" y="449" text-anchor="middle" style="fill:#fff">Sweden · Ringhals — withdrew end 2024</text>
  </g>

  <!-- How to read -->
  <rect x="12" y="468" width="724" height="58" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="24" y="485" class="note" font-weight="700">How to read</text>
  <text x="112" y="485" class="note">One delivered plant (Barakah), one signed contract (Dukovany). Everything else is a bid or a memorandum.</text>
  <text x="24" y="501" class="note">Reported Westinghouse settlement terms (unconfirmed) exclude North America, the UK, Japan and the EU except Czechia;</text>
  <text x="24" y="517" class="note">four European exits came Dec 2024–Aug 2025, around the Jan 2025 settlement; Kazakhstan was a lost tender. SMR MOUs not shown.</text>

  <text x="20" y="544" class="sub">As of September 2026; sources: ENEC, KHNP, Westinghouse, Czech ministry, EC, WNA · EPC = engineering, procurement and construction</text>
</svg>

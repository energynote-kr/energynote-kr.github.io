<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="t d" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">2026년 한국 사용후핵연료 저장 현황: 부지별 저장조 저장률과 특별법 절차 일정</title>
  <desc id="d">고리·한빛·한울·월성·새울·신월성 여섯 부지의 사용후핵연료 저장률을 포화 전망 연도와 함께 가로 막대로 보이고, 아래에 특별법 절차를 2025년 시행부터 2027년 공모, 조사와 주민투표, 2050년 중간저장·2060년 처분 목표까지 시간 띠로 나타낸 인포그래픽.</desc>
  <rect width="760" height="500" fill="#f8faf9"/>

  <!-- Title -->
  <text x="24" y="34" font-size="19" font-weight="700" fill="#111827">사용후핵연료, 저장조는 얼마나 찼나</text>
  <text x="24" y="54" font-size="12" fill="#6b7280">부지별 저장률, 2025년 말 기준(고리·한빛·한울은 2026년 3월) · 포화 전망 연도</text>

  <!-- Bar chart -->
  <g id="bars" font-size="12">
    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="150" y1="72" x2="150" y2="292"/>
      <line x1="270" y1="72" x2="270" y2="292"/>
      <line x1="390" y1="72" x2="390" y2="292"/>
      <line x1="510" y1="72" x2="510" y2="292"/>
      <line x1="630" y1="72" x2="630" y2="292"/>
    </g>
    <g fill="#9ca3af" font-size="10" text-anchor="middle">
      <text x="150" y="303">0%</text>
      <text x="270" y="303">25%</text>
      <text x="390" y="303">50%</text>
      <text x="510" y="303">75%</text>
      <text x="630" y="303">100%</text>
    </g>

    <!-- 고리 93.4% -> 448 -->
    <text x="140" y="94" text-anchor="end" font-weight="600" fill="#111827">고리</text>
    <rect x="150" y="80" width="448" height="22" rx="3" fill="#f5a623"/>
    <text x="590" y="95" text-anchor="end" font-weight="700" style="fill:#fff">93.4%</text>
    <text x="606" y="95" fill="#374151" font-weight="600">2032년</text>

    <!-- 한빛 85.3% -> 409 -->
    <text x="140" y="128" text-anchor="end" font-weight="600" fill="#111827">한빛</text>
    <rect x="150" y="114" width="409" height="22" rx="3" fill="#f5a623"/>
    <text x="551" y="129" text-anchor="end" font-weight="700" style="fill:#fff">85.3%</text>
    <text x="567" y="129" fill="#374151" font-weight="600">2030년</text>

    <!-- 한울 73.5% -> 353 -->
    <text x="140" y="162" text-anchor="end" font-weight="600" fill="#111827">한울</text>
    <rect x="150" y="148" width="353" height="22" rx="3" fill="#f5a623"/>
    <text x="495" y="163" text-anchor="end" font-weight="700" style="fill:#fff">73.5%</text>
    <text x="511" y="163" fill="#374151" font-weight="600">2031년</text>

    <!-- 월성 84.1% -> 404 -->
    <text x="140" y="196" text-anchor="end" font-weight="600" fill="#111827">월성</text>
    <rect x="150" y="182" width="404" height="22" rx="3" fill="#0b6e4f"/>
    <text x="546" y="197" text-anchor="end" font-weight="700" style="fill:#fff">84.1%</text>
    <text x="562" y="197" fill="#374151" font-weight="600">2034년(저장조)</text>

    <!-- 새울 57.4% -> 276 -->
    <text x="140" y="230" text-anchor="end" font-weight="600" fill="#111827">새울</text>
    <rect x="150" y="216" width="276" height="22" rx="3" fill="#6b7280"/>
    <text x="418" y="231" text-anchor="end" font-weight="700" style="fill:#fff">57.4%</text>
    <text x="434" y="231" fill="#374151" font-weight="600">당분간 여유</text>

    <!-- 신월성 38.6% -> 185 -->
    <text x="140" y="264" text-anchor="end" font-weight="600" fill="#111827">신월성</text>
    <rect x="150" y="250" width="185" height="22" rx="3" fill="#6b7280"/>
    <text x="327" y="265" text-anchor="end" font-weight="700" style="fill:#fff">38.6%</text>
    <text x="343" y="265" fill="#374151" font-weight="600">2042년</text>
  </g>

  <!-- Legend -->
  <g font-size="10.5" fill="#4b5563">
    <rect x="24" y="316" width="10" height="10" rx="2" fill="#f5a623"/>
    <text x="39" y="325">6년 안에 포화</text>
    <rect x="182" y="316" width="10" height="10" rx="2" fill="#0b6e4f"/>
    <text x="197" y="325">건식저장 운영 중(월성)</text>
    <rect x="502" y="316" width="10" height="10" rx="2" fill="#6b7280"/>
    <text x="517" y="325">당분간 제약 없음</text>
  </g>

  <!-- Timeline strip -->
  <text x="24" y="360" font-size="13" font-weight="700" fill="#111827">특별법 절차: 법 시행에서 처분장까지</text>
  <g id="timeline">
    <line x1="60" y1="404" x2="700" y2="404" stroke="#6b7280" stroke-width="2"/>
    <g>
      <circle cx="60" cy="404" r="7" fill="#0b6e4f"/>
      <text x="60" y="386" font-size="11" font-weight="700" text-anchor="middle" fill="#111827">2025년</text>
      <text x="60" y="423" font-size="10" text-anchor="middle" fill="#374151">특별법 시행</text>
      <text x="60" y="437" font-size="10" text-anchor="middle" fill="#374151">9월 26일</text>
    </g>
    <g>
      <circle cx="170" cy="404" r="7" fill="#0b6e4f"/>
      <text x="170" y="386" font-size="11" font-weight="700" text-anchor="middle" fill="#111827">2026년</text>
      <text x="170" y="423" font-size="10" text-anchor="middle" fill="#374151">부적합 지역</text>
      <text x="170" y="437" font-size="10" text-anchor="middle" fill="#374151">배제</text>
    </g>
    <g>
      <circle cx="280" cy="404" r="7" fill="#f5a623"/>
      <text x="280" y="386" font-size="11" font-weight="700" text-anchor="middle" fill="#111827">2027년</text>
      <text x="280" y="423" font-size="10" text-anchor="middle" fill="#374151">지자체</text>
      <text x="280" y="437" font-size="10" text-anchor="middle" fill="#374151">공모</text>
    </g>
    <g>
      <circle cx="400" cy="404" r="7" fill="#6b7280"/>
      <text x="400" y="386" font-size="11" font-weight="700" text-anchor="middle" fill="#111827">2027년부터 9~13년</text>
      <text x="400" y="423" font-size="10" text-anchor="middle" fill="#374151">기본·심층조사,</text>
      <text x="400" y="437" font-size="10" text-anchor="middle" fill="#374151">주민투표</text>
    </g>
    <g>
      <circle cx="560" cy="404" r="7" fill="#0b6e4f"/>
      <text x="560" y="386" font-size="11" font-weight="700" text-anchor="middle" fill="#111827">2050년</text>
      <text x="560" y="423" font-size="10" text-anchor="middle" fill="#374151">중간저장시설</text>
      <text x="560" y="437" font-size="10" text-anchor="middle" fill="#374151">목표</text>
    </g>
    <g>
      <circle cx="700" cy="404" r="7" fill="#0b6e4f"/>
      <text x="700" y="386" font-size="11" font-weight="700" text-anchor="middle" fill="#111827">2060년</text>
      <text x="700" y="423" font-size="10" text-anchor="middle" fill="#374151">처분시설</text>
      <text x="700" y="437" font-size="10" text-anchor="middle" fill="#374151">목표</text>
    </g>
  </g>
  <text x="24" y="462" font-size="10.5" fill="#4b5563">조사 기간은 관리위원장 추정(기본조사 3~5년, 심층조사 3~4년, 결정 1년). 2050년·2060년은 법의 목표이지 기한이 아님.</text>

  <!-- Footer -->
  <line x1="24" y1="474" x2="736" y2="474" stroke="#e5e7eb"/>
  <text x="24" y="490" font-size="10" fill="#6b7280">2026년 9월 기준 · 출처: 한수원 집계·원안위 보고(언론 보도 인용), 관리위원장 인터뷰</text>
  <text x="736" y="490" font-size="10" fill="#6b7280" text-anchor="end">energynote.kr</text>
</svg>

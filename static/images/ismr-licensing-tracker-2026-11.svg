<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">2026년 11월 6일 기준 i-SMR 표준설계인가 진행 위치는 10월과 같은 본심사 단계이며, 아래 표는 공론화위, 협의체, 촉진위원회, 장관회의, 원안위 안건, 사전검토 제도, 규제 인력, 기장 부지가 한 달 사이 어떻게 달라졌는지 보여 준다</title>
  <style>
    .title { font-size: 18px; font-weight: 800; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .name { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .lab { font-size: 12px; fill: #374151; }
    .labg { font-size: 12px; fill: #6b7280; }
    .now { font-size: 13px; font-weight: 700; fill: #b45309; }
    .h2 { font-size: 15px; font-weight: 800; fill: #1f2937; }
    .cell { font-size: 12.5px; fill: #1f2937; }
    .cellb { font-size: 12.5px; font-weight: 700; fill: #1f2937; }
    .cellg { font-size: 12.5px; fill: #6b7280; }
    .src { font-size: 10.5px; fill: #6b7280; }
  </style>
  <rect x="0" y="0" width="720" height="500" fill="#f8faf9"/>
  <text x="24" y="30" class="title">i-SMR 표준설계인가 추적, 2026년 11월 6일 기준</text>
  <text x="24" y="49" class="sub">초록은 완료, 주황은 현재 단계, 빈 원은 예정. 미래 날짜는 목표입니다.</text>

  <!-- 트랙 -->
  <line x1="70" y1="118" x2="310" y2="118" stroke="#0b6e4f" stroke-width="5" stroke-linecap="round"/>
  <line x1="310" y1="118" x2="650" y2="118" stroke="#9ca3af" stroke-width="3" stroke-dasharray="7 5"/>
  <circle cx="70" cy="118" r="10" fill="#0b6e4f"/>
  <circle cx="190" cy="118" r="10" fill="#0b6e4f"/>
  <circle cx="310" cy="118" r="12" fill="#f5a623" stroke="#b45309" stroke-width="2"/>
  <circle cx="430" cy="118" r="10" fill="#f8faf9" stroke="#6b7280" stroke-width="2.5"/>
  <circle cx="550" cy="118" r="10" fill="#f8faf9" stroke="#6b7280" stroke-width="2.5"/>
  <circle cx="660" cy="118" r="10" fill="#f8faf9" stroke="#6b7280" stroke-width="2.5"/>

  <!-- 현재 위치 -->
  <rect x="160" y="60" width="300" height="26" rx="6" fill="#fff4e0" stroke="#b45309" stroke-width="1.5"/>
  <text x="310" y="78" class="now" text-anchor="middle">현재 위치: 2026년 11월 (10월과 같은 단계)</text>
  <path d="M310 86 L310 102" stroke="#b45309" stroke-width="1.5" fill="none"/>
  <path d="M304 98 L310 106 L316 98 Z" fill="#b45309"/>

  <!-- 단계 라벨 -->
  <g text-anchor="middle">
    <text x="70" y="150" class="name">신청</text>
    <text x="70" y="168" class="lab">2026.2.27</text>
    <text x="70" y="184" class="labg">원안위 접수</text>

    <text x="190" y="150" class="name">서류 적합성 검토</text>
    <text x="190" y="168" class="lab">8.27 보고</text>
    <text x="190" y="184" class="labg">보완 13건</text>

    <text x="310" y="150" class="name">본심사</text>
    <text x="310" y="168" class="lab">서류보완 2027.6</text>
    <text x="310" y="184" class="lab">시험결과 2028.6</text>

    <text x="430" y="150" class="name">인가 목표</text>
    <text x="430" y="168" class="lab">2028년</text>
    <text x="430" y="184" class="labg">여유 작음</text>

    <text x="550" y="150" class="name">건설허가</text>
    <text x="550" y="168" class="lab">신청 2029년경</text>
    <text x="550" y="184" class="labg">기장 부지 선정</text>

    <text x="660" y="150" class="name">첫 호기</text>
    <text x="660" y="168" class="lab">2035년</text>
    <text x="660" y="184" class="labg">목표</text>
  </g>

  <!-- 달라진 것 표 -->
  <text x="24" y="218" class="h2">한 달 전과 달라진 것</text>
  <circle cx="380" cy="213" r="5" fill="#f5a623"/>
  <text x="390" y="217" class="lab">달라졌거나 새로 확인</text>
  <circle cx="548" cy="213" r="5" fill="#6b7280"/>
  <text x="558" y="217" class="lab">변화 확인하지 못함</text>

  <rect x="24" y="226" width="672" height="22" fill="#0b6e4f"/>
  <text x="48" y="242" class="cellb" style="fill:#fff">항목</text>
  <text x="160" y="242" class="cellb" style="fill:#fff">10월호 내용(10.2)</text>
  <text x="336" y="242" class="cellb" style="fill:#fff">11월 6일 기준</text>

  <rect x="24" y="273" width="672" height="25" fill="#eef3f0"/>
  <rect x="24" y="323" width="672" height="25" fill="#eef3f0"/>
  <rect x="24" y="373" width="672" height="25" fill="#eef3f0"/>
  <rect x="24" y="423" width="672" height="25" fill="#eef3f0"/>

  <circle cx="35" cy="260" r="5" fill="#f5a623"/>
  <text x="48" y="265" class="cellb">공론화위</text>
  <text x="160" y="265" class="cellg">최대 11인 계획</text>
  <text x="336" y="265" class="cell">10.2 9인으로 출범, 12.11~13 시민 숙의</text>

  <circle cx="35" cy="285" r="5" fill="#6b7280"/>
  <text x="48" y="290" class="cellb">민관 협의체</text>
  <text x="160" y="290" class="cellg">10월 구성 계획</text>
  <text x="336" y="290" class="cell">출범·첫 회의 확인하지 못함</text>

  <circle cx="35" cy="310" r="5" fill="#6b7280"/>
  <text x="48" y="315" class="cellb">촉진위원회</text>
  <text x="160" y="315" class="cellg">연내 출범 계획</text>
  <text x="336" y="315" class="cell">출범 확인하지 못함, 기본계획은 2027년 예정</text>

  <circle cx="35" cy="335" r="5" fill="#f5a623"/>
  <text x="48" y="340" class="cellb">인천 장관회의</text>
  <text x="160" y="340" class="cellg">10.27~29 예정</text>
  <text x="336" y="340" class="cell">폐막, 인허가 단계 변화 없음</text>

  <circle cx="35" cy="360" r="5" fill="#6b7280"/>
  <text x="48" y="365" class="cellb">원안위 안건</text>
  <text x="160" y="365" class="cellg">SMR 안건 없음</text>
  <text x="336" y="365" class="cell">10.15·10.27 회의 보도에도 SMR 없음</text>

  <circle cx="35" cy="385" r="5" fill="#f5a623"/>
  <text x="48" y="390" class="cellb">사전검토 제도</text>
  <text x="160" y="390" class="cellg">10월호에 없던 항목</text>
  <text x="336" y="390" class="cell">11.20 시행 예정, 시행규칙 공포 대기</text>

  <circle cx="35" cy="410" r="5" fill="#f5a623"/>
  <text x="48" y="415" class="cellb">규제 인력</text>
  <text x="160" y="415" class="cellg">10월호에 없던 항목</text>
  <text x="336" y="415" class="cell">국감 보도: SMR 담당 과 7명, 33명 필요 답변</text>

  <circle cx="35" cy="435" r="5" fill="#6b7280"/>
  <text x="48" y="440" class="cellb">기장 부지</text>
  <text x="160" y="440" class="cellg">새 공고 없음</text>
  <text x="336" y="440" class="cell">새 공고 확인하지 못함</text>

  <text x="24" y="468" class="src">출처: 국민참여입법센터(원자력안전법 시행규칙안), 과기정통부(10.1), 기후부 공론화위 발표를 전한 이투데이(10.22, 11.1),</text>
  <text x="24" y="484" class="src">산경e뉴스(10.15), 한국일보(10.15, 10.27), 원안위 심사계획(8.27). '확인하지 못함'은 11월 6일까지 찾은 범위 기준입니다.</text>
</svg>

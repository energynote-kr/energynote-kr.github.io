<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">라돈 측정 방법 3종 비교와 한국환경공단 무료측정 신청 흐름</title>
  <rect x="0" y="0" width="720" height="500" fill="#f8faf9"/>

  <text x="20" y="32" font-size="18" font-weight="800" fill="#1f2937">라돈 측정, 어떤 방법을 고를까</text>
  <text x="20" y="52" font-size="12" fill="#6b7280">단기 실시간 측정기·장기 알파트랙·공인측정대행업체 비교 (2026년 9월 기준)</text>

  <!-- 열 헤더 -->
  <text x="35" y="78" font-size="11.5" font-weight="700" fill="#6b7280">방법</text>
  <text x="300" y="78" font-size="11.5" font-weight="700" fill="#6b7280">측정 기간</text>
  <text x="450" y="78" font-size="11.5" font-weight="700" fill="#6b7280">용도</text>

  <!-- Row 1: 실시간 측정기 -->
  <rect x="20" y="86" width="680" height="66" rx="10" fill="#e3f2ec"/>
  <text x="35" y="112" font-size="14.5" font-weight="800" fill="#0b6e4f">실시간 측정기</text>
  <text x="35" y="132" font-size="11.5" fill="#374151">반도체·이온챔버 방식</text>
  <rect x="300" y="102" width="92" height="26" rx="13" fill="#0b6e4f"/>
  <text x="346" y="119" font-size="12" text-anchor="middle" style="fill:#fff">1시간~2일</text>
  <text x="450" y="115" font-size="12.5" fill="#1f2937">즉석 확인, 환기 효과</text>
  <text x="450" y="134" font-size="12.5" fill="#1f2937">점검용 참고 수치</text>

  <!-- Row 2: 알파트랙 -->
  <rect x="20" y="160" width="680" height="66" rx="10" fill="#fdf1de"/>
  <text x="35" y="186" font-size="14.5" font-weight="800" fill="#b9760a">알파트랙(장기 수동검출기)</text>
  <text x="35" y="206" font-size="11.5" fill="#374151">우편 설치·회수, 실험실 분석</text>
  <rect x="300" y="176" width="92" height="26" rx="13" fill="#f5a623"/>
  <text x="346" y="193" font-size="12" text-anchor="middle" style="fill:#fff">90일 이상</text>
  <text x="450" y="189" font-size="12.5" fill="#1f2937">공식 1차 시험방법</text>
  <text x="450" y="208" font-size="12.5" fill="#1f2937">연평균, 공식 판단 기준</text>

  <!-- Row 3: 공인측정대행업체 -->
  <rect x="20" y="234" width="680" height="66" rx="10" fill="#eef0f2"/>
  <text x="35" y="260" font-size="14.5" font-weight="800" fill="#4b5563">공인측정대행업체</text>
  <text x="35" y="280" font-size="11.5" fill="#374151">환경분야 시험·검사법 등록업체</text>
  <rect x="300" y="250" width="92" height="26" rx="13" fill="#6b7280"/>
  <text x="346" y="267" font-size="12" text-anchor="middle" style="fill:#fff">업체별 상이</text>
  <text x="450" y="263" font-size="12.5" fill="#1f2937">다중이용시설·신축주택</text>
  <text x="450" y="282" font-size="12.5" fill="#1f2937">법정 의무 측정</text>

  <!-- 무료측정 신청 흐름 -->
  <text x="20" y="330" font-size="15" font-weight="800" fill="#1f2937">한국환경공단 주택 라돈 무료측정 흐름</text>

  <g font-size="11.3" fill="#1f2937" text-anchor="middle">
    <circle cx="70" cy="368" r="20" fill="#0b6e4f"/>
    <text x="70" y="373" style="fill:#fff" font-weight="700">1</text>
    <text x="70" y="404">신청</text>
    <text x="70" y="418" font-size="10.3" fill="#6b7280">(연중, 조기마감)</text>

    <circle cx="212" cy="368" r="20" fill="#0b6e4f"/>
    <text x="212" y="373" style="fill:#fff" font-weight="700">2</text>
    <text x="212" y="404">검출기 배송</text>
    <text x="212" y="418" font-size="10.3" fill="#6b7280">(겨울철)</text>

    <circle cx="354" cy="368" r="20" fill="#0b6e4f"/>
    <text x="354" y="373" style="fill:#fff" font-weight="700">3</text>
    <text x="354" y="404">자가 측정</text>
    <text x="354" y="418" font-size="10.3" fill="#6b7280">(90일 이상)</text>

    <circle cx="496" cy="368" r="20" fill="#0b6e4f"/>
    <text x="496" y="373" style="fill:#fff" font-weight="700">4</text>
    <text x="496" y="404">회수·분석</text>

    <circle cx="638" cy="368" r="20" fill="#0b6e4f"/>
    <text x="638" y="373" style="fill:#fff" font-weight="700">5</text>
    <text x="638" y="404">결과서 수령</text>
    <text x="638" y="418" font-size="10.3" fill="#6b7280">(이듬해 상반기)</text>
  </g>

  <g stroke="#9fcbb8" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="92" y1="368" x2="190" y2="368"/>
    <line x1="234" y1="368" x2="332" y2="368"/>
    <line x1="376" y1="368" x2="474" y2="368"/>
    <line x1="518" y1="368" x2="616" y2="368"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9fcbb8"/>
    </marker>
  </defs>

  <rect x="20" y="440" width="680" height="34" rx="8" fill="#fdf1de"/>
  <text x="360" y="461" font-size="12" text-anchor="middle" fill="#7a4a08">기준(148Bq/㎥) 초과 시 → 알람기 보급(연 400세대 한정) · 저감시공(연 100세대 한정, 공동주택 제외)</text>

  <text x="20" y="492" font-size="10.5" fill="#6b7280">자료: 한국환경공단 라돈 무료측정·저감컨설팅 안내(goodlight.or.kr/radon), 실내공기질 공정시험기준(환경부) · 2026년 9월 기준</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">Neutron numbers per generation in subcritical, critical and supercritical reactors, and the commissioning steps from fuel loading through first criticality to commercial operation</title>
  <rect x="0" y="0" width="720" height="510" fill="#f8faf9"/>

  <text x="20" y="32" font-size="18" font-weight="800" fill="#1f2937">Reactor criticality: how many neutrons each generation leaves</text>
  <text x="20" y="54" font-size="12" fill="#6b7280">One dot = a batch of neutrons · k values exaggerated for clarity; in operation k stays very near 1</text>

  <!-- Panel 1: subcritical -->
  <rect x="20" y="72" width="214" height="250" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <text x="36" y="98" font-size="15" font-weight="800" fill="#1f2937">Subcritical (k &lt; 1)</text>
  <text x="36" y="118" font-size="12" fill="#6b7280">Chain reaction dies away</text>
  <text x="36" y="152" font-size="12" fill="#1f2937">Gen 1</text>
  <text x="36" y="188" font-size="12" fill="#1f2937">Gen 2</text>
  <text x="36" y="224" font-size="12" fill="#1f2937">Gen 3</text>
  <text x="36" y="260" font-size="12" fill="#1f2937">Gen 4</text>
  <g fill="#6b7280">
    <circle cx="94" cy="148" r="5"/><circle cx="108" cy="148" r="5"/><circle cx="122" cy="148" r="5"/><circle cx="136" cy="148" r="5"/><circle cx="150" cy="148" r="5"/><circle cx="164" cy="148" r="5"/><circle cx="178" cy="148" r="5"/><circle cx="192" cy="148" r="5"/>
    <circle cx="94" cy="184" r="5"/><circle cx="108" cy="184" r="5"/><circle cx="122" cy="184" r="5"/><circle cx="136" cy="184" r="5"/>
    <circle cx="94" cy="220" r="5"/><circle cx="108" cy="220" r="5"/>
    <circle cx="94" cy="256" r="5"/>
  </g>
  <text x="36" y="300" font-size="12.5" font-weight="700" fill="#6b7280">Power falling / shut down</text>

  <!-- Panel 2: critical -->
  <rect x="253" y="72" width="214" height="250" rx="10" fill="#ffffff" stroke="#0b6e4f" stroke-width="2.5"/>
  <text x="269" y="98" font-size="15" font-weight="800" fill="#0b6e4f">Critical (k = 1)</text>
  <text x="269" y="118" font-size="11.5" fill="#6b7280">Chain reaction sustains itself</text>
  <text x="269" y="152" font-size="12" fill="#1f2937">Gen 1</text>
  <text x="269" y="188" font-size="12" fill="#1f2937">Gen 2</text>
  <text x="269" y="224" font-size="12" fill="#1f2937">Gen 3</text>
  <text x="269" y="260" font-size="12" fill="#1f2937">Gen 4</text>
  <g fill="#0b6e4f">
    <circle cx="327" cy="148" r="5"/><circle cx="341" cy="148" r="5"/><circle cx="355" cy="148" r="5"/><circle cx="369" cy="148" r="5"/>
    <circle cx="327" cy="184" r="5"/><circle cx="341" cy="184" r="5"/><circle cx="355" cy="184" r="5"/><circle cx="369" cy="184" r="5"/>
    <circle cx="327" cy="220" r="5"/><circle cx="341" cy="220" r="5"/><circle cx="355" cy="220" r="5"/><circle cx="369" cy="220" r="5"/>
    <circle cx="327" cy="256" r="5"/><circle cx="341" cy="256" r="5"/><circle cx="355" cy="256" r="5"/><circle cx="369" cy="256" r="5"/>
  </g>
  <text x="269" y="300" font-size="12.5" font-weight="700" fill="#0b6e4f">Steady power: normal run</text>

  <!-- Panel 3: supercritical -->
  <rect x="486" y="72" width="214" height="250" rx="10" fill="#ffffff" stroke="#f5a623" stroke-width="2"/>
  <text x="502" y="98" font-size="14" font-weight="800" fill="#1f2937">Supercritical (k &gt; 1)</text>
  <text x="502" y="118" font-size="12" fill="#6b7280">Chain reaction grows</text>
  <text x="502" y="152" font-size="12" fill="#1f2937">Gen 1</text>
  <text x="502" y="188" font-size="12" fill="#1f2937">Gen 2</text>
  <text x="502" y="224" font-size="12" fill="#1f2937">Gen 3</text>
  <text x="502" y="260" font-size="12" fill="#1f2937">Gen 4</text>
  <g fill="#f5a623">
    <circle cx="560" cy="148" r="5"/>
    <circle cx="560" cy="184" r="5"/><circle cx="574" cy="184" r="5"/>
    <circle cx="560" cy="220" r="5"/><circle cx="574" cy="220" r="5"/><circle cx="588" cy="220" r="5"/><circle cx="602" cy="220" r="5"/>
    <circle cx="560" cy="256" r="5"/><circle cx="574" cy="256" r="5"/><circle cx="588" cy="256" r="5"/><circle cx="602" cy="256" r="5"/><circle cx="616" cy="256" r="5"/><circle cx="630" cy="256" r="5"/><circle cx="644" cy="256" r="5"/><circle cx="658" cy="256" r="5"/>
  </g>
  <text x="502" y="300" font-size="12.5" font-weight="700" fill="#1f2937">Power rising, briefly</text>

  <!-- Commissioning steps -->
  <text x="20" y="352" font-size="14" font-weight="800" fill="#1f2937">How a new reactor starts up</text>
  <rect x="20" y="364" width="128" height="58" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="84" y="387" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937">Fuel loading</text>
  <text x="84" y="408" font-size="11" text-anchor="middle" fill="#6b7280">Core filled</text>
  <polygon points="150,388 156,393 150,398" fill="#6b7280"/>

  <rect x="158" y="364" width="128" height="58" rx="8" fill="#f5a623"/>
  <text x="222" y="387" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1f2937">First criticality</text>
  <text x="222" y="408" font-size="11" text-anchor="middle" fill="#1f2937">k = 1, first time</text>
  <polygon points="288,388 294,393 288,398" fill="#6b7280"/>

  <rect x="296" y="364" width="128" height="58" rx="8" fill="#ffffff" stroke="#0b6e4f"/>
  <text x="360" y="387" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937">Low-power tests</text>
  <text x="360" y="408" font-size="11" text-anchor="middle" fill="#6b7280">Check against design</text>
  <polygon points="426,388 432,393 426,398" fill="#6b7280"/>

  <rect x="434" y="364" width="128" height="58" rx="8" fill="#ffffff" stroke="#0b6e4f"/>
  <text x="498" y="387" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937">Power ascension</text>
  <text x="498" y="408" font-size="11" text-anchor="middle" fill="#6b7280">Raised in steps</text>
  <polygon points="564,388 570,393 564,398" fill="#6b7280"/>

  <rect x="572" y="364" width="128" height="58" rx="8" fill="#0b6e4f"/>
  <text x="636" y="387" font-size="12.5" font-weight="700" text-anchor="middle" style="fill:#fff">Commercial</text>
  <text x="636" y="408" font-size="11" text-anchor="middle" style="fill:#fff">operation begins</text>

  <!-- Delayed neutrons -->
  <rect x="20" y="436" width="680" height="34" rx="8" fill="#e3f2ec"/>
  <text x="34" y="458" font-size="12.5" fill="#1f2937">Why it is controllable: about 0.65% of U-235 fission neutrons arrive seconds to minutes late</text>

  <text x="20" y="488" font-size="10.5" fill="#6b7280">Sources: US NRC criticality safety glossary, World Nuclear Association, Korea NSSC and KHNP releases on Saeul 3</text>
  <text x="20" y="503" font-size="10.5" fill="#6b7280">Commissioning sequence simplified · as of October 31, 2026</text>
</svg>

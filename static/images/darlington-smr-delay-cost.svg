<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">다링턴 BWRX-300 1호기 일정 변화와 1호기·4호기 비용 추정 비교</title>
  <rect x="0" y="0" width="720" height="490" fill="#f8faf9"/>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#1f2937">다링턴 BWRX-300 1호기: 일정과 비용 추정</text>
  <text x="24" y="56" font-size="12" fill="#6b7280">2026년 11월 16일 기준 · 금액은 캐나다달러</text>

  <text x="24" y="90" font-size="14" font-weight="700" fill="#0b6e4f">① 일정: 2028 → 2030 → 미정</text>

  <!-- axis -->
  <line x1="60" y1="185" x2="690" y2="185" stroke="#6b7280" stroke-width="2"/>
  <line x1="412" y1="185" x2="690" y2="185" stroke="#f5a623" stroke-width="5" stroke-dasharray="8 5"/>
  <g font-size="11" fill="#6b7280" text-anchor="middle">
    <line x1="120" y1="181" x2="120" y2="189" stroke="#6b7280"/><text x="120" y="202">2022</text>
    <line x1="240" y1="181" x2="240" y2="189" stroke="#6b7280"/><text x="240" y="202">2024</text>
    <line x1="360" y1="181" x2="360" y2="189" stroke="#6b7280"/><text x="360" y="202">2026</text>
    <line x1="480" y1="181" x2="480" y2="189" stroke="#6b7280"/><text x="480" y="202">2028</text>
    <line x1="600" y1="181" x2="600" y2="189" stroke="#6b7280"/><text x="600" y="202">2030</text>
  </g>

  <!-- A: 2021.12 -->
  <line x1="115" y1="158" x2="115" y2="185" stroke="#0b6e4f"/>
  <circle cx="115" cy="185" r="6" fill="#0b6e4f"/>
  <g text-anchor="middle" font-size="12" fill="#1f2937">
    <text x="115" y="118" font-weight="700">2021.12</text>
    <text x="115" y="134">노형 선정</text>
    <text x="115" y="150">빠르면 2028 완공</text>
  </g>

  <!-- B: 2022 autumn -->
  <line x1="165" y1="185" x2="165" y2="213" stroke="#0b6e4f"/>
  <circle cx="165" cy="185" r="6" fill="#0b6e4f"/>
  <g text-anchor="middle" font-size="12" fill="#1f2937">
    <text x="165" y="226" font-weight="700">2022 가을</text>
    <text x="165" y="242">부지 준비</text>
  </g>

  <!-- C: 2025.4~5 -->
  <line x1="318" y1="158" x2="318" y2="185" stroke="#0b6e4f"/>
  <circle cx="318" cy="185" r="6" fill="#0b6e4f"/>
  <g text-anchor="middle" font-size="12" fill="#1f2937">
    <text x="318" y="118" font-weight="700">2025.4~5</text>
    <text x="318" y="134">건설허가·</text>
    <text x="318" y="150">1호기 투자결정</text>
  </g>

  <!-- D: 2026.3~4 -->
  <line x1="375" y1="185" x2="375" y2="213" stroke="#0b6e4f"/>
  <circle cx="375" cy="185" r="6" fill="#0b6e4f"/>
  <g text-anchor="middle" font-size="12" fill="#1f2937">
    <text x="375" y="226" font-weight="700">2026.3~4</text>
    <text x="375" y="242">운영허가 신청·</text>
    <text x="375" y="258">기초 설치</text>
  </g>

  <!-- E: 2026.11.10 -->
  <line x1="412" y1="142" x2="412" y2="185" stroke="#f5a623"/>
  <circle cx="412" cy="185" r="7" fill="#f5a623"/>
  <g text-anchor="middle" font-size="12" fill="#1f2937">
    <text x="412" y="118" font-weight="700" fill="#b7791f">2026.11.10</text>
    <text x="412" y="134">지연·초과 공시</text>
  </g>

  <!-- F: mid-2027 -->
  <line x1="450" y1="185" x2="450" y2="268" stroke="#f5a623" stroke-dasharray="3 3"/>
  <circle cx="450" cy="185" r="6" fill="#fff" stroke="#f5a623" stroke-width="2"/>
  <g text-anchor="middle" font-size="12" fill="#1f2937">
    <text x="450" y="282" font-weight="700">2027 중반</text>
    <text x="450" y="298">재평가 완료 예정</text>
  </g>

  <!-- new schedule TBD -->
  <text x="560" y="226" font-size="12" font-weight="700" fill="#b7791f" text-anchor="middle">새 일정 미정</text>

  <!-- G: 2030.10 old target -->
  <line x1="647" y1="158" x2="647" y2="185" stroke="#6b7280"/>
  <circle cx="647" cy="185" r="7" fill="#fff" stroke="#6b7280" stroke-width="2"/>
  <line x1="642" y1="180" x2="652" y2="190" stroke="#6b7280" stroke-width="2"/>
  <line x1="652" y1="180" x2="642" y2="190" stroke="#6b7280" stroke-width="2"/>
  <g text-anchor="middle" font-size="12" fill="#6b7280">
    <text x="647" y="118" font-weight="700">2030.10</text>
    <text x="647" y="134">기존 상업운전</text>
    <text x="647" y="150">목표 → 무효</text>
  </g>

  <!-- cost section -->
  <text x="24" y="334" font-size="14" font-weight="700" fill="#0b6e4f">② 비용 추정(2025년 5월 발표 기준)</text>

  <text x="150" y="363" font-size="13" font-weight="700" fill="#1f2937" text-anchor="end">1호기</text>
  <rect x="160" y="345" width="378" height="26" fill="#0b6e4f"/>
  <rect x="538" y="345" width="99" height="26" fill="#6b7280"/>
  <text x="172" y="363" font-size="13" style="fill:#fff">1호기 고유 61억</text>
  <text x="548" y="363" font-size="13" style="fill:#fff">공용 16억</text>
  <text x="645" y="363" font-size="13" font-weight="700" fill="#1f2937">=77억</text>
  <text x="160" y="392" font-size="12" fill="#b7791f">→ 2026.11.10 OPG: 77억 안 완공 기대 안 함 · 새 추정은 2027년 중반</text>

  <text x="150" y="429" font-size="13" font-weight="700" fill="#1f2937" text-anchor="end">4호기</text>
  <rect x="160" y="411" width="254" height="26" fill="#5fa98c"/>
  <text x="172" y="429" font-size="13" style="fill:#fff">4호기 41억</text>
  <text x="424" y="429" font-size="12" fill="#1f2937">1호기보다 약 33% 낮게 추정</text>

  <g font-size="10.5" fill="#6b7280">
    <text x="24" y="464">자료: OPG 2026년 3분기 실적 발표(2026.11.10), CNSC 건설허가(2025.4.4), ANS(2026.6.5),</text>
    <text x="24" y="479">World Nuclear News(2021.12.2, 2025.5). 금액은 이자·물가상승·예비비 포함 추정, 4호기는 WNN이 전한 OPG 추정.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">고리 3·4호기, 한빛 1·2호기, 월성 2호기의 허가 만료일과 정지 기간, 10월 27일 고리 3·4호기 계속운전 허가, 재가동과 심의 목표 시기를 2024년 7월부터 2027년 말까지의 타임라인으로 그린 그림</title>
  <style>
    .title { font-size: 18px; font-weight: 800; fill: #1f2937; }
    .sub { font-size: 11px; fill: #6b7280; }
    .hd { font-size: 12px; font-weight: 800; fill: #1f2937; }
    .nm { font-size: 13px; font-weight: 800; fill: #1f2937; }
    .mw { font-size: 11px; fill: #6b7280; }
    .tk { font-size: 11px; fill: #6b7280; }
    .dt { font-size: 10.5px; fill: #1f2937; font-weight: 700; }
    .i1 { font-size: 12px; fill: #1f2937; font-weight: 700; }
    .i2 { font-size: 11.5px; fill: #1f2937; }
    .ok { font-size: 12px; fill: #0b6e4f; font-weight: 800; }
    .lg { font-size: 11px; fill: #1f2937; }
    .src { font-size: 10px; fill: #6b7280; }
  </style>
  <rect x="0" y="0" width="720" height="470" fill="#f8faf9"/>
  <text x="20" y="30" class="title">고리 3·4호기 10월 27일 계속운전 허가, 남은 한빛 1·2호기와 월성 2호기</text>
  <text x="20" y="48" class="sub">정지 기간은 2026년 10월 29일까지 · 재가동·심의 목표는 보도된 시기이며 확정 일정이 아님</text>
  <text x="20" y="66" class="hd">호기</text>
  <text x="100" y="66" class="hd">허가 만료와 정지 기간</text>
  <text x="436" y="66" class="hd">심사 단계 · 다음 일정</text>
  <line x1="100" y1="92" x2="420" y2="92" stroke="#9ca3af" stroke-width="1"/>
  <line x1="145.7" y1="88" x2="145.7" y2="372" stroke="#d1d5db" stroke-width="1"/>
  <text x="148.7" y="85" class="tk">2025</text>
  <line x1="237.1" y1="88" x2="237.1" y2="372" stroke="#d1d5db" stroke-width="1"/>
  <text x="240.1" y="85" class="tk">2026</text>
  <line x1="328.6" y1="88" x2="328.6" y2="372" stroke="#d1d5db" stroke-width="1"/>
  <text x="331.6" y="85" class="tk">2027</text>
  <line x1="420" y1="88" x2="420" y2="372" stroke="#d1d5db" stroke-width="1"/>
  <text x="417" y="85" class="tk" text-anchor="end">2028</text>
  <line x1="191.4" y1="89" x2="191.4" y2="95" stroke="#9ca3af" stroke-width="1"/>
  <line x1="282.9" y1="89" x2="282.9" y2="95" stroke="#9ca3af" stroke-width="1"/>
  <line x1="374.3" y1="89" x2="374.3" y2="95" stroke="#9ca3af" stroke-width="1"/>

  <!-- 고리 3호기 -->
  <text x="20" y="116" class="nm">고리 3호기</text>
  <text x="20" y="132" class="mw">950MW</text>
  <rect x="100" y="110" width="22.1" height="16" rx="3" fill="#bfe3d3"/>
  <rect x="122.1" y="110" width="190.2" height="16" rx="3" fill="#f5a623"/>
  <rect x="312.3" y="110.75" width="62" height="14.5" rx="3" fill="none" stroke="#0b6e4f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="117.1" y="113" width="10" height="10" transform="rotate(45 122.1 118)" fill="#1f2937"/>
  <text x="128.1" y="105" class="dt">9.28 만료</text>
  <circle cx="312.3" cy="118" r="6" fill="#0b6e4f" stroke="#ffffff" stroke-width="1.5"/>
  <path d="M328.6 133 V138 H374.3 V133" fill="none" stroke="#0b6e4f" stroke-width="2"/>
  <text x="436" y="115" class="ok">10.27 계속운전 허가</text>
  <text x="436" y="132" class="i2">기한 2034.9.28 · 재가동 목표 2027 상반기</text>
  <line x1="16" y1="146" x2="704" y2="146" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 고리 4호기 -->
  <text x="20" y="172" class="nm">고리 4호기</text>
  <text x="20" y="188" class="mw">950MW</text>
  <rect x="100" y="166" width="100.4" height="16" rx="3" fill="#bfe3d3"/>
  <rect x="200.4" y="166" width="111.9" height="16" rx="3" fill="#f5a623"/>
  <rect x="312.3" y="166.75" width="62" height="14.5" rx="3" fill="none" stroke="#0b6e4f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="195.4" y="169" width="10" height="10" transform="rotate(45 200.4 174)" fill="#1f2937"/>
  <text x="206.4" y="161" class="dt">8.6 만료</text>
  <circle cx="312.3" cy="174" r="6" fill="#0b6e4f" stroke="#ffffff" stroke-width="1.5"/>
  <path d="M328.6 189 V194 H374.3 V189" fill="none" stroke="#0b6e4f" stroke-width="2"/>
  <text x="436" y="171" class="ok">10.27 계속운전 허가</text>
  <text x="436" y="188" class="i2">기한 2035.8.6 · 재가동 목표 2027 상반기</text>
  <line x1="16" y1="202" x2="704" y2="202" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 한빛 1호기 -->
  <text x="20" y="228" class="nm">한빛 1호기</text>
  <text x="20" y="244" class="mw">950MW</text>
  <rect x="100" y="222" width="134.9" height="16" rx="3" fill="#bfe3d3"/>
  <rect x="234.9" y="222" width="77.9" height="16" rx="3" fill="#f5a623"/>
  <rect x="312.8" y="222.75" width="61.5" height="14.5" rx="3" fill="none" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="229.9" y="225" width="10" height="10" transform="rotate(45 234.9 230)" fill="#1f2937"/>
  <text x="240.9" y="217" class="dt">12월 만료</text>
  <path d="M328.6 245 V250 H374.3 V245" fill="none" stroke="#0b6e4f" stroke-width="2"/>
  <text x="436" y="227" class="i1">사고관리계획서 10.15 승인</text>
  <text x="436" y="244" class="i2">계속운전 심의 목표 2027 상반기</text>
  <line x1="16" y1="258" x2="704" y2="258" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 한빛 2호기 -->
  <text x="20" y="284" class="nm">한빛 2호기</text>
  <text x="20" y="300" class="mw">950MW</text>
  <rect x="100" y="278" width="200.6" height="16" rx="3" fill="#bfe3d3"/>
  <rect x="300.6" y="278" width="12.2" height="16" rx="3" fill="#f5a623"/>
  <rect x="312.8" y="278.75" width="61.5" height="14.5" rx="3" fill="none" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="295.6" y="281" width="10" height="10" transform="rotate(45 300.6 286)" fill="#1f2937"/>
  <text x="294.6" y="273" class="dt" text-anchor="end">9.11 만료</text>
  <path d="M328.6 301 V306 H374.3 V301" fill="none" stroke="#0b6e4f" stroke-width="2"/>
  <text x="436" y="283" class="i1">1호기와 같은 단계</text>
  <text x="436" y="300" class="i2">계속운전 심의 목표 2027 상반기</text>
  <line x1="16" y1="314" x2="704" y2="314" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 월성 2호기 -->
  <text x="20" y="340" class="nm">월성 2호기</text>
  <text x="20" y="356" class="mw">700MW</text>
  <rect x="100" y="334" width="213.3" height="16" rx="3" fill="#bfe3d3"/>
  <rect x="313.3" y="334.75" width="106.7" height="14.5" rx="3" fill="none" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="308.3" y="337" width="10" height="10" transform="rotate(45 313.3 342)" fill="#1f2937"/>
  <text x="319.3" y="329" class="dt">11.1 만료</text>
  <path d="M374.3 357 V362 H420 V357" fill="none" stroke="#0b6e4f" stroke-width="2"/>
  <text x="436" y="339" class="i1">11.1 허가 만료 · 변경허가 신청 전</text>
  <text x="436" y="356" class="i2">한수원 심의 목표 2027 하반기</text>

  <!-- 기준일 선 -->
  <line x1="312.8" y1="96" x2="312.8" y2="372" stroke="#dc2626" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="312.8" y="385" class="dt" text-anchor="middle" style="fill:#dc2626">기준 10.29</text>

  <!-- 범례 -->
  <rect x="20" y="396" width="22" height="10" rx="2" fill="#bfe3d3"/>
  <text x="48" y="405" class="lg">운전 허가 기간</text>
  <rect x="150" y="396" width="22" height="10" rx="2" fill="#f5a623"/>
  <text x="178" y="405" class="lg">허가 만료 정지</text>
  <rect x="280" y="396" width="22" height="10" rx="2" fill="none" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="308" y="405" class="lg">정지 지속(예상)</text>
  <rect x="420" y="396" width="22" height="10" rx="2" fill="none" stroke="#0b6e4f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="448" y="405" class="lg">허가 후 설비 개선·검사(예상)</text>
  <rect x="21" y="417" width="9" height="9" transform="rotate(45 25.5 421.5)" fill="#1f2937"/>
  <text x="38" y="426" class="lg">허가 만료일</text>
  <circle cx="131" cy="421.5" r="5.5" fill="#0b6e4f"/>
  <text x="142" y="426" class="lg">계속운전 허가(10.27)</text>
  <path d="M280 419 V424 H302 V419" fill="none" stroke="#0b6e4f" stroke-width="2"/>
  <text x="308" y="426" class="lg">재가동·심의 목표 시기</text>

  <text x="20" y="448" class="src">출처: 원안위 의결 보도(경향신문·파이낸셜뉴스 2026.10.27), 사고관리계획서 승인(경향신문 2026.10.15), 재경일보(2026.10.27),</text>
  <text x="20" y="462" class="src">매일신문(2026.10.21) · 월성 2호기 신청 여부는 10월 21일 보도 기준 · 한빛 1호기는 2025년 12월 만료 · 기준일 2026년 10월 29일</text>
</svg>

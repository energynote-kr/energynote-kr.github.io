<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif">
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1e2430; }
    .label { font-size: 13px; fill: #1e2430; font-weight: 700; }
    .stage { font-size: 11.5px; fill: #5a6472; }
    .note { font-size: 11.5px; fill: #ffffff; font-weight: 700; }
  </style>
  <text x="20" y="30" class="title">고준위 처분장, 나라별로 어디까지 왔나</text>

  <!-- 단계 헤더 -->
  <text x="200" y="62" class="stage">부지 선정</text>
  <text x="330" y="62" class="stage">인허가</text>
  <text x="450" y="62" class="stage">건설</text>
  <text x="580" y="62" class="stage">가동</text>
  <g stroke="#e6e4de" stroke-width="1">
    <line x1="190" y1="70" x2="190" y2="310"/><line x1="320" y1="70" x2="320" y2="310"/>
    <line x1="440" y1="70" x2="440" y2="310"/><line x1="570" y1="70" x2="570" y2="310"/><line x1="690" y1="70" x2="690" y2="310"/>
  </g>

  <!-- 핀란드 -->
  <text x="20" y="97" class="label">🇫🇮 핀란드 온칼로</text>
  <rect x="190" y="82" width="480" height="22" rx="6" fill="#0b6e4f"/>
  <text x="480" y="98" class="note">2026 안전심사 통과 · 가동 목전</text>

  <!-- 스웨덴 -->
  <text x="20" y="142" class="label">🇸🇪 스웨덴 포스마크</text>
  <rect x="190" y="127" width="330" height="22" rx="6" fill="#2f8668"/>
  <text x="330" y="143" class="note">2022 승인 · 건설 중</text>

  <!-- 프랑스 -->
  <text x="20" y="187" class="label">🇫🇷 프랑스 Cigéo</text>
  <rect x="190" y="172" width="220" height="22" rx="6" fill="#3f9274"/>
  <text x="240" y="188" class="note">인허가 심사 진행 중</text>

  <!-- 미국 -->
  <text x="20" y="232" class="label">🇺🇸 미국 유카마운틴</text>
  <rect x="190" y="217" width="200" height="22" rx="6" fill="#8a8f98"/>
  <text x="215" y="233" class="note">정치적 표류 (WIPP는 별도 가동)</text>

  <!-- 독일 -->
  <text x="20" y="277" class="label">🇩🇪 독일</text>
  <rect x="190" y="262" width="100" height="22" rx="6" fill="#8a8f98"/>
  <text x="300" y="278" class="stage">고어레벤 백지화 → 2017년 재시작</text>

  <!-- 한국 -->
  <text x="20" y="322" class="label">🇰🇷 한국 (고준위)</text>
  <rect x="190" y="307" width="60" height="22" rx="6" fill="#c0392b"/>
  <text x="260" y="323" class="stage">2025 특별법 제정 · 처분시설 목표 2060년 (중저준위 경주는 2015년부터 가동 중)</text>

  <rect x="20" y="345" width="680" height="26" fill="#e3f2ec" rx="8"/>
  <text x="40" y="363" class="stage" font-size="12.5">막대 길이는 진행 단계의 개략 표시 · 자료: Posiva/STUK, SKB, ANDRA, DOE, 산업부 (2026년 9월 기준)</text>
</svg>

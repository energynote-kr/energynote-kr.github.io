<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif">
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1e2430; }
    .label { font-size: 13.5px; fill: #1e2430; }
    .value { font-size: 13px; font-weight: 700; fill: #0b6e4f; }
    .note { font-size: 11.5px; fill: #5a6472; }
  </style>
  <text x="20" y="30" class="title">검출한계는 기준치보다 얼마나 낮을까 (세슘, Bq/kg)</text>
  <text x="20" y="50" class="note">막대 길이는 √값 비례 · 자료: 식품의약품안전처, CODEX</text>

  <text x="20" y="97" class="label">정밀검사 검출한계</text>
  <rect x="230" y="83" width="20" height="20" rx="3" fill="#0b6e4f"/>
  <text x="258" y="98" class="value">약 1</text>

  <text x="20" y="142" class="label">몸속 칼륨-40 (참고)</text>
  <rect x="230" y="128" width="104" height="20" rx="4" fill="#f5a623"/>
  <text x="342" y="143" class="value">약 55</text>

  <text x="20" y="187" class="label">우리나라 식품 기준</text>
  <rect x="230" y="173" width="140" height="20" rx="4" fill="#0b6e4f"/>
  <text x="378" y="188" class="value">100</text>

  <text x="20" y="232" class="label">국제(CODEX) 기준</text>
  <rect x="230" y="218" width="442" height="20" rx="4" fill="#5a6472"/>
  <text x="560" y="213" class="value" fill="#5a6472">1,000</text>

  <line x1="230" y1="75" x2="230" y2="248" stroke="#e6e4de" stroke-width="1"/>

  <rect x="20" y="262" width="680" height="46" fill="#e3f2ec" rx="10"/>
  <text x="40" y="282" class="label" font-weight="700">읽는 법</text>
  <text x="40" y="300" class="note" font-size="13">"불검출"은 기준(100)의 100분의 1 수준(약 1)까지 들여다보고도 없었다는 뜻입니다.</text>
</svg>

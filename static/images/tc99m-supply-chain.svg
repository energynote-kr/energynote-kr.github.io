<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">테크네튬-99m 공급 사슬: 연구로에서 Mo-99를 만들어 제너레이터에 담아 병원으로 보내고 Tc-99m을 뽑아 환자에게 쓰는 흐름과 각 단계 반감기, 세계 주요 생산 연구로 6기의 가동 시작 연도</title>
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1f2937; }
    .sub { font-size: 11.5px; fill: #6b7280; }
    .box { font-size: 13px; font-weight: 700; }
    .note { font-size: 11.5px; fill: #1f2937; }
    .hl { font-size: 12px; font-weight: 700; fill: #b45309; }
    .lab { font-size: 12.5px; fill: #1f2937; }
    .yr { font-size: 12px; font-weight: 700; fill: #0b6e4f; }
    .small { font-size: 10.5px; fill: #6b7280; }
  </style>
  <rect x="0" y="0" width="720" height="500" fill="#f8faf9"/>
  <text x="20" y="30" class="title">테크네튬-99m은 어디서 오나 — 매주 다시 채워야 하는 공급 사슬</text>
  <text x="20" y="49" class="sub">Mo-99는 사흘마다 절반, Tc-99m은 6시간마다 절반으로 줄어 어느 단계에서도 비축이 불가능</text>

  <!-- 흐름도: 5단계 -->
  <!-- 1 연구로 -->
  <rect x="20" y="78" width="118" height="60" rx="8" fill="#0b6e4f"/>
  <text x="79" y="102" text-anchor="middle" class="box" style="fill:#fff">연구용 원자로</text>
  <text x="79" y="121" text-anchor="middle" style="font-size:11px; fill:#fff">우라늄 표적 핵분열</text>
  <!-- 2 Mo-99 -->
  <rect x="166" y="78" width="118" height="60" rx="8" fill="#0b6e4f"/>
  <text x="225" y="102" text-anchor="middle" class="box" style="fill:#fff">Mo-99 분리·정제</text>
  <text x="225" y="121" text-anchor="middle" style="font-size:11px; fill:#fff">가공시설, 항공 운송</text>
  <!-- 3 제너레이터 -->
  <rect x="312" y="78" width="118" height="60" rx="8" fill="#f5a623"/>
  <text x="371" y="102" text-anchor="middle" class="box" fill="#1f2937">제너레이터</text>
  <text x="371" y="121" text-anchor="middle" font-size="11" fill="#1f2937">'소' — 1~2주 사용</text>
  <!-- 4 병원 -->
  <rect x="458" y="78" width="118" height="60" rx="8" fill="#0b6e4f"/>
  <text x="517" y="102" text-anchor="middle" class="box" style="fill:#fff">병원 핵의학과</text>
  <text x="517" y="121" text-anchor="middle" style="font-size:11px; fill:#fff">매일 아침 Tc-99m 추출</text>
  <!-- 5 환자 -->
  <rect x="604" y="78" width="96" height="60" rx="8" fill="#0b6e4f"/>
  <text x="652" y="102" text-anchor="middle" class="box" style="fill:#fff">환자</text>
  <text x="652" y="121" text-anchor="middle" style="font-size:11px; fill:#fff">뼈·심장 스캔</text>

  <!-- 화살표 -->
  <g stroke="#6b7280" stroke-width="2" fill="#6b7280">
    <line x1="138" y1="108" x2="160" y2="108"/><polygon points="160,104 166,108 160,112"/>
    <line x1="284" y1="108" x2="306" y2="108"/><polygon points="306,104 312,108 306,112"/>
    <line x1="430" y1="108" x2="452" y2="108"/><polygon points="452,104 458,108 452,112"/>
    <line x1="576" y1="108" x2="598" y2="108"/><polygon points="598,104 604,108 598,112"/>
  </g>

  <!-- 반감기 라벨 -->
  <text x="225" y="160" text-anchor="middle" class="hl">Mo-99 반감기 66시간</text>
  <text x="225" y="176" text-anchor="middle" class="note">생산 → 병원 도착까지 며칠 안에</text>
  <text x="517" y="160" text-anchor="middle" class="hl">Tc-99m 반감기 6시간</text>
  <text x="517" y="176" text-anchor="middle" class="note">그날 뽑아 그날 검사</text>

  <line x1="20" y1="196" x2="700" y2="196" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 생산 연구로 목록 -->
  <text x="20" y="220" style="font-size:14px; font-weight:800; fill:#1f2937">Mo-99를 상업 규모로 만드는 연구로 (2026년 9월 기준)</text>
  <text x="20" y="238" class="sub">막대 길이 = 가동 기간. OPAL(2006년)을 빼면 모두 50년 이상 된 원자로</text>

  <!-- 축: 1955~2026 → x 250~660 (410px / 71년 ≈ 5.775px/년) -->
  <g class="small">
    <text x="250" y="256" text-anchor="middle">1955</text>
    <text x="337" y="256" text-anchor="middle">1970</text>
    <text x="423" y="256" text-anchor="middle">1985</text>
    <text x="510" y="256" text-anchor="middle">2000</text>
    <text x="597" y="256" text-anchor="middle">2015</text>
    <text x="660" y="256" text-anchor="middle">2026</text>
  </g>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="250" y1="262" x2="250" y2="424"/>
    <line x1="337" y1="262" x2="337" y2="424"/>
    <line x1="423" y1="262" x2="423" y2="424"/>
    <line x1="510" y1="262" x2="510" y2="424"/>
    <line x1="597" y1="262" x2="597" y2="424"/>
    <line x1="660" y1="262" x2="660" y2="424" stroke="#6b7280"/>
  </g>

  <!-- 행 1: LVR-15 1957 → x=261.6 -->
  <text x="20" y="282" class="lab">LVR-15 · 체코(보조)</text>
  <rect x="262" y="270" width="398" height="16" rx="3" fill="#0b6e4f" opacity="0.55"/>
  <text x="180" y="282" class="yr">1957년</text>

  <!-- 행 2: HFR 1961 → x=284.7 -->
  <text x="20" y="310" class="lab">HFR · 네덜란드</text>
  <rect x="285" y="298" width="375" height="16" rx="3" fill="#0b6e4f"/>
  <text x="180" y="310" class="yr">1961년</text>

  <!-- 행 3: BR2 1961 -->
  <text x="20" y="338" class="lab">BR2 · 벨기에</text>
  <rect x="285" y="326" width="375" height="16" rx="3" fill="#0b6e4f"/>
  <text x="180" y="338" class="yr">1961년</text>

  <!-- 행 4: SAFARI-1 1965 → x=307.8 -->
  <text x="20" y="366" class="lab">SAFARI-1 · 남아공</text>
  <rect x="308" y="354" width="352" height="16" rx="3" fill="#0b6e4f"/>
  <text x="180" y="366" class="yr">1965년</text>

  <!-- 행 5: MARIA 1974 → x=359.7 -->
  <text x="20" y="394" class="lab">MARIA · 폴란드</text>
  <rect x="360" y="382" width="300" height="16" rx="3" fill="#0b6e4f"/>
  <text x="180" y="394" class="yr">1974년</text>

  <!-- 행 6: OPAL 2007 → x=550.3 -->
  <text x="20" y="422" class="lab">OPAL · 호주</text>
  <rect x="545" y="410" width="115" height="16" rx="3" fill="#f5a623"/>
  <text x="180" y="422" class="yr">2006년</text>

  <!-- 참고: NRU -->
  <text x="20" y="446" class="note">· 캐나다 NRU(1957년)는 한때 세계 공급의 약 40%를 맡았으나 2018년 3월 영구 정지</text>
  <text x="20" y="463" class="note">· 한국은 Mo-99 전량 수입 — 부산 기장 수출용 신형연구로가 2027년 준공 목표로 건설 중</text>

  <text x="20" y="484" class="small">자료: OECD 원자력기구(NEA) 의료용 동위원소 공급 보고서(2019·2023), 미국 국립과학원 Molybdenum-99 for Medical Imaging(2016),</text>
  <text x="20" y="496" class="small">세계원자력협회(WNA), 한국원자력연구원 보도자료 · 2026년 9월 기준</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif">
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1e2430; }
    .label { font-size: 13.5px; fill: #1e2430; }
    .value { font-size: 13px; font-weight: 700; fill: #0b6e4f; }
    .note { font-size: 11.5px; fill: #5a6472; }
    .bar { fill: #0b6e4f; rx: 4; }
    .bar-ref { fill: #f5a623; rx: 4; }
  </style>
  <text x="20" y="30" class="title">한 번에 받는 방사선량 비교 (mSv)</text>
  <text x="20" y="50" class="note">막대 길이는 √값 비례 — 작은 값도 보이도록 조정 · 자료: ICRP, 원자력안전위원회</text>

  <!-- rows: sqrt scale, 1 mSv = sqrt(1)*180 px; max 6.5 -> sqrt(6.5)=2.55 -> 459px -->
  <!-- 흉부 엑스레이 0.1 -> 57px -->
  <text x="20" y="92" class="label">흉부 엑스레이 1회</text>
  <rect x="230" y="78" width="57" height="20" class="bar"/>
  <text x="295" y="93" class="value">약 0.1</text>

  <!-- 서울-뉴욕 왕복 0.15 -> 70px -->
  <text x="20" y="132" class="label">서울–뉴욕 왕복 비행</text>
  <rect x="230" y="118" width="70" height="20" class="bar"/>
  <text x="308" y="133" class="value">약 0.1~0.2</text>

  <!-- 저선량 폐 CT 1.5 -> 220px -->
  <text x="20" y="172" class="label">저선량 폐 CT 1회</text>
  <rect x="230" y="158" width="220" height="20" class="bar"/>
  <text x="458" y="173" class="value">약 1~2</text>

  <!-- 연간 자연방사선 3 -> 312px -->
  <text x="20" y="212" class="label">연간 자연방사선 (한국)</text>
  <rect x="230" y="198" width="312" height="20" class="bar-ref"/>
  <text x="550" y="213" class="value">약 3 / 년</text>

  <!-- 복부·흉부 CT 6.5 -> 459px -->
  <text x="20" y="252" class="label">흉부 CT 1회</text>
  <rect x="230" y="238" width="459" height="20" class="bar"/>
  <text x="565" y="233" class="value">약 7 (복부 CT 8~10)</text>

  <!-- 기준선 표시 -->
  <line x1="230" y1="70" x2="230" y2="270" stroke="#e6e4de" stroke-width="1"/>

  <!-- 하단 요약 -->
  <rect x="20" y="295" width="680" height="80" fill="#e3f2ec" rx="10"/>
  <text x="40" y="327" class="label" font-weight="700">읽는 법</text>
  <text x="40" y="352" class="note" font-size="13">CT 한 번(약 7~10mSv)은 우리가 어차피 매년 받는 자연방사선(약 3mSv)의 2~3년치 수준입니다.</text>
  <text x="40" y="370" class="note" font-size="13">뚜렷한 인체 영향이 확인되는 수준(한 번에 100mSv 이상)과는 10배 이상 차이가 납니다.</text>
</svg>

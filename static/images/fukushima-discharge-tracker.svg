<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">후쿠시마 오염수 방류 3년 추적: 연도별 방류 차수와 누적 방류량, 탱크 잔량, 배출 삼중수소 농도 비교</title>
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1f2937; }
    .h { font-size: 13px; font-weight: 800; fill: #1f2937; }
    .label { font-size: 12.5px; fill: #1f2937; }
    .value { font-size: 12.5px; font-weight: 700; fill: #0b6e4f; }
    .small { font-size: 11.5px; fill: #6b7280; }
    .src { font-size: 10.5px; fill: #6b7280; }
  </style>
  <rect x="0" y="0" width="720" height="500" fill="#f8faf9"/>

  <text x="20" y="30" class="title">후쿠시마 오염수 방류 3년 — 지금까지의 숫자</text>
  <text x="20" y="50" class="small">2023년 8월 24일 개시 · 회계연도(4월~3월) 기준 · 22차(2026년 8월 17일 종료)까지 집계, 23차(8/31~9/18, 약 7,800톤) 진행 중</text>

  <!-- 패널 1: 연도별 차수 · 누적 방류량 (누적 172,729톤 = 220px) -->
  <text x="20" y="82" class="h">연도별 방류 차수와 누적 방류량(톤)</text>
  <line x1="150" y1="92" x2="150" y2="218" stroke="#e5e7eb" stroke-width="1"/>

  <text x="20" y="111" class="label">2023년도 · 4회</text>
  <rect x="150" y="97" width="40" height="20" rx="4" fill="#0b6e4f"/>
  <text x="196" y="112" class="value">31,145</text>

  <text x="20" y="141" class="label">2024년도 · 7회</text>
  <rect x="150" y="127" width="40" height="20" rx="4" fill="#0b6e4f" opacity="0.55"/>
  <rect x="190" y="127" width="70" height="20" rx="4" fill="#0b6e4f"/>
  <text x="266" y="142" class="value">86,144</text>

  <text x="20" y="171" class="label">2025년도 · 7회</text>
  <rect x="150" y="157" width="110" height="20" rx="4" fill="#0b6e4f" opacity="0.55"/>
  <rect x="260" y="157" width="70" height="20" rx="4" fill="#0b6e4f"/>
  <text x="336" y="172" class="value">141,155</text>

  <text x="20" y="201" class="label">2026년도 · 4회*</text>
  <rect x="150" y="187" width="180" height="20" rx="4" fill="#0b6e4f" opacity="0.55"/>
  <rect x="330" y="187" width="40" height="20" rx="4" fill="#f5a623"/>
  <text x="376" y="202" class="value">172,729</text>

  <text x="20" y="224" class="small">*2026년도는 8회 계획 중 22차까지 4회 완료 · 진한 부분이 그해 방류분(회당 약 7,800톤)</text>

  <!-- 패널 2: 탱크 잔량 게이지 (134만 톤 = 240px) -->
  <text x="460" y="82" class="h">탱크 잔량</text>
  <rect x="460" y="97" width="240" height="26" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <rect x="460" y="97" width="222" height="26" rx="6" fill="#0b6e4f"/>
  <rect x="682" y="97" width="18" height="26" fill="#f5a623"/>
  <text x="470" y="115" style="font-size:12.5px; font-weight:700; fill:#fff">약 124만 톤 남음 (2026.8)</text>
  <text x="460" y="144" class="label">방류 개시 전 약 134만 톤 → 3년간 <tspan font-weight="700" fill="#b45309">−7.6%</tspan></text>
  <text x="460" y="162" class="small">새 오염수가 계속 생겨 감소폭은 작음</text>
  <text x="460" y="180" class="small">약 1,000기 중 비운 뒤 해체한 탱크 17기</text>
  <text x="460" y="198" class="small">폐로 목표인 2051년까지 약 30년 방류 계획</text>

  <!-- 패널 3: 삼중수소 농도 비교 (10,000 Bq/L = 540px) -->
  <text x="20" y="256" class="h">희석 후 배출 삼중수소 농도(Bq/L) — 어디에 견주면 되나</text>
  <line x1="160" y1="266" x2="160" y2="384" stroke="#e5e7eb" stroke-width="1"/>

  <text x="20" y="286" class="label">WHO 음용수 기준</text>
  <rect x="160" y="271" width="540" height="22" rx="4" fill="#6b7280"/>
  <text x="172" y="287" style="font-size:12.5px; font-weight:700; fill:#fff">10,000</text>

  <text x="20" y="326" class="label">일본 배출 목표(미만)</text>
  <rect x="160" y="311" width="81" height="22" rx="4" fill="#f5a623"/>
  <text x="247" y="327" class="value">1,500</text>

  <text x="20" y="366" class="label">22차 실제 배출값</text>
  <rect x="160" y="351" width="13" height="22" rx="3" fill="#0b6e4f"/>
  <text x="179" y="367" class="value">167~245 <tspan font-weight="400" fill="#6b7280">— 목표의 약 1/6~1/9, WHO 기준의 약 1/40~1/60</tspan></text>

  <text x="20" y="400" class="small">희석 전 오염수 자체는 약 17만 Bq/L(22차) · 원전 3km 이내 해역 이상치 판단 기준 700Bq/L, 방류 개시 후 초과 사례 없음</text>

  <!-- 하단 요약 -->
  <rect x="20" y="414" width="680" height="46" fill="#e3f2ec" rx="10"/>
  <text x="36" y="433" class="label" font-size="12.5">읽는 법: 배출값은 기준 안, 우리 해역 감시도 이상 신호 없음 → 다만 탱크는 92%가 남았고 방류는 계속된다</text>
  <text x="36" y="451" class="label" font-size="12.5">→ 삼중수소 외 핵종·유기결합 삼중수소(OBT)·장기 감시의 신뢰는 열린 쟁점, 숫자는 계속 세어야 한다</text>

  <text x="20" y="480" class="src">자료: 도쿄전력 ALPS 처리수 포털·2026년도 방류 계획, 국무조정실·해양수산부 브리핑 332차(2026.8.19), 교도통신(2026.8)</text>
  <text x="20" y="494" class="src">기준 시점: 2026년 9월 · 누적 방류량은 22차 종료(8.17)까지 · 탱크 잔량은 2026년 8월 공표 기준 · WHO 기준은 음용수 지침값</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 518" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">Decay heat falling after shutdown, how spent fuel pool space is divided, and the fuel path from reactor to interim storage with the point where a full pool blocks refueling</title>
  <rect x="0" y="0" width="720" height="518" fill="#f8faf9"/>

  <text x="20" y="32" font-size="18" font-weight="800" fill="#1f2937">When does a full spent fuel pool stop a reactor?</text>
  <text x="20" y="54" font-size="12" fill="#6b7280">Decay heat falls fast but never to zero, and a pool must keep room for the next discharge and a full core</text>

  <!-- Panel 1: decay heat -->
  <rect x="20" y="70" width="330" height="232" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="36" y="96" font-size="14" font-weight="800" fill="#1f2937">1. Decay heat after shutdown</text>
  <text x="36" y="115" font-size="12" fill="#6b7280">Share of full power before shutdown</text>

  <text x="36" y="144" font-size="12" fill="#1f2937">At shutdown</text>
  <rect x="112" y="130" width="180" height="20" rx="3" fill="#f5a623"/>
  <text x="298" y="145" font-size="12" font-weight="700" fill="#1f2937">6.5%</text>

  <text x="36" y="176" font-size="12" fill="#1f2937">1 hour</text>
  <rect x="112" y="162" width="42" height="20" rx="3" fill="#0b6e4f"/>
  <text x="160" y="177" font-size="12" font-weight="700" fill="#1f2937">1.5%</text>

  <text x="36" y="208" font-size="12" fill="#1f2937">1 day</text>
  <rect x="112" y="194" width="11" height="20" rx="2" fill="#0b6e4f"/>
  <text x="129" y="209" font-size="12" font-weight="700" fill="#1f2937">0.4%</text>

  <text x="36" y="240" font-size="12" fill="#1f2937">1 week</text>
  <rect x="112" y="226" width="6" height="20" rx="2" fill="#0b6e4f"/>
  <text x="124" y="241" font-size="12" font-weight="700" fill="#1f2937">0.2%</text>

  <text x="36" y="270" font-size="11.5" fill="#6b7280">Only after years under water can fuel move</text>
  <text x="36" y="286" font-size="11.5" fill="#6b7280">to air-cooled dry casks</text>

  <!-- Panel 2: pool space -->
  <rect x="370" y="70" width="330" height="232" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="386" y="96" font-size="14" font-weight="800" fill="#1f2937">2. Pool space (concept)</text>
  <text x="386" y="115" font-size="12" fill="#6b7280">Proportions illustrative, not a real plant</text>

  <rect x="386" y="128" width="180" height="40" fill="#0b6e4f"/>
  <rect x="566" y="128" width="50" height="40" fill="#ffffff" stroke="#0b6e4f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="616" y="128" width="68" height="40" fill="#f5a623"/>
  <text x="476" y="153" font-size="12" font-weight="700" text-anchor="middle" style="fill:#fff">Stored fuel</text>

  <rect x="386" y="182" width="14" height="14" fill="#0b6e4f"/>
  <text x="408" y="194" font-size="12" fill="#1f2937">Spent fuel already stored</text>
  <rect x="386" y="204" width="14" height="14" fill="#ffffff" stroke="#0b6e4f" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="408" y="216" font-size="12" fill="#1f2937">Next discharge: fuel from next outage</text>
  <rect x="386" y="226" width="14" height="14" fill="#f5a623"/>
  <text x="408" y="238" font-size="12" fill="#1f2937">Full core reserve: room for whole core</text>

  <text x="386" y="270" font-size="11.5" font-weight="700" fill="#0b6e4f">If the dashed space runs out, used fuel</text>
  <text x="386" y="286" font-size="11.5" font-weight="700" fill="#0b6e4f">cannot come out, so no refueling, no restart</text>

  <!-- Panel 3: flow -->
  <text x="20" y="332" font-size="14" font-weight="800" fill="#1f2937">3. Where the fuel goes, and where it jams</text>

  <rect x="20" y="346" width="150" height="62" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="95" y="370" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Reactor</text>
  <text x="95" y="389" font-size="11" text-anchor="middle" fill="#6b7280">1/4 to 1/3 of fuel</text>
  <text x="95" y="403" font-size="11" text-anchor="middle" fill="#6b7280">replaced per outage</text>

  <rect x="196" y="346" width="150" height="62" rx="8" fill="#ffffff" stroke="#0b6e4f" stroke-width="2"/>
  <text x="271" y="370" font-size="13" font-weight="700" text-anchor="middle" fill="#0b6e4f">Spent fuel pool</text>
  <text x="271" y="389" font-size="11" text-anchor="middle" fill="#6b7280">Water cools and</text>
  <text x="271" y="403" font-size="11" text-anchor="middle" fill="#6b7280">shields the fuel</text>

  <rect x="372" y="346" width="150" height="62" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="447" y="370" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">On-site dry storage</text>
  <text x="447" y="389" font-size="11" text-anchor="middle" fill="#6b7280">Cooled fuel sealed</text>
  <text x="447" y="403" font-size="11" text-anchor="middle" fill="#6b7280">in casks</text>

  <rect x="548" y="346" width="152" height="62" rx="8" fill="#ffffff" stroke="#6b7280" stroke-dasharray="5 3"/>
  <text x="624" y="370" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Interim / disposal</text>
  <text x="624" y="389" font-size="11" text-anchor="middle" fill="#6b7280">Korea targets 2050, 2060</text>
  <text x="624" y="403" font-size="11" text-anchor="middle" fill="#6b7280">(no site chosen yet)</text>

  <g stroke="#6b7280" stroke-width="2" fill="none">
    <line x1="171" y1="377" x2="190" y2="377"/>
    <line x1="523" y1="377" x2="542" y2="377"/>
  </g>
  <g fill="#6b7280">
    <polygon points="195,377 188,372 188,382"/>
    <polygon points="547,377 540,372 540,382"/>
  </g>
  <line x1="347" y1="377" x2="366" y2="377" stroke="#f5a623" stroke-width="2.5"/>
  <polygon points="371,377 364,372 364,382" fill="#f5a623"/>
  <circle cx="359" cy="427" r="9" fill="#f5a623"/>
  <text x="359" y="431" font-size="12" font-weight="800" text-anchor="middle" style="fill:#fff">!</text>
  <text x="374" y="432" font-size="12" font-weight="700" fill="#1f2937">Jam here: the pool fills, refueling stops</text>
  <text x="374" y="449" font-size="11" fill="#6b7280">e.g. Kuosheng 1, Taiwan: barred 2016, shut 2021</text>

  <text x="20" y="478" font-size="10.5" fill="#6b7280">Decay heat: World Nuclear Association, "Nuclear Power Reactors" · Full core reserve: US National Research Council (2006)</text>
  <text x="20" y="493" font-size="10.5" fill="#6b7280">Kuosheng: World Nuclear News (Jul 1, 2021), PBNC 2018 paper · As of November 9, 2026</text>
  <text x="20" y="508" font-size="10.5" fill="#6b7280">2050/2060 targets: Korea's High-Level Waste Act and draft third basic plan (published Nov 2026)</text>
</svg>

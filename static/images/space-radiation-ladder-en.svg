<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 488" role="img" aria-labelledby="t" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Log-scale bar chart comparing a year on the ground, a year as aircrew, ten days on a lunar round trip, six months on the ISS and the transit legs of a Mars round trip, with the five-year worker limit and NASA's career limit marked</title>
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1f2937; }
    .sub { font-size: 11.5px; fill: #6b7280; }
    .label { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .note { font-size: 11px; fill: #6b7280; }
    .value { font-size: 13px; font-weight: 700; fill: #0b6e4f; }
    .tick { font-size: 11px; fill: #6b7280; }
    .ref { font-size: 11px; font-weight: 700; fill: #6b7280; }
  </style>
  <rect x="0" y="0" width="720" height="488" fill="#f8faf9"/>
  <text x="20" y="30" class="title">The space radiation ladder — from the ground to Mars (mSv)</text>
  <text x="20" y="50" class="sub">Log scale: each axis step is 10×. Approximate ranges from each source, assuming no solar particle event (SPE)</text>

  <!-- reference lines -->
  <text x="501" y="70" class="ref" text-anchor="end">Worker 5-year limit</text>
  <text x="501" y="84" class="ref" text-anchor="end">100 mSv</text>
  <text x="712" y="70" text-anchor="end" class="ref">NASA career limit</text>
  <text x="712" y="84" text-anchor="end" class="ref">600 mSv</text>
  <line x1="507" y1="90" x2="507" y2="330" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="626" y1="90" x2="626" y2="330" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 1 ground -->
  <text x="20" y="114" class="label">Ground, 1 year</text>
  <text x="20" y="128" class="note">Natural background, Korea average</text>
  <rect x="200" y="104" width="73" height="24" rx="4" fill="#9ca3af"/>
  <text x="281" y="121" class="value">about 3 (world avg 2.4)</text>

  <!-- 2 aircrew -->
  <text x="20" y="162" class="label">Aircrew, 1 year</text>
  <text x="20" y="176" class="note">Long-haul; Korea's legal limit 6/yr</text>
  <rect x="200" y="152" width="107" height="24" rx="4" fill="#0b6e4f" opacity="0.7"/>
  <text x="315" y="169" class="value">2–5</text>

  <!-- 3 lunar round trip -->
  <text x="20" y="210" class="label">Moon round trip, 10 days</text>
  <text x="20" y="224" class="note">Artemis II (est. from Artemis I)</text>
  <rect x="200" y="200" width="199" height="24" rx="4" fill="#0b6e4f"/>
  <text x="407" y="217" class="value">about 10–20</text>

  <!-- 4 ISS -->
  <text x="20" y="258" class="label">ISS, 6 months</text>
  <text x="20" y="272" class="note">80–160 depending on solar activity</text>
  <rect x="200" y="248" width="338" height="24" rx="4" fill="#0b6e4f"/>
  <text x="546" y="265" class="value">80–160</text>

  <!-- 5 Mars -->
  <text x="20" y="306" class="label">Mars transit, round trip</text>
  <text x="20" y="320" class="note">Curiosity data · ~1 yr, no surface</text>
  <rect x="200" y="296" width="432" height="24" rx="4" fill="#f5a623"/>
  <text x="640" y="313" class="value" style="fill:#b45309">about 660</text>

  <!-- axis -->
  <line x1="200" y1="330" x2="668" y2="330" stroke="#6b7280" stroke-width="1"/>
  <text x="200" y="346" class="tick" text-anchor="middle">1</text>
  <text x="353" y="346" class="tick" text-anchor="middle">10</text>
  <text x="507" y="346" class="tick" text-anchor="middle">100</text>
  <text x="660" y="346" class="tick" text-anchor="middle">1,000</text>
  <text x="20" y="346" class="tick">mSv (log scale)</text>

  <!-- how to read -->
  <rect x="20" y="362" width="680" height="80" rx="10" fill="#e3f2ec"/>
  <text x="40" y="383" class="note" font-size="12.5" fill="#1f2937">How to read: ten days to the Moon and back is 1–3 chest CT scans, or 10–20% of the 100 mSv five-year worker limit.</text>
  <text x="40" y="401" class="note" font-size="12.5" fill="#1f2937">Six months on the ISS matches or exceeds that limit but stays inside NASA's 600 mSv career limit. Transit alone</text>
  <text x="40" y="419" class="note" font-size="12.5" fill="#1f2937">breaks the career limit only for Mars — that arithmetic is "the Mars radiation problem".</text>
  <text x="40" y="435" class="note" font-size="11" fill="#6b7280">Solar-storm shelter target: crew dose under 150 mSv (NASA)</text>

  <text x="20" y="464" class="note" font-size="10.5">Sources: George et al., Nature (2024, Artemis I) · NASA Artemis II pre-flight estimate (March 2026) · Zeitlin et al., Science (2013)</text>
  <text x="20" y="479" class="note" font-size="10.5">Royal Observatory of Belgium SIDC (ISS 6 months) · NASA-STD-3001 (career limit) · Korean law (worker and aircrew limits) · as of Sept. 2026</text>
</svg>

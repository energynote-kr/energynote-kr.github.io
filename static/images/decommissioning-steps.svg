<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif">
  <style>
    .title { font-size: 17px; font-weight: 800; fill: #1e2430; }
    .step { font-size: 14px; font-weight: 800; fill: #ffffff; }
    .desc { font-size: 12px; fill: #1e2430; }
    .small { font-size: 11.5px; fill: #5a6472; }
  </style>
  <text x="20" y="30" class="title">원전 해체 4단계 — 건물 철거가 아니라 방사선 관리</text>

  <g>
    <rect x="20" y="70" width="155" height="60" rx="12" fill="#0b6e4f"/>
    <text x="34" y="96" class="step">① 연료 반출</text>
    <text x="34" y="116" class="desc" fill="#ffffff">방사능 대부분 제거</text>

    <rect x="195" y="70" width="155" height="60" rx="12" fill="#1f7a5c"/>
    <text x="209" y="96" class="step">② 제염</text>
    <text x="209" y="116" class="desc" fill="#ffffff">화학·고압수·드라이아이스</text>

    <rect x="370" y="70" width="155" height="60" rx="12" fill="#2f8668"/>
    <text x="384" y="96" class="step">③ 절단·철거</text>
    <text x="384" y="116" class="desc" fill="#ffffff">원격 장비·로봇 투입</text>

    <rect x="545" y="70" width="155" height="60" rx="12" fill="#3f9274"/>
    <text x="559" y="96" class="step">④ 폐기물·부지 복원</text>
    <text x="559" y="116" class="desc" fill="#ffffff">등급별 처분, 부지 재사용</text>
  </g>
  <g stroke="#5a6472" stroke-width="2">
    <line x1="175" y1="100" x2="193" y2="100"/><line x1="350" y1="100" x2="368" y2="100"/><line x1="525" y1="100" x2="543" y2="100"/>
  </g>

  <!-- 고리 1호기 타임라인 -->
  <text x="20" y="170" class="desc" font-weight="700">고리 1호기 적용 일정 (계획)</text>
  <line x1="40" y1="215" x2="680" y2="215" stroke="#c9c6bd" stroke-width="3"/>
  <g fill="#f5a623">
    <circle cx="60" cy="215" r="7"/><circle cx="240" cy="215" r="7"/><circle cx="450" cy="215" r="7"/><circle cx="660" cy="215" r="7"/>
  </g>
  <text x="30" y="245" class="small">2025.6 승인</text>
  <text x="30" y="260" class="small">2025.11 착공</text>
  <text x="200" y="245" class="small">~2031 연료 반출</text>
  <text x="200" y="260" class="small">비방사선 구역 철거</text>
  <text x="410" y="245" class="small">~2035 제염·철거</text>
  <text x="410" y="260" class="small">관리구역 작업</text>
  <text x="625" y="245" class="small">2037 완료</text>
  <text x="625" y="260" class="small">부지 복원</text>

  <rect x="20" y="280" width="680" height="30" fill="#e3f2ec" rx="8"/>
  <text x="40" y="300" class="small" font-size="12.5">총 사업비 약 1조 713억 원 · 최대 변수는 사용후핵연료 건식저장시설 확보 속도</text>
</svg>

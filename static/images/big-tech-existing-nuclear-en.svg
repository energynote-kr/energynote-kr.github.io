<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">Target power delivery dates for big tech nuclear deals, restarts, uprates and new SMRs (as of November 7, 2026)</title>
  <rect x="0" y="0" width="720" height="520" fill="#f8faf9"/>

  <text x="20" y="30" font-size="18" font-weight="700" fill="#1f2937">Big tech nuclear deals: when does the power actually arrive?</text>
  <text x="20" y="50" font-size="12" fill="#6b7280">Bars start at the target date stated by the company or agency; none is a fixed date (as of Nov. 7, 2026)</text>

  <!-- axis: x = 300 + (year-2026)*40 -->
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="300" y="72">2026</text>
    <text x="380" y="72">2028</text>
    <text x="460" y="72">2030</text>
    <text x="540" y="72">2032</text>
    <text x="620" y="72">2034</text>
    <text x="697" y="72">2036</text>
  </g>
  <g stroke="#d7dce1" stroke-width="1">
    <line x1="300" y1="78" x2="300" y2="466"/>
    <line x1="380" y1="78" x2="380" y2="466"/>
    <line x1="460" y1="78" x2="460" y2="466"/>
    <line x1="540" y1="78" x2="540" y2="466"/>
    <line x1="620" y1="78" x2="620" y2="466"/>
    <line x1="700" y1="78" x2="700" y2="466"/>
  </g>

  <!-- groups -->
  <rect x="20" y="84" width="90" height="84" rx="4" fill="#0b6e4f"/>
  <text x="65" y="122" font-size="13" font-weight="700" text-anchor="middle" style="fill:#fff">Existing</text>
  <text x="65" y="140" font-size="13" font-weight="700" text-anchor="middle" style="fill:#fff">plant PPAs</text>

  <rect x="20" y="182" width="90" height="84" rx="4" fill="#f5a623"/>
  <text x="65" y="229" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Restarts</text>

  <rect x="20" y="280" width="90" height="84" rx="4" fill="#6b7280"/>
  <text x="65" y="327" font-size="13" font-weight="700" text-anchor="middle" style="fill:#fff">Uprates</text>

  <rect x="20" y="378" width="90" height="84" rx="4" fill="#ffffff" stroke="#6b7280" stroke-dasharray="4 3"/>
  <text x="65" y="416" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">New SMRs,</text>
  <text x="65" y="434" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">advanced</text>

  <!-- project names -->
  <g font-size="12" fill="#1f2937">
    <text x="118" y="100">Meta–Vistra 2,176 MW</text>
    <text x="118" y="130">Meta–Clinton 1,121 MW</text>
    <text x="118" y="160">Amazon–Talen 1,920 MW</text>
    <text x="118" y="198">Palisades ~800 MW</text>
    <text x="118" y="228">Crane (TMI-1) 835 MW</text>
    <text x="118" y="258">Duane Arnold 615 MW</text>
    <text x="118" y="296">Google–Constellation 890 MW</text>
    <text x="118" y="326">Amazon–Calvert 190 MW</text>
    <text x="118" y="356">Meta–Vistra 433 MW</text>
    <text x="118" y="394">Google–Kairos 50 MW</text>
    <text x="118" y="424">Meta–TerraPower up to 2.8 GW</text>
    <text x="118" y="454">Google–Elementl 1.8 GW</text>
  </g>

  <!-- existing PPAs -->
  <rect x="336" y="86" width="364" height="20" fill="#0b6e4f"/>
  <text x="344" y="100" font-size="12" style="fill:#fff">Purchases begin late 2026</text>
  <rect x="358" y="116" width="342" height="20" fill="#0b6e4f"/>
  <text x="366" y="130" font-size="12" style="fill:#fff">Starts June 2027</text>
  <rect x="300" y="146" width="240" height="20" fill="#a7d3c2"/>
  <text x="308" y="160" font-size="12" fill="#1f2937">Ramping up</text>
  <rect x="540" y="146" width="160" height="20" fill="#0b6e4f"/>
  <text x="548" y="160" font-size="12" style="fill:#fff">Full volume by 2032</text>

  <!-- restarts -->
  <rect x="348" y="184" width="352" height="20" fill="#f5a623"/>
  <text x="356" y="198" font-size="12" fill="#1f2937">March 2027 sales target (not a big tech deal)</text>
  <rect x="340" y="214" width="360" height="20" fill="#f5a623"/>
  <text x="348" y="228" font-size="12" fill="#1f2937">2027 target (final NRC decision pending)</text>
  <rect x="430" y="244" width="270" height="20" fill="#f5a623"/>
  <text x="438" y="258" font-size="12" fill="#1f2937">Target: no later than Q1 2029</text>

  <!-- uprates -->
  <rect x="380" y="282" width="160" height="20" fill="#c9cdd3"/>
  <text x="388" y="296" font-size="12" fill="#1f2937">First uprate 2028</text>
  <rect x="540" y="282" width="160" height="20" fill="#6b7280"/>
  <text x="548" y="296" font-size="12" style="fill:#fff">Full 890 MW by 2032</text>
  <rect x="460" y="312" width="80" height="20" fill="#c9cdd3"/>
  <rect x="540" y="312" width="160" height="20" fill="#6b7280"/>
  <text x="548" y="326" font-size="12" style="fill:#fff">Online 2030–2032</text>
  <rect x="336" y="342" width="284" height="20" fill="#c9cdd3"/>
  <text x="344" y="356" font-size="12" fill="#1f2937">Completed in stages by 2034</text>
  <rect x="620" y="342" width="80" height="20" fill="#6b7280"/>

  <!-- new -->
  <rect x="460" y="380" width="240" height="20" fill="#ffffff" stroke="#6b7280" stroke-dasharray="4 3"/>
  <text x="468" y="394" font-size="12" fill="#1f2937">2030 target; 500 MW program by 2035</text>
  <rect x="540" y="410" width="160" height="20" fill="#ffffff" stroke="#6b7280" stroke-dasharray="4 3"/>
  <text x="548" y="424" font-size="12" fill="#1f2937">First 2 units: 2032</text>
  <text x="650" y="454" font-size="12" text-anchor="end" fill="#1f2937">2035 target; reactor not yet chosen</text>
  <rect x="660" y="440" width="40" height="20" fill="#ffffff" stroke="#6b7280" stroke-dasharray="4 3"/>

  <!-- legend, sources -->
  <text x="20" y="484" font-size="12" fill="#1f2937">Pale bars show phased delivery. Dashed bars depend on technology not yet commercial.</text>
  <text x="20" y="500" font-size="10" fill="#6b7280">Sources: Constellation, Vistra, Talen, NextEra, Google; NRC; Nuclear Engineering International (Palisades, Oct. 2026);</text>
  <text x="20" y="513" font-size="10" fill="#6b7280">Carnegie Endowment, "Beyond the Hype" (June 2026; new-SMR rows reflect its March 2026 tally). MW as announced for each deal.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">ICRP's three principles (justification, optimization, dose limits) with ALARA in the optimization slot, a gauge showing the dose limit as a ceiling and ALARA pushing actual dose below it, and the NRC's proposed graded thresholds</title>
  <rect width="720" height="480" fill="#f8faf9"/>
  <text x="20" y="30" font-size="18" font-weight="800" fill="#1f2937">Where ALARA sits: ICRP's three principles and the dose limit</text>

  <!-- Left: ICRP principles -->
  <text x="20" y="58" font-size="13" font-weight="800" fill="#0b6e4f">ICRP's three principles (Publ. 103, 2007)</text>

  <rect x="20" y="68" width="310" height="70" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="32" y="90" font-size="14" font-weight="800" fill="#1f2937">1. Justification</text>
  <text x="32" y="110" font-size="12" fill="#1f2937">Use radiation only if benefit exceeds harm</text>
  <text x="32" y="127" font-size="12" fill="#6b7280">e.g. smoke detectors yes, radium dials no</text>

  <rect x="20" y="148" width="310" height="104" rx="8" fill="#f5a623"/>
  <text x="32" y="172" font-size="14" font-weight="800" fill="#1f2937">2. Optimization = ALARA</text>
  <text x="32" y="190" font-size="11.5" fill="#1f2937">Likelihood, number exposed and individual</text>
  <text x="32" y="206" font-size="11.5" fill="#1f2937">doses as low as reasonably achievable,</text>
  <text x="32" y="222" font-size="11.5" fill="#1f2937">economic and societal factors considered</text>
  <text x="32" y="242" font-size="12" font-weight="800" fill="#1f2937">The term the NRC proposes to delete</text>

  <rect x="20" y="262" width="310" height="78" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="32" y="286" font-size="14" font-weight="800" fill="#1f2937">3. Dose limits</text>
  <text x="32" y="306" font-size="12" fill="#1f2937">Public 1 mSv/yr; workers 100 mSv per 5 yr</text>
  <text x="32" y="323" font-size="12" fill="#6b7280">(max 50 mSv/yr); patients exempt</text>

  <!-- Right: ceiling and downward force -->
  <text x="360" y="58" font-size="13" font-weight="800" fill="#0b6e4f">The limit is a ceiling; ALARA pushes below it</text>

  <rect x="380" y="70" width="56" height="270" rx="6" fill="#eef3f1" stroke="#6b7280"/>
  <line x1="368" y1="78" x2="448" y2="78" stroke="#c0392b" stroke-width="3"/>
  <text x="456" y="82" font-size="12" font-weight="800" fill="#c0392b">Dose limit (ceiling)</text>
  <text x="456" y="99" font-size="11" fill="#6b7280">Korea: public 1, workers 50 mSv/yr</text>

  <line x1="408" y1="105" x2="408" y2="285" stroke="#f5a623" stroke-width="4"/>
  <polygon points="396,285 420,285 408,298" fill="#f5a623"/>
  <text x="456" y="180" font-size="12" font-weight="800" fill="#1f2937">ALARA pushes dose down</text>
  <text x="456" y="197" font-size="11" fill="#6b7280">'reasonable' weighs cost and society</text>

  <rect x="380" y="300" width="56" height="40" rx="4" fill="#0b6e4f"/>
  <text x="456" y="325" font-size="12" font-weight="800" fill="#0b6e4f">Actual dose (far below the limit)</text>

  <!-- Bottom: NRC proposal -->
  <text x="20" y="368" font-size="13" font-weight="800" fill="#0b6e4f">NRC proposal (July 2026): a 'graded approach' instead of ALARA</text>

  <rect x="20" y="380" width="215" height="62" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="32" y="401" font-size="13" font-weight="800" fill="#1f2937">Above 1 mSv/yr</text>
  <text x="32" y="420" font-size="12" fill="#1f2937">radiation training</text>

  <rect x="247" y="380" width="215" height="62" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="259" y="401" font-size="13" font-weight="800" fill="#1f2937">Above 5 mSv/yr</text>
  <text x="259" y="420" font-size="12" fill="#1f2937">individual dose monitoring</text>

  <rect x="474" y="380" width="215" height="62" rx="8" fill="#ffffff" stroke="#c0392b"/>
  <text x="486" y="401" font-size="13" font-weight="800" fill="#c0392b">50 mSv/yr = the limit</text>
  <text x="486" y="418" font-size="11.5" fill="#1f2937">Limits unchanged: workers 50,</text>
  <text x="486" y="434" font-size="11.5" fill="#1f2937">public 1 mSv per year</text>

  <text x="20" y="460" font-size="10" fill="#6b7280">Sources: ICRP Publication 103 (2007); US NRC proposed rule, 91 FR 43456 (July 15, 2026);</text>
  <text x="20" y="473" font-size="10" fill="#6b7280">Korea Nuclear Safety Act Enforcement Decree, Table 1. As of 2026-10-08</text>
</svg>

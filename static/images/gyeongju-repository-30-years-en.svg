<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Thirty years to a repository: Korea's Gyeongju waste-site timeline, 1986-2026</title>
  <desc id="d">Timeline from 1986 to 2026 showing Korea's failed waste-site attempts at Anmyeondo (1990) and Buan (2003-04, 91.8 percent voted no), the 2005 four-city referendum won by Gyeongju with 89.5 percent approval, Phase 1 of the Gyeongju repository licensed in 2014-15 with 100,000 drums capacity, and Phase 2 completed in 2025-26 with 125,000 drums capacity. A callout notes that the High-Level Radioactive Waste Special Act took effect in September 2025, giving spent fuel a site-selection process but still no site, with targets of 2050 for interim storage and 2060 for disposal.</desc>
  <rect width="760" height="480" fill="#f8faf9"/>

  <!-- Title -->
  <text x="24" y="34" font-size="19" font-weight="700" fill="#111827">Thirty years to a repository</text>
  <text x="24" y="54" font-size="12" fill="#6b7280">Korea's low- and intermediate-level waste site, 1986 to 2026: failed attempts, a referendum, two completed phases</text>

  <!-- Legend -->
  <g font-size="10.5" fill="#4b5563">
    <rect x="24" y="68" width="10" height="10" rx="2" fill="#b91c1c"/>
    <text x="39" y="77">Site abandoned after opposition</text>
    <rect x="230" y="68" width="10" height="10" rx="2" fill="#0b6e4f"/>
    <text x="245" y="77">Referendum won / repository milestone</text>
    <rect x="470" y="68" width="10" height="10" rx="2" fill="#f5a623"/>
    <text x="485" y="77">Separate high-level waste track</text>
  </g>

  <!-- Timeline -->
  <line x1="60" y1="260" x2="700" y2="260" stroke="#9ca3af" stroke-width="2"/>

  <!-- Node 1: 1986 -->
  <g>
    <circle cx="70" cy="260" r="8" fill="#9ca3af"/>
    <text x="70" y="228" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111827">1986</text>
    <text x="70" y="286" font-size="10.5" text-anchor="middle" fill="#374151">Site search</text>
    <text x="70" y="299" font-size="10.5" text-anchor="middle" fill="#374151">begins</text>
  </g>

  <!-- Node 2: 1990 -->
  <g>
    <circle cx="190" cy="260" r="8" fill="#b91c1c"/>
    <text x="190" y="228" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111827">1990</text>
    <text x="190" y="286" font-size="10.5" text-anchor="middle" fill="#374151">Anmyeondo</text>
    <text x="190" y="299" font-size="10.5" text-anchor="middle" fill="#374151">protests halt plan</text>
  </g>

  <!-- Node 3: 2003-04 -->
  <g>
    <circle cx="320" cy="260" r="8" fill="#b91c1c"/>
    <text x="320" y="228" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111827">2003-04</text>
    <text x="320" y="286" font-size="10.5" text-anchor="middle" fill="#374151">Buan conflict;</text>
    <text x="320" y="299" font-size="10.5" text-anchor="middle" fill="#374151">site scrapped</text>
    <text x="320" y="317" font-size="12" font-weight="700" text-anchor="middle" fill="#b91c1c">91.8% voted no</text>
  </g>

  <!-- Node 4: 2005 -->
  <g>
    <circle cx="450" cy="260" r="8" fill="#0b6e4f"/>
    <text x="450" y="228" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111827">2005</text>
    <text x="450" y="286" font-size="10.5" text-anchor="middle" fill="#374151">4-city referendum;</text>
    <text x="450" y="299" font-size="10.5" text-anchor="middle" fill="#374151">Gyeongju wins</text>
    <text x="450" y="317" font-size="12" font-weight="700" text-anchor="middle" fill="#0b6e4f">89.5% approved</text>
  </g>

  <!-- Node 5: 2014-15 -->
  <g>
    <circle cx="580" cy="260" r="8" fill="#0b6e4f"/>
    <text x="580" y="228" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111827">2014-15</text>
    <text x="580" y="286" font-size="10.5" text-anchor="middle" fill="#374151">Phase 1 licensed;</text>
    <text x="580" y="299" font-size="10.5" text-anchor="middle" fill="#374151">cavern silos open</text>
    <text x="580" y="317" font-size="12" font-weight="700" text-anchor="middle" fill="#0b6e4f">100,000 drums</text>
  </g>

  <!-- Node 6: 2025-26 -->
  <g>
    <circle cx="700" cy="260" r="8" fill="#0b6e4f"/>
    <text x="700" y="228" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111827">2025-26</text>
    <text x="700" y="286" font-size="10.5" text-anchor="middle" fill="#374151">Phase 2 complete;</text>
    <text x="700" y="299" font-size="10.5" text-anchor="middle" fill="#374151">near-surface vault</text>
    <text x="700" y="317" font-size="12" font-weight="700" text-anchor="middle" fill="#0b6e4f">125,000 drums</text>
  </g>

  <!-- Callout: HLW Act -->
  <g>
    <rect x="60" y="350" width="640" height="66" rx="8" fill="#fff7ea" stroke="#f5a623" stroke-width="1.5"/>
    <text x="80" y="373" font-size="12" font-weight="700" fill="#92400e">Meanwhile, a separate track: spent fuel</text>
    <text x="80" y="392" font-size="11" fill="#4b5563">High-Level Radioactive Waste Special Act in force Sept 26, 2025: a site-selection</text>
    <text x="80" y="407" font-size="11" fill="#4b5563">process now exists, but no site yet. Targets: interim storage 2050, disposal 2060.</text>
  </g>

  <!-- Footer -->
  <line x1="24" y1="440" x2="736" y2="440" stroke="#e5e7eb"/>
  <text x="24" y="458" font-size="10" fill="#6b7280">As of September 2026 · Sources: KORAD, National Assembly, Ministry of Climate, Energy and Environment</text>
  <text x="736" y="458" font-size="10" fill="#6b7280" text-anchor="end">energynote.kr</text>
</svg>

baseURL = "https://energynote.kr/"
title = "에너지노트"
timeZone = "Asia/Seoul"
enableEmoji = true
summaryLength = 40

defaultContentLanguage = "ko"
defaultContentLanguageInSubdir = false

[languages]
  [languages.ko]
    languageName = "한국어"
    languageCode = "ko-KR"
    contentDir = "content"
    weight = 1
    title = "에너지노트"
    [languages.ko.params]
      description = "방사선 전문가가 쉽게 풀어주는 생활 속 방사선 안전과 원자력·에너지 이야기"
      author = "에너지노트"
  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    contentDir = "content_en"
    weight = 2
    title = "EnergyNote"
    [languages.en.params]
      description = "Nuclear energy, SMRs and radiation safety, explained by a Korean nuclear professional — with a view from inside Korea's nuclear industry."
      author = "EnergyNote"

[pagination]
pagerSize = 10

[taxonomies]
category = "categories"
tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      strikethrough = false
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
home = ["html", "rss"]
section = ["html", "rss"]

[sitemap]
changefreq = "weekly"
priority = 0.5

# 태그 페이지(글 1개짜리가 대부분)는 사이트맵 제외 — 애드센스 '콘텐츠 부족 페이지' 방지
[[cascade]]
  [cascade.sitemap]
    disable = true
  [cascade.target]
    path = "{/tags,/tags/**}"
